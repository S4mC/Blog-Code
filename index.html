<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blog Code</title>
        <link rel="icon" type="image/png" sizes="32x32" href="public/icon.ico">
        <link rel="stylesheet" href="cdn/font/ubuntu-font.css" />
        <link rel="stylesheet" href="styles/global-styles.css" />
        <script type="importmap">
            {
                "imports": {
                    "preact": "./cdn/preact/preact.mjs",
                    "preact/hooks": "./cdn/preact/hooks.mjs",
                    "htm/preact": "./cdn/preact/htm-preact.mjs",
                    "config": "./config.js"
                }
            }
        </script>
    </head>
    <body data-open-sidebar-resize="false">
        <div id="app"></div>

        <script type="module">
            import { render } from "preact";
            import { useState, useEffect, useRef } from "preact/hooks";
            import { html } from "htm/preact";
            import { Header } from "./components/Header.js";
            import { Sidebar, initSidebar } from "./components/Sidebar.js";
            import CONFIG, { getSearchJson } from "config";

            // Set the document title to the app copyright from config
            document.title = CONFIG.app.name;
            
            // Extract folder path from path (all folders before the filename)
            function extractFolderPath(path) {

                if (path.startsWith("http")) {
                    try {
                        const url = new URL(path);
                        let pathname = url.pathname;
                        
                        // Find the 'posts' folder in the path and extract everything after it
                        const postsIndex = pathname.indexOf('/posts/');
                        if (postsIndex !== -1) {
                            // Extract the part after '/posts/'
                            const afterPosts = pathname.substring(postsIndex + 7); // 7 = length of '/posts/'
                            // Combine hostname with the file after posts
                            path = `${url.hostname}/${afterPosts}`;
                        }else{
                            // If no 'posts' folder, use pathname without leading slash
                            path = `${url.hostname}${pathname.startsWith('/') ? pathname : '/' + pathname}`;
                        }
                    } catch (e) {
                        console.error("Invalid URL:", path);
                        return null;
                    }
                }

                if (!path || typeof path !== 'string') return null;
                const parts = path.split('/');
                // If there's more than one part, everything except the last part is the folder path
                if (parts.length > 1) {
                    return parts.slice(0, -1).join('/');
                }
                return null;
            }

            function BlogList({ entries }) {
                return html`
                    <div class="blog-list">
                        ${entries.map(
                            (entry) => html`
                                <article
                                    key=${entry.path}
                                    class="blog-entry-card"
                                >
                                    <h3>
                                        <a
                                            href=${`./post.html?path=${encodeURIComponent(
                                                entry.path
                                            )}`}
                                        >
                                            ${entry.title}
                                        </a>
                                    </h3>
                                    <p class="entry-summary">
                                        ${entry.summary}
                                    </p>
                                    <div class="entry-meta">
                                        <span class="entry-date"
                                            >${entry.date}</span
                                        >
                                        ${entry.tags &&
                                        html`
                                            <div class="entry-tags">
                                                ${entry.tags.map(
                                                    (tag) => html`
                                                        <a
                                                            key=${tag}
                                                            class="tag"
                                                            href=${`./index.html?tags=${encodeURIComponent(
                                                                tag
                                                            )}`}
                                                            >${tag}</a
                                                        >
                                                    `
                                                )}
                                            </div>
                                        `}
                                    </div>
                                </article>
                            `
                        )}
                    </div>
                `;
            }

            function App() {
                const [entries, setEntries] = useState([]);
                const [allEntries, setAllEntries] = useState([]);
                const [filterTags, setFilterTags] = useState([]);
                const [filterFolder, setFilterFolder] = useState(null);
                const [showAddTag, setShowAddTag] = useState(false);
                const [newTagInput, setNewTagInput] = useState('');
                const [availableTags, setAvailableTags] = useState([]);
                const [selectedIndex, setSelectedIndex] = useState(-1);
                const addTagInputRef = useRef(null);

                useEffect(() => {
                    // Get tags and folder from URL parameters
                    const urlParams = new URLSearchParams(window.location.search);
                    const tagsParam = urlParams.get('tags');
                    const folderParam = urlParams.get('folder');
                    const activeTags = tagsParam ? tagsParam.split(',').map(tag => tag.trim()) : [];
                    setFilterTags(activeTags);
                    if (folderParam) {
                        setFilterFolder(folderParam);
                    }
                }, []);

                useEffect(() => {
                    getSearchJson()
                        .then((data) => {
                            // Resolve relative paths to absolute URLs
                            let entries = data.entries || [];

                            entries = entries.filter(entry => {
                                if (entry.hidden) return false;
                                // Check if entry has at least one of the filter tags
                                return entry
                            });

                            // Store all entries for extracting all available tags
                            setAllEntries(entries);

                            // Filter entries by folder if folder parameter exists
                            if (filterFolder) {
                                if (filterFolder === '__root__') {
                                    // Show only posts without folder
                                    entries = entries.filter(entry => {
                                        const folderPath = extractFolderPath(entry.path);
                                        return !folderPath;
                                    });
                                } else {
                                    // Show posts from specific folder path (exact match or nested)
                                    entries = entries.filter(entry => {
                                        const folderPath = extractFolderPath(entry.path);
                                        return folderPath && folderPath.startsWith(filterFolder);
                                    });
                                }
                            }

                            // Filter entries by tags if tags parameter exists
                            if (filterTags.length > 0) {
                                entries = entries.filter(entry => {
                                    if (!entry.tags || entry.tags.length === 0) return false;
                                    // Check if entry has at least one of the filter tags
                                    return entry.tags.some(tag => 
                                        filterTags.some(filterTag => 
                                            tag.toLowerCase() === filterTag.toLowerCase()
                                        )
                                    );
                                });
                            }

                            setEntries(entries);
                            
                            // Initialize sidebar with folders
                            initializeSidebar(data.entries || []);
                        })
                        .catch((err) =>
                            console.error("Error loading entries:", err)
                        );
                }, [filterTags, filterFolder]);
                
                // Function to initialize sidebar with folder structure
                const initializeSidebar = (allEntries) => {
                    // Build a hierarchical folder tree
                    const folderTree = new Map();
                    let postsWithoutFolder = 0;
                    
                    allEntries.forEach(entry => {
                        if (entry.hidden) return;
                        
                        const folderPath = extractFolderPath(entry.path);
                        if (folderPath) {
                            const parts = folderPath.split('/');
                            
                            // Add each level of the folder hierarchy
                            let currentPath = '';
                            parts.forEach((part, index) => {
                                currentPath = index === 0 ? part : `${currentPath}/${part}`;
                                
                                if (!folderTree.has(currentPath)) {
                                    folderTree.set(currentPath, {
                                        path: currentPath,
                                        name: part,
                                        level: index,
                                        count: 0,
                                        directCount: 0
                                    });
                                }
                            });
                            
                            // Increment count for the full path (direct posts in this folder)
                            const folder = folderTree.get(folderPath);
                            if (folder) {
                                folder.directCount++;
                            }
                            
                            // Increment count for all parent folders
                            let parentPath = '';
                            parts.forEach((part, index) => {
                                parentPath = index === 0 ? part : `${parentPath}/${part}`;
                                const parentFolder = folderTree.get(parentPath);
                                if (parentFolder) {
                                    parentFolder.count++;
                                }
                            });
                        } else {
                            postsWithoutFolder++;
                        }
                    });
                    
                    // Create sidebar data structure
                    const sidebarData = [];
                    
                    // Add "All Posts" option
                    const totalPosts = allEntries.filter(e => !e.hidden).length;
                    sidebarData.push(`## 📚 All Posts (${totalPosts})`);
                    
                    // Sort folders by path (alphabetically and by hierarchy)
                    const sortedFolders = Array.from(folderTree.values()).sort((a, b) => {
                        return a.path.localeCompare(b.path);
                    });
                    
                    // Add folders as sections with hierarchy
                    sortedFolders.forEach(folder => {
                        const indent = '⠀⠀'.repeat(folder.level); // Unicode space for indentation
                        const icon = folder.level === 0 ? '📁' : '📂';
                        // Store the full path as data attribute for filtering
                        sidebarData.push(`## ${indent ? indent + '├─ ' : ''}${icon} ${folder.name} (${folder.count})|||${folder.path}`);
                    });
                    
                    // Add posts without folder if any
                    if (postsWithoutFolder > 0) {
                        sidebarData.push(`## 📄 Root (${postsWithoutFolder})`);
                    }
                    
                    // Function to attach folder click handlers
                    const attachFolderHandlers = () => {
                        // Remove previous listeners to avoid duplicates
                        const oldHandlers = document.querySelectorAll('.sidebar-component .section-header');
                        oldHandlers.forEach(header => {
                            const newHeader = header.cloneNode(true);
                            header.parentNode.replaceChild(newHeader, header);
                        });
                        
                        // Add click handlers for folders
                        document.querySelectorAll('.sidebar-component .section-header').forEach(header => {
                            header.addEventListener('click', (e) => {
                                const section = e.target.closest('.section');
                                if (!section) return;
                                
                                const titleElement = section.querySelector('.section-title');
                                if (!titleElement) return;
                                
                                const titleText = titleElement.textContent.trim();
                                
                                // Get the folder path from data attribute (for nested folders)
                                const folderPath = section.dataset.folderPath;
                                
                                // Extract folder name (remove emoji and count in parentheses)
                                const folderMatch = titleText.match(/^(📚|📁|📂|📄)\s*(.+?)\s*\(/);
                                const folderName = folderMatch ? folderMatch[2].trim() : titleText;
                                
                                if (folderName === 'All Posts') {
                                    // Clear folder filter
                                    setFilterFolder(null);
                                    updateURLWithFilters(filterTags, null);
                                } else if (folderName === 'Root') {
                                    // Filter posts without folder
                                    setFilterFolder('__root__');
                                    updateURLWithFilters(filterTags, '__root__');
                                } else {
                                    // Filter by folder - use full path if available
                                    const filterValue = folderPath || folderName;
                                    setFilterFolder(filterValue);
                                    updateURLWithFilters(filterTags, filterValue);
                                }
                                
                                // Highlight active folder
                                document.querySelectorAll('.sidebar-component .section').forEach(s => {
                                    s.classList.remove('active-folder');
                                });
                                section.classList.add('active-folder');
                                
                                // Close sidebar after selecting a folder
                                const sidebar = document.getElementById('sidebar');
                                const overlay = document.getElementById('sidebarOverlay');
                                if (sidebar) sidebar.classList.remove('open');
                                if (overlay) overlay.classList.remove('active');
                                window.document.body.style.overflow = "auto";
                            });
                        });
                    };
                    
                    // Make the function globally accessible so it can be called after sidebar re-renders
                    window.attachIndexFolderHandlers = attachFolderHandlers;
                    
                    // Initialize sidebar after DOM is ready
                    setTimeout(() => {
                        initSidebar(sidebarData);
                        attachFolderHandlers();
                        
                        // Highlight current folder if any
                        if (filterFolder) {
                            const folderName = filterFolder === '__root__' ? 'Root' : filterFolder;
                            document.querySelectorAll('.sidebar-component .section').forEach(section => {
                                const folderPath = section.dataset.folderPath;
                                const titleText = section.querySelector('.section-title')?.textContent.trim();
                                
                                // Check if this section matches the current filter
                                if (folderPath === filterFolder || titleText?.includes(folderName)) {
                                    section.classList.add('active-folder');
                                }
                            });
                        } else {
                            // Highlight "All Posts" by default
                            const allPostsSection = Array.from(document.querySelectorAll('.sidebar-component .section-title'))
                                .find(title => title.textContent.trim().includes('All Posts'));
                            if (allPostsSection) {
                                allPostsSection.closest('.section').classList.add('active-folder');
                            }
                        }
                    }, 100);
                };

                // Extract and filter available tags based on input
                useEffect(() => {
                    if (!showAddTag || !newTagInput.trim()) {
                        setAvailableTags([]);
                        return;
                    }

                    // Get all unique tags from all entries
                    const allTagsSet = new Set();
                    allEntries.forEach(entry => {
                        if (entry.tags && entry.tags.length > 0) {
                            entry.tags.forEach(tag => allTagsSet.add(tag));
                        }
                    });

                    // Filter tags based on input and exclude already selected tags
                    const searchTerm = newTagInput.toLowerCase().trim();
                    const filtered = Array.from(allTagsSet)
                        .filter(tag => 
                            tag.toLowerCase().includes(searchTerm) &&
                            !filterTags.some(ft => ft.toLowerCase() === tag.toLowerCase())
                        )
                        .slice(0, 8); // Limit to 8 suggestions

                    setAvailableTags(filtered);
                    setSelectedIndex(-1); // Reset selection when suggestions change
                }, [newTagInput, showAddTag, allEntries, filterTags]);

                // Focus input when showAddTag becomes true
                useEffect(() => {
                    if (showAddTag && addTagInputRef.current) {
                        addTagInputRef.current.focus();
                    }
                }, [showAddTag]);

                const updateURLWithTags = (tags) => {
                    updateURLWithFilters(tags, filterFolder);
                };
                
                const updateURLWithFilters = (tags, folder) => {
                    const params = new URLSearchParams();
                    
                    if (tags.length > 0) {
                        params.set('tags', tags.join(','));
                    }
                    
                    if (folder && folder !== '__root__') {
                        params.set('folder', folder);
                    } else if (folder === '__root__') {
                        params.set('folder', '__root__');
                    }
                    
                    const newUrl = params.toString() ? `./index.html?${params.toString()}` : './index.html';
                    window.history.pushState({}, '', newUrl);
                };

                const removeTag = (tagToRemove) => {
                    const newTags = filterTags.filter(tag => tag.toLowerCase() !== tagToRemove.toLowerCase());
                    setFilterTags(newTags);
                    updateURLWithTags(newTags);
                };

                const addTag = (e, suggestedTag = null) => {
                    if (e) e.preventDefault();
                    const trimmedTag = suggestedTag || newTagInput.trim();
                    if (trimmedTag && !filterTags.some(tag => tag.toLowerCase() === trimmedTag.toLowerCase())) {
                        const newTags = [...filterTags, trimmedTag];
                        setFilterTags(newTags);
                        updateURLWithTags(newTags);
                        setNewTagInput('');
                        setShowAddTag(false);
                        setSelectedIndex(-1);
                    }
                };

                const cancelAddTag = () => {
                    setShowAddTag(false);
                    setNewTagInput('');
                    setAvailableTags([]);
                    setSelectedIndex(-1);
                };

                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        cancelAddTag();
                        return;
                    }

                    // Navigate through suggestions with arrow keys
                    if (availableTags.length > 0) {
                        if (e.key === 'ArrowDown') {
                            e.preventDefault();
                            setSelectedIndex(prev => 
                                prev < availableTags.length - 1 ? prev + 1 : prev
                            );
                        } else if (e.key === 'ArrowUp') {
                            e.preventDefault();
                            setSelectedIndex(prev => prev > 0 ? prev - 1 : -1);
                        } else if (e.key === 'Enter' && selectedIndex >= 0) {
                            e.preventDefault();
                            addTag(null, availableTags[selectedIndex]);
                        }
                    }
                };

                const handleNavigateToEntry = (entry) => {
                    window.location.href = `./post.html?path=${encodeURIComponent(
                        entry.path
                    )}`;
                };

                const clearFilters = () => {
                    setFilterTags([]);
                    setFilterFolder(null);
                    window.history.pushState({}, '', './index.html');
                };

                return html`
                    <div class="app">
                        <${Header} showSearch=${true} onNavigateToEntry=${handleNavigateToEntry} />

                        <main class="main-container">
                            <${Sidebar} />
                            <div class="content-wrapper">
                                ${(filterTags.length > 0 || filterFolder) && html`
                                    <div class="filter-notice">
                                        <div class="filter-info">
                                            <span class="filter-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" fill-opacity="0" stroke="currentColor" stroke-dasharray="56" stroke-dashoffset="56" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4h14l-5 6.5v9.5l-4 -4v-5.5Z"><animate fill="freeze" attributeName="fill-opacity" begin="0.6s" dur="0.5s" values="0;1"/><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.6s" values="56;0"/></path></svg></span>
                                            <span>Filtering posts${filterFolder ? ' in folder' : ''}${filterTags.length > 0 ? ' by tags' : ''}: </span>
                                            <div class="filter-tags">
                                                ${filterFolder && html`
                                                    <span class="filter-tag">
                                                        📁 ${filterFolder === '__root__' ? 'Root' : filterFolder}
                                                        <button 
                                                            class="remove-tag-btn" 
                                                            onClick=${() => {
                                                                setFilterFolder(null);
                                                                updateURLWithFilters(filterTags, null);
                                                            }}
                                                            title="Remove folder filter"
                                                        >
                                                            ✕
                                                        </button>
                                                    </span>
                                                `}
                                                ${filterTags.map(tag => html`
                                                    <span key=${tag} class="filter-tag">
                                                        ${tag}
                                                        <button 
                                                            class="remove-tag-btn" 
                                                            onClick=${() => removeTag(tag)}
                                                            title="Remove tag"
                                                        >
                                                            ✕
                                                        </button>
                                                    </span>
                                                `)}
                                                ${!showAddTag && html`
                                                    <button 
                                                        class="add-tag-btn" 
                                                        onClick=${() => setShowAddTag(true)}
                                                        title="Add new tag"
                                                    >
                                                        +
                                                    </button>
                                                `}
                                                ${showAddTag && html`
                                                    <div class="add-tag-wrapper">
                                                        <form class="add-tag-form" onSubmit=${addTag}>
                                                            <input 
                                                                type="text" 
                                                                class="add-tag-input"
                                                                value=${newTagInput}
                                                                onInput=${(e) => setNewTagInput(e.target.value)}
                                                                onKeyDown=${handleKeyDown}
                                                                placeholder="Enter tag..."
                                                                ref=${addTagInputRef}
                                                            />
                                                            <button type="submit" class="add-tag-submit" title="Add tag">✓</button>
                                                            <button 
                                                                type="button" 
                                                                class="add-tag-cancel" 
                                                                onClick=${cancelAddTag}
                                                                title="Cancel (Esc)"
                                                            >
                                                                ✕
                                                            </button>
                                                        </form>
                                                        ${availableTags.length > 0 && html`
                                                            <div class="tag-suggestions">
                                                                ${availableTags.map((tag, index) => html`
                                                                    <div 
                                                                        key=${tag}
                                                                        class=${`tag-suggestion-item ${index === selectedIndex ? 'selected' : ''}`}
                                                                        onClick=${() => addTag(null, tag)}
                                                                        onMouseEnter=${() => setSelectedIndex(index)}
                                                                    >
                                                                        <span class="suggestion-icon">🏷️</span>
                                                                        ${tag}
                                                                    </div>
                                                                `)}
                                                            </div>
                                                        `}
                                                    </div>
                                                `}
                                            </div>
                                        </div>
                                        <button class="clear-filters-btn" onClick=${clearFilters}>
                                            Clear filters⠀✕
                                        </button>
                                    </div>
                                `}
                                <${BlogList} entries=${entries} />
                            </div>
                        </main>

                        <div class="footer">
                            <p>${CONFIG.app.copyright.replace("<year>", new Date().getFullYear())}</p>
                        </div>
                    </div>
                `;
            }

            render(html`<${App} />`, document.getElementById("app"));
        </script>
    </body>
</html>
