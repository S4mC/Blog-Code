<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blog Entry</title>
        <link rel="icon" type="image/png" sizes="32x32" href="public/icon.ico">
        <link rel="stylesheet" href="cdn/font/ubuntu-font.css" />
        <link rel="stylesheet" href="styles/global-styles.css" />
        <link rel="stylesheet" href="styles/post-styles.css" />
        <link rel="stylesheet" href="cdn/prism/prism_vsc.css" />
        <script src="cdn/prism/prism.js"></script>
        <script src="cdn/bodymovin/lottie.js"></script>
        <script src="cdn/marked/marked.umd.js"></script>
        <script src="cdn/SVGpanzoom/svg-pan-zoom.js"></script>
        <script type="importmap">
            {
                "imports": {
                    "preact": "./cdn/preact/preact.mjs",
                    "preact/hooks": "./cdn/preact/hooks.mjs",
                    "htm/preact": "./cdn/preact/htm-preact.mjs",
                    "config": "./config.js"
                }
            }
        </script>
    </head>
    <body>
        <div id="app"></div>

        <script type="module">
            import { render } from "preact";
            import { useState, useEffect, useRef } from "preact/hooks";
            import { html } from "htm/preact";
            import { Header } from "./components/Header.js";
            import { Sidebar, initSidebar } from "./components/Sidebar.js";
            import {
                renderMarkdown,
                showCopySuccess,
                manageEscapeIframe,
                manageClickFloatButton,
            } from "./components/MarkdownProcessor.js";
            import CONFIG, { resolveContentPath } from "config";

            // Handler for Escape key
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") {
                    manageEscapeIframe();
                }
            });

            document.addEventListener("click", function (e) {
                manageClickFloatButton(e);
            });

            function BlogEntry() {
                const [content, setContent] = useState("");
                const [title, setTitle] = useState("");
                const [loading, setLoading] = useState(true);
                const [error, setError] = useState(null);
                const [allowedPosts, setAllowedPosts] = useState(null);

                /**
                 * Load allowed posts from search.json if strict mode is enabled
                 */
                useEffect(() => {
                    if (CONFIG.security.strictMode) {
                        fetch(`${CONFIG.contentUrl}/search.json`)
                            .then(res => res.json())
                            .then(data => {
                                // Resolve relative paths and create set
                                const paths = data.entries.map(entry => resolveContentPath(entry.path));
                                setAllowedPosts(new Set(paths));
                            })
                            .catch(err => {
                                console.error('[Strict Mode] Failed to load search.json:', err);
                                setAllowedPosts(new Set()); // Empty set = no posts allowed
                            });
                    }
                }, []);

                /**
                 * Validates if a URL is from an allowed domain
                 * @param {string} url - The URL to validate
                 * @returns {boolean} - True if allowed, false otherwise
                 */
                const isAllowedDomain = (url) => {
                    try {
                        // Allow relative paths (local files)
                        if (url.startsWith('./') || url.startsWith('../') || !url.includes('://')) {
                            return true;
                        }

                        const urlObj = new URL(url);
                        const origin = urlObj.origin;

                        return CONFIG.security.allowedDomains.some(domain => origin.startsWith(domain));
                    } catch (e) {
                        console.error('[Security] Invalid URL:', url);
                        return false;
                    }
                };

                /**
                 * Validates if a post is in the allowed list (strict mode)
                 * @param {string} path - The post path to validate
                 * @returns {boolean} - True if allowed, false otherwise
                 */
                const isAllowedPost = (path) => {
                    if (!CONFIG.security.strictMode) {
                        return true; // Strict mode disabled, allow all
                    }

                    if (allowedPosts === null) {
                        return false; // Still loading, deny for now
                    }

                    const isAllowed = allowedPosts.has(path);

                    return isAllowed;
                };

                const handleNavigateToEntry = (entry) => {
                    window.location.href = `./post.html?path=${encodeURIComponent(entry.path)}`;
                };

                useEffect(() => {
                    const urlParams = new URLSearchParams(
                        window.location.search
                    );
                    let entryPath = urlParams.get("path");

                    if (!entryPath) {
                        setError("Entry path not specified");
                        setLoading(false);
                        return;
                    }

                    // Resolve relative paths to absolute URLs
                    const resolvedPath = resolveContentPath(entryPath);

                    // Security check 1: Validate domain whitelist
                    if (!isAllowedDomain(resolvedPath)) {
                        setError(`Security Error: Domain not allowed. Only posts from authorized domains can be loaded.`);
                        setLoading(false);
                        console.error('[Security] Attempted to load post from unauthorized domain:', resolvedPath);
                        return;
                    }

                    // Security check 2: Validate against search.json (strict mode)
                    if (CONFIG.security.strictMode) {
                        if (allowedPosts === null) {
                            // Still loading search.json, wait
                            return;
                        }

                        if (!isAllowedPost(resolvedPath)) {
                            setError(`Security Error: Post not found in authorized list. Only posts listed in search.json can be loaded.`);
                            setLoading(false);
                            console.error('[Security - Strict Mode] Attempted to load unlisted post:', resolvedPath);
                            return;
                        }
                    }

                    // Load Markdown file
                    fetch(resolvedPath)
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error(
                                    `Error ${response.status}: ${response.statusText}`
                                );
                            }
                            return response.text();
                        })
                        .then((markdownContent) => {
                            let sidebarContent = [];
                            let finalJS = "";
                            let finalHtml = "";

                            if (resolvedPath.endsWith(".html")) {
                                // Handle HTML content
                                setContent(markdownContent);
                                // Extract title from <title> tag
                                const parser = new DOMParser();
                                const doc = parser.parseFromString(markdownContent, "text/html");
                                
                                // Extract title from first h1 using the parser
                                const firstH1 = doc.querySelector("h1");
                                if (firstH1) {
                                    setTitle(firstH1.textContent);
                                    document.title = firstH1.textContent + " - " + CONFIG.app.name;
                                }

                                finalJS = doc.getElementById("entry-script").textContent;

                                sidebarContent = JSON.parse(
                                    doc.getElementById("sidebar-data").textContent
                                );
                            }else{
                                [finalHtml, sidebarContent, finalJS] = renderMarkdown(markdownContent);

                                setContent(finalHtml);

                                // Extract title from first h1
                                const titleMatch =
                                    markdownContent.match(/^#\s+(.+)$/m);
                                if (titleMatch) {
                                    setTitle(titleMatch[1]);
                                    document.title = titleMatch[1] + " - " + CONFIG.app.name;
                                }
                            }

                            setLoading(false);

                            // Apply syntax highlighting after rendering
                            setTimeout(() => {
                                if (window.Prism) {
                                    window.Prism.highlightAll();
                                }
                                initSidebar(sidebarContent);
                                eval(finalJS);
                            }, 100);
                        })
                        .catch((err) => {
                            console.error("Error loading entry:", err);
                            setError(err.message);
                            setLoading(false);
                        });
                }, [allowedPosts]); // Re-run when allowedPosts changes

                return html`
                    <div class="app">
                        <${Header} showSearch=${true} onNavigateToEntry=${handleNavigateToEntry} />
                        
                        <main class="main-container">
                            <${Sidebar} />
                            ${loading ? html`
                                <div class="loading">Loading entry...</div>
                            ` : error ? html`
                                <div class="error">
                                    <h2>Error loading entry</h2>
                                    <p>${error}</p>
                                    <a href="./index.html">← Back to home</a>
                                </div>
                            ` : html`
                                <article class="blog-entry">
                                    <div class="entry-navigation">
                                        <a href="./index.html">← Back to home</a>
                                    </div>
                                    <div
                                        class="entry-content"
                                        dangerouslySetInnerHTML=${{
                                            __html: content,
                                        }}
                                    />
                                </article>
                            `}
                        </main>
                        <footer class="footer">
                            <p>${CONFIG.app.copyright}</p>
                        </footer>
                    </div>
                `;
            }

            render(html`<${BlogEntry} />`, document.getElementById("app"));

            setTimeout(() => {
                initSidebar([]);
            }, 0);
        </script>
    </body>
</html>
