                                        <button onClick=${insertIframe} title="Iframe">
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="20"
                                                viewBox="0 0 2048 1548"
                                            >
                                                <path
                                                    fill="currentColor"
                                                    d="M960 768q93 0 174 35t142 96t96 142t36 175q0 93-35 174t-96 142t-142 96t-175 36q-93 0-174-35t-142-96t-96-142t-36-175q0-93 35-174t96-142t142-96t175-36m346 384q-15-80-63-145t-120-103q29 58 42 121t17 127zm-221 128H834q1 16 4 44t10 60t17 64t24 59t31 44t40 17q21 0 38-17t30-44t24-60t17-65t11-59t5-43m-251-128h252q-1-15-5-42t-11-59t-17-65t-24-60t-31-45t-38-17q-22 0-39 17t-31 44t-24 60t-17 65t-10 59t-5 43m-41-246q-35 19-64 45t-53 57t-39 68t-23 76h124q4-63 16-125t39-121m-179 374q14 78 61 142t116 103q-26-57-37-119t-16-126zm510 248q71-38 119-103t63-145h-124q-5 63-18 126t-40 122M1115 0l549 549v1371H256V0zm37 219v293h293zM384 1792h1152V640h-512V128H384z"
                                                ></path>
                                            </svg>
                                        </button>

                                        <button
                                            onClick=${() =>
                                                insertText(
                                                    '\n```svg style="height:15em;"\n',
                                                    "\n```\n"
                                                )}
                                            title="SVG Container"
                                        >
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="18"
                                                viewBox="0 0 24 18"
                                            >
                                                <path
                                                    fill="none"
                                                    stroke="currentColor"
                                                    stroke-linecap="round"
                                                    stroke-linejoin="round"
                                                    stroke-width="2"
                                                    d="M21 8h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2v-4h-1M7 8H4a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H3m7-8l1.5 8h1L14 8"
                                                />
                                            </svg>
                                        </button>
                                        <button
                                            onClick=${() =>
                                                insertText(
                                                    '\n```animation-loop-autoplay style="height:15em;"\npublic/bodymovin.json',
                                                    "\n```\n"
                                                )}
                                            title="Animation Container"
                                        >
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="18"
                                                viewBox="0 0 24 18"
                                            >
                                                <path fill="currentColor" d="M4 2h10v2H4v10H2V4c0-1.11.89-2 2-2m4 4h10v2H8v10H6V8c0-1.11.89-2 2-2m4 4h8c1.11 0 2 .89 2 2v8c0 1.11-.89 2-2 2h-8c-1.11 0-2-.89-2-2v-8c0-1.11.89-2 2-2m2 2v8l6-4z"/>
                                            </svg>
                                        </button>
                                        <button
                                            onClick=${() =>
                                                insertText(
                                                    "\n:::details-open Collapsible Element\n",
                                                    "\n:::\n"
                                                )}
                                            title="Collapsible Element"
                                        >
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="18"
                                                viewBox="0 0 25 18"
                                            >
                                                <path
                                                    fill="currentColor"
                                                    d="M11.65 14.65q.15.15.35.15t.35-.15l2.8-2.8q.25-.25.125-.55T14.8 11H9.2q-.35 0-.475.3t.125.55zM12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12t-2.325-5.675T12 4T6.325 6.325T4 12t2.325 5.675T12 20m0-8"
                                                />
                                            </svg>
                                        </button>
                                        <button
                                            class="editor-menu"
                                            style="padding-left: 4px;"
                                            onClick=${(e) => {
                                                // Solo actuar si el click fue directamente en el botón principal (no en los hijos)
                                                if (e.target === e.currentTarget) {
                                                    const menu =
                                                        e.currentTarget.querySelector(".menu-content");
                                                    const isVisible = menu.style.display === "block";
                                                    menu.style.display = isVisible ? "none" : "block";

                                                    if (!isVisible) {
                                                        // Inicializamos el grid selector cuando se abre el menú
                                                        setTimeout(() => {
                                                            const tableGrid =
                                                                menu.querySelector(
                                                                    ".table-grid-container"
                                                                );
                                                            const dimensionsEl =
                                                                menu.querySelector(
                                                                    ".table-grid-dimensions"
                                                                );

                                                            if (tableGrid) {
                                                                // Inicializamos la función de actualización
                                                                const updateActiveCells = (
                                                                    rows,
                                                                    cols
                                                                ) => {
                                                                    const cells =
                                                                        tableGrid.querySelectorAll(
                                                                            ".table-grid-cell"
                                                                        );
                                                                    cells.forEach((cell, index) => {
                                                                        const cellRow =
                                                                            Math.floor(index / 10) + 1;
                                                                        const cellCol = (index % 10) + 1;

                                                                        if (
                                                                            cellRow <= rows &&
                                                                            cellCol <= cols
                                                                        ) {
                                                                            cell.classList.add("active");
                                                                        } else {
                                                                            cell.classList.remove(
                                                                                "active"
                                                                            );
                                                                        }
                                                                    });

                                                                    if (dimensionsEl) {
                                                                        dimensionsEl.textContent = `${cols}x${rows}`;
                                                                    }
                                                                };

                                                                // Inicializamos la cuadrícula con 1x1
                                                                updateActiveCells(1, 1);

                                                                // Solo configuramos los eventos si no están ya configurados
                                                                if (!tableGrid.hasInitializedEvents) {
                                                                    // Evento para el hover
                                                                    tableGrid.mousemoveHandler = (
                                                                        event
                                                                    ) => {
                                                                        const cell = event.target;
                                                                        if (
                                                                            cell.classList.contains(
                                                                                "table-grid-cell"
                                                                            )
                                                                        ) {
                                                                            const index = Array.from(
                                                                                tableGrid.children
                                                                            ).indexOf(cell);
                                                                            const hoveredRows =
                                                                                Math.floor(index / 10) +
                                                                                1;
                                                                            const hoveredCols =
                                                                                (index % 10) + 1;
                                                                            updateActiveCells(
                                                                                hoveredRows,
                                                                                hoveredCols
                                                                            );
                                                                        }
                                                                    };

                                                                    // Evento para el click
                                                                    tableGrid.clickHandler = (event) => {
                                                                        const cell = event.target;
                                                                        if (
                                                                            cell.classList.contains(
                                                                                "table-grid-cell"
                                                                            )
                                                                        ) {
                                                                            const index = Array.from(
                                                                                tableGrid.children
                                                                            ).indexOf(cell);
                                                                            const rows =
                                                                                Math.floor(index / 10) +
                                                                                1;
                                                                            const cols =
                                                                                (index % 10) + 1;

                                                                            // Generar e insertar la tabla
                                                                            generateTable(rows, cols);
                                                                            menu.style.display = "none";
                                                                        }
                                                                    };

                                                                    // Añadimos los listeners
                                                                    tableGrid.addEventListener(
                                                                        "mousemove",
                                                                        tableGrid.mousemoveHandler
                                                                    );
                                                                    tableGrid.addEventListener(
                                                                        "click",
                                                                        tableGrid.clickHandler
                                                                    );

                                                                    // Marcamos que ya se inicializaron
                                                                    tableGrid.hasInitializedEvents = true;
                                                                }
                                                            }
                                                        }, 0);

                                                        const closeMenu = (event) => {
                                                            if (
                                                                !menu.contains(event.target) &&
                                                                !e.target.contains(event.target)
                                                            ) {
                                                                menu.style.display = "none";
                                                                document.removeEventListener(
                                                                    "click",
                                                                    closeMenu
                                                                );
                                                                // No necesitamos eliminar los event listeners
                                                                // ya que los mantenemos durante toda la vida del componente
                                                            }
                                                        };
                                                        setTimeout(
                                                            () =>
                                                                document.addEventListener(
                                                                    "click",
                                                                    closeMenu
                                                                ),
                                                            0
                                                        );
                                                    }
                                                }
                                            }}
                                            title="Table"
                                        >
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="18"
                                                viewBox="0 0 23 18"
                                                style="pointer-events: none;"
                                            >
                                                <path
                                                    fill="currentColor"
                                                    d="M4 21q-.825 0-1.412-.587T2 19V5q0-.825.588-1.412T4 3h16q.825 0 1.413.588T22 5v14q0 .825-.587 1.413T20 21zm0-2h4v-7H4zm0-9h4V5H4zm6 9h4v-7h-4zm0-9h4V5h-4zm6 9h4v-7h-4zm0-9h4V5h-4z"
                                                />
                                            </svg>
                                            <div
                                                class="menu-content"
                                                style="display: none; width: 300px;"
                                            >
                                                <div class="table-grid-selector">
                                                    <div class="table-grid-header">
                                                        <span>Insert table</span>
                                                        <span class="table-grid-dimensions">1x1</span>
                                                    </div>

                                                    <div class="table-grid-container">
                                                        <!-- Generate 10x10 cells for the grid -->
                                                        ${Array.from({ length: 100 }).map(
                                                            (_, i) =>
                                                                html`<div
                                                                    class="table-grid-cell"
                                                                    key=${i}
                                                                ></div>`
                                                        )}
                                                    </div>

                                                    <div class="table-grid-custom">
                                                        <button
                                                            onClick=${(e) => {
                                                                const filas = prompt(
                                                                    "Number of rows:",
                                                                    "3"
                                                                );
                                                                if (!filas) return;
                                                                const columnas = prompt(
                                                                    "Number of columns:",
                                                                    "3"
                                                                );

                                                                if (filas && columnas) {
                                                                    const filasNum = parseInt(filas);
                                                                    const columnasNum =
                                                                        parseInt(columnas);

                                                                    if (
                                                                        !isNaN(filasNum) &&
                                                                        !isNaN(columnasNum) &&
                                                                        filasNum > 0 &&
                                                                        columnasNum > 0
                                                                    ) {
                                                                        generateTable(
                                                                            filasNum,
                                                                            columnasNum
                                                                        );
                                                                        e.currentTarget.closest(
                                                                            ".menu-content"
                                                                        ).style.display = "none";
                                                                    }
                                                                }
                                                            }}
                                                        >
                                                            Custom Table
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="16"
                                                viewBox="0 0 24 18"
                                                style="pointer-events: none;"
                                            >
                                                <path
                                                    fill="currentColor"
                                                    d="m12 15.4l-6-6L7.4 8l4.6 4.6L16.6 8L18 9.4z"
                                                ></path>
                                            </svg>
                                        </button>
                                        <div class="toolbar-separator"></div>
                                        <button
                                            onClick=${() => {
                                                copyElementSelector()
                                                    .then(() => {
                                                        // Show success feedback
                                                        const button = document.querySelector(
                                                            '[title*="Copy Element Selector"]'
                                                        );
                                                        if (button) {
                                                            const originalHTML = button.innerHTML;
                                                            showCopySuccess(button, originalHTML);
                                                        }
                                                    })
                                                    .catch((err) => {
                                                        if (err !== "Element selection cancelled") {
                                                            console.error(
                                                                "Error copying element selector:",
                                                                err
                                                            );
                                                        }
                                                    });
                                            }}
                                            title=${isElementSelectionActive
                                                ? "Cancel Element Selection (Double-click or ESC)"
                                                : "Copy Element Selector"}
                                            class=${isElementSelectionActive ? "active selecting" : ""}
                                        >
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="18"
                                                viewBox="0 0 23 18"
                                                style="pointer-events: none;"
                                            >
                                                <path
                                                    fill="currentColor"
                                                    d="M5.523 4.75a.75.75 0 0 0-.75.75v1.625a.75.75 0 0 1-1.5 0V5.5a2.25 2.25 0 0 1 2.25-2.25h1.625a.75.75 0 0 1 0 1.5zM9.648 4a.75.75 0 0 1 .75-.75h3.25a.75.75 0 1 1 0 1.5h-3.25a.75.75 0 0 1-.75-.75m6.5 0a.75.75 0 0 1 .75-.75h1.625a2.25 2.25 0 0 1 2.25 2.25v1.625a.75.75 0 1 1-1.5 0V5.5a.75.75 0 0 0-.75-.75h-1.625a.75.75 0 0 1-.75-.75M4.023 9.625a.75.75 0 0 1 .75.75v3.25a.75.75 0 0 1-1.5 0v-3.25a.75.75 0 0 1 .75-.75m16 0a.75.75 0 0 1 .75.75v3.25a.75.75 0 0 1-.724.75l-.748-.546a.8.8 0 0 1-.028-.204v-3.25a.75.75 0 0 1 .75-.75M12.127 20.65l-.151-1.4h-1.578a.75.75 0 0 0 0 1.5h1.742zm-8.104-4.525a.75.75 0 0 1 .75.75V18.5c0 .414.336.75.75.75h1.625a.75.75 0 0 1 0 1.5H5.523a2.25 2.25 0 0 1-2.25-2.25v-1.625a.75.75 0 0 1 .75-.75"
                                                />
                                                <path
                                                    fill="currentColor"
                                                    fill-rule="evenodd"
                                                    d="M13.01 11.726a.75.75 0 0 1 .818.044l6.525 4.767a.75.75 0 0 1-.305 1.343l-2.364.438l1.259 2.181a.75.75 0 0 1-1.3.75l-1.259-2.181l-1.562 1.829a.75.75 0 0 1-1.316-.407l-.866-8.034a.75.75 0 0 1 .37-.73m1.8 6.874l.778-.91a2.25 2.25 0 0 1 1.3-.75l1.176-.218l-3.75-2.74z"
                                                    clip-rule="evenodd"
                                                />
                                            </svg>
                                        </button>
                                        <button
                                            onClick=${toggleWordWrap}
                                            class=${wordWrap === "on" ? "active" : ""}
                                            title="Toggle Word Wrap"
                                        >
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="18"
                                                viewBox="0 0 24 17"
                                            >
                                                <path
                                                    fill="currentColor"
                                                    d="M4 19h6v-2H4zm0-4h8v-2H4zm16-4V9l-3 3l3 3zM4 9h10V7H4zm0-4h12V3H4z"
                                                />
                                            </svg>
                                        </button>
                                        <button
                                            onClick=${() => {
                                                const newValue = !showPreview;
                                                setShowPreview(newValue);
                                                try {
                                                    localStorage.setItem(
                                                        "editorShowPreview",
                                                        newValue.toString()
                                                    );
                                                } catch (e) {
                                                    console.warn(
                                                        "No se pudo guardar estado de preview:",
                                                        e
                                                    );
                                                }
                                            }}
                                            class=${showPreview ? "active" : ""}
                                            title="Show/Hide Preview"
                                        >
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="18"
                                                viewBox="0 0 23 18"
                                                style="pointer-events: none;"
                                            >
                                                <path
                                                    fill="currentColor"
                                                    d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21zm0-2h14V7H5zm7-2q-2.05 0-3.662-1.112T6 13q.725-1.775 2.338-2.887T12 9t3.663 1.113T18 13q-.725 1.775-2.337 2.888T12 17m0-2.5q-.625 0-1.062-.437T10.5 13t.438-1.062T12 11.5t1.063.438T13.5 13t-.437 1.063T12 14.5m0 1q1.05 0 1.775-.725T14.5 13t-.725-1.775T12 10.5t-1.775.725T9.5 13t.725 1.775T12 15.5"
                                                />
                                            </svg>
                                        </button>
                                        <button
                                            onClick=${() => {
                                                const newPosition =
                                                    previewPosition === "right" ? "bottom" : "right";
                                                setPreviewPosition(newPosition);
                                                try {
                                                    localStorage.setItem(
                                                        "editorPreviewPosition",
                                                        newPosition
                                                    );
                                                } catch (e) {
                                                    console.warn(
                                                        "No se pudo guardar posición de preview:",
                                                        e
                                                    );
                                                }
                                            }}
                                            class=${showPreview ? "" : "disabled"}
                                            title="Change Preview Position"
                                            disabled=${!showPreview}
                                        >
                                            <svg
                                                xmlns="http://www.w3.org/2000/svg"
                                                width="18"
                                                height="18"
                                                viewBox="0 0 23 18"
                                                style="pointer-events: none;"
                                            >
                                                <g fill="none" stroke="currentColor" stroke-width="1.5">
                                                    <path
                                                        stroke-linecap="round"
                                                        stroke-linejoin="round"
                                                        d="M8.5 9.5L6 12l2.5 2.5m7-5L18 12l-2.5 2.5"
                                                    />
                                                    <path
                                                        d="M2 15V9a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4Z"
                                                    />
                                                </g>
                                            </svg>
                                        </button>
                                    </div>
                                    <button
                                        onClick=${handleCopy}
                                        class="copy-button"
                                        style="display: contents;"
                                    >
                                        <svg
                                            width="16"
                                            height="16"
                                            viewBox="0 0 16 16"
                                            fill="none"
                                            xmlns="http://www.w3.org/2000/svg"
                                            style="min-width: 16px; min-height: 16px;"
                                        >
                                            <path
                                                d="M13 13H7a2 2 0 01-2-2V5a2 2 0 012-2h6a2 2 0 012 2v6a2 2 0 01-2 2z"
                                                stroke="currentColor"
                                                stroke-width="2"
                                            />
                                            <path
                                                d="M3 11V3a2 2 0 012-2h6"
                                                stroke="currentColor"
                                                stroke-width="2"
                                                stroke-linecap="round"
                                            />
                                        </svg>
                                    </button>
                                </div>

                                <div
                                    class="editor-content ${previewPosition} ${!showPreview
                                        ? "preview-hidden"
                                        : ""}"
                                >
                                    <div
                                        ref=${containerRef}
                                        class="monaco-editor-container"
                                        style="display: ${showPreview && previewPosition == "bottom"
                                            ? "none"
                                            : "flex"};"
                                        value=${markdown}
                                    />
                                    <div
                                        class="markdown-preview entry-content"
                                        dangerouslySetInnerHTML=${{
                                            __html: preview,
                                        }}
                                    />
                                </div>
                            </div>
                        </main>

                        <footer class="footer">
                            <p>© 2025 Blog Code.</p>
                        </footer>
                    </div>
                `;
            }

            render(html`<${MarkdownEditor} />`, document.getElementById("app"));

            // Inicializar la barra lateral después de renderizar
            // Con un pequeño timeout para asegurar que el DOM está listo
            setTimeout(() => {
                initSidebar([]);
            }, 0);
        </script>
    </body>
</html>
