<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Markdown Editor</title>
        <link rel="icon" type="image/png" sizes="32x32" href="public/icon.ico" />
        <link rel="stylesheet" href="cdn/font/ubuntu-font.css" />
        <link rel="stylesheet" href="styles/global-styles.css" />
        <link rel="stylesheet" href="styles/editor-styles.css" />
        <link rel="stylesheet" href="cdn/prism/prism_vsc.css" />
        <link rel="stylesheet" href="cdn/monaco/editor.main.min.css" />
        <script src="cdn/prism/prism.js"></script>
        <script src="cdn/bodymovin/lottie.js"></script>
        <script src="cdn/marked/marked.umd.js"></script>
        <script src="cdn/SVGpanzoom/svg-pan-zoom.js"></script>
        <script src="cdn/monaco/vs/loader.js"></script>
        <script type="importmap">
            {
                "imports": {
                    "preact": "./cdn/preact/preact.mjs",
                    "preact/hooks": "./cdn/preact/hooks.mjs",
                    "htm/preact": "./cdn/preact/htm-preact.mjs",
                    "config": "./config.js"
                }
            }
        </script>
    </head>
    <body data-open-sidebar-resize="false">
        <div id="app"></div>

        <script type="module">
            import { render } from "preact";
            import { useState, useEffect, useRef } from "preact/hooks";
            import { html } from "htm/preact";
            import { Header } from "./components/Header.js";
            import { Sidebar, initSidebar } from "./components/Sidebar.js";
            import {
                renderMarkdown,
                showCopySuccess,
                manageEscapeIframe,
                manageClickFloatButton,
            } from "./components/MarkdownProcessor.js";
            import CONFIG, { resolveContentPath } from "config";

            // Configure Monaco Editor
            require.config({
                paths: {
                    vs: "./cdn/monaco/vs",
                },
            });

            // Configure the languages we want to load
            window.MonacoEnvironment = {
                getWorkerUrl: function (moduleId, label) {
                    return "./cdn/monaco/vs/base/worker/workerMain.js";
                },
                getLanguages: function () {
                    return ["markdown"];
                },
            };

            // Global variable to track element selection state
            let globalElementSelectionState = {
                isSelecting: false,
                cleanup: null,
            };

            // Global state for menu keyboard navigation
            window.menuKeyboardState = {
                currentMenu: null,
                lastKey: null,
                lastKeyIndex: -1
            };

            // Handler for Escape key and menu navigation
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") {
                    manageEscapeIframe();
                    return;
                }

                // Handle menu keyboard navigation
                const menu = window.menuKeyboardState.currentMenu;
                if (!menu || menu.style.display !== "block") return;

                // Only handle alphanumeric keys
                if (e.key.length !== 1 || !/[a-zA-Z0-9]/.test(e.key)) return;

                const key = e.key.toLowerCase();
                const now = Date.now();

                // Get all focusable items in the menu
                const items = Array.from(menu.querySelectorAll('button, [role="menuitem"], .menu-item, a'));
                if (items.length === 0) return;

                // Filter items that start with the pressed key
                const matchingItems = items.filter(item => {
                    const text = item.textContent.trim().toLowerCase();
                    return text.startsWith(key);
                });

                if (matchingItems.length === 0) return;

                // Reset index if different key
                if (key !== window.menuKeyboardState.lastKey) {
                    window.menuKeyboardState.lastKeyIndex = -1;
                }

                // Move to next matching item
                window.menuKeyboardState.lastKeyIndex = (window.menuKeyboardState.lastKeyIndex + 1);
                if (window.menuKeyboardState.lastKeyIndex >= matchingItems.length) {
                    window.menuKeyboardState.lastKeyIndex = 0;
                }
                window.menuKeyboardState.lastKey = key;

                // Focus the item
                const targetItem = matchingItems[window.menuKeyboardState.lastKeyIndex];
                targetItem.focus();

                // Prevent default to avoid typing in editor
                e.preventDefault();
                e.stopPropagation();
            });

            document.addEventListener("click", function (e) {
                manageClickFloatButton(e);

                // For the main copy button
                if (e.target.closest(".copy-button")) {
                    const button = e.target.closest(".copy-button");
                    const originalHTML = button.innerHTML;

                    if (window.handleCopy) {
                        window
                            .handleCopy()
                            .then(() => {
                                showCopySuccess(button, originalHTML);
                            })
                            .catch((err) => {
                                console.error("Error copying:", err);
                            });
                    }
                }
            });

            // Contenido por defecto para un Nuevo documento
            const DEFAULT_MARKDOWN_CONTENT = `# New document\n\n`;

            function MarkdownEditor() {
                const handleNavigateToEntry = (entry) => {
                    window.location.href = `./post.html?path=${encodeURIComponent(entry.path)}`;
                };

                // Estado para manejar las pestañas
                // Función auxiliar para generar IDs numéricos secuenciales
                const getNextTabId = (existingTabs) => {
                    if (!existingTabs || existingTabs.length === 0) return 1;
                    // Buscamos el ID numérico más alto y le sumamos 1
                    const maxId = Math.max(...existingTabs.map((tab) => parseInt(tab.id)));
                    return isNaN(maxId) ? 1 : maxId + 1;
                };

                const [tabs, setTabs] = useState(() => {
                    const savedTabs = localStorage.getItem("editorTabs");
                    return savedTabs
                        ? JSON.parse(savedTabs)
                        : [
                              {
                                  id: 1, // ID inicial fijo
                                  title: "New document",
                                  content: DEFAULT_MARKDOWN_CONTENT,
                                  isModified: false,
                              },
                          ];
                });

                // ID de la pestaña activa
                const [activeTabId, setActiveTabId] = useState(() => {
                    const savedActiveTabId = localStorage.getItem("editorActiveTabId");
                    return parseInt(savedActiveTabId) || (tabs.length > 0 ? parseInt(tabs[0].id) : null);
                });

                window.activeTabId = activeTabId;

                // Intentar recuperar configuración guardada de localStorage
                const savedShowPreview = localStorage.getItem("editorShowPreview");
                const savedPreviewPosition = localStorage.getItem("editorPreviewPosition");

                // Estado para el contenido y la vista previa
                const [markdown, setMarkdown] = useState(() => {
                    const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                    return activeTab?.content || "";
                });

                const [preview, setPreview] = useState("");
                const [showPreview, setShowPreview] = useState(
                    savedShowPreview === "true" ? true : false
                );
                const [previewPosition, setPreviewPosition] = useState(
                    savedPreviewPosition === "bottom" ? "bottom" : "right"
                );

                // Estado para las proporciones del grid
                const [gridRatio, setGridRatio] = useState(
                    localStorage.getItem("editorGridRatio") || "1fr 0fr 1fr"
                );
                const [isResizing, setIsResizing] = useState(false);

                // State to track element selection mode
                const [isElementSelectionActive, setIsElementSelectionActive] = useState(false);

                // Sistema simplificado para el scroll de la vista previa
                const scrollDataRef = useRef({
                    userPosition: JSON.parse(
                        localStorage.getItem("editorPreviewScrollPosition") ||
                            '{"scrollTop":0,"scrollLeft":0}'
                    ),
                    isUpdating: false,
                    saveTimeout: null,
                });

                const [wordWrap, setWordWrap] = useState(
                    localStorage.getItem("editorWordWrap") === "off" ? "off" : "on"
                ); // 'on' by default
                const editorRef = useRef(null);
                const containerRef = useRef(null);

                // Simplified functions for scrolling
                const saveScrollPosition = (position) => {
                    if (scrollDataRef.current.isUpdating) return;
                    if (position) {
                        scrollDataRef.current.userPosition = position;
                        localStorage.setItem("editorPreviewScrollPosition", JSON.stringify(position));
                        return;
                    }
                    const el = document.querySelector(".markdown-preview.entry-content");
                    if (el) {
                        const pos = { scrollTop: el.scrollTop, scrollLeft: el.scrollLeft };
                        scrollDataRef.current.userPosition = pos;
                        localStorage.setItem("editorPreviewScrollPosition", JSON.stringify(pos));
                    }
                };

                const restoreScrollPosition = () => {
                    const el = document.querySelector(".markdown-preview.entry-content");
                    if (el && scrollDataRef.current.userPosition) {
                        el.scrollTop = scrollDataRef.current.userPosition.scrollTop;
                        el.scrollLeft = scrollDataRef.current.userPosition.scrollLeft;
                    }
                };

                const setupScrollListener = () => {
                    const el = document.querySelector(".markdown-preview.entry-content");
                    if (el) {
                        const handleScroll = () => {
                            if (scrollDataRef.current.saveTimeout)
                                clearTimeout(scrollDataRef.current.saveTimeout);
                            scrollDataRef.current.saveTimeout = setTimeout(saveScrollPosition, 150);
                        };
                        el.removeEventListener("scroll", el._scrollHandler);
                        el._scrollHandler = handleScroll;
                        el.addEventListener("scroll", handleScroll, { passive: true });
                    }
                };

                useEffect(() => {
                    updateTabContent(window.activeTabId, markdown);
                    if (showPreview) {
                        scrollDataRef.current.isUpdating = true;
                        let [finalHtml, sidebarContent, finalJS] = renderMarkdown(markdown);
                        setPreview(finalHtml);

                        setTimeout(() => {
                            initSidebar(sidebarContent);
                            if (finalJS) eval(finalJS);
                            if (window.Prism) window.Prism.highlightAll();

                            setTimeout(() => {
                                restoreScrollPosition();
                                setupScrollListener();
                                scrollDataRef.current.isUpdating = false;
                            }, 50);
                        }, 100);
                    }
                }, [showPreview, markdown]);

                useEffect(() => {
                    if (showPreview) {
                        setTimeout(() => {
                            setupScrollListener();
                            restoreScrollPosition();
                        }, 200);
                    }

                    return () => {
                        const el = document.querySelector(".markdown-preview.entry-content");
                        if (el && el._scrollHandler) {
                            el.removeEventListener("scroll", el._scrollHandler);
                            delete el._scrollHandler;
                        }
                    };
                }, [showPreview]);

                // Efecto para manejar el redimensionamiento de la vista previa
                useEffect(() => {
                    const handleMouseMove = (e) => {
                        if (!isResizing || previewPosition !== "right") return;

                        // Contenedor principal
                        const editorContainer = document.querySelector(".editor-content");
                        if (!editorContainer) return;

                        // Calcular el ancho como fracción del contenedor padre
                        const containerRect = editorContainer.getBoundingClientRect();
                        const editorWidth = containerRect.width;

                        // Calcular la posición relativa del mouse dentro del contenedor
                        const mouseX = e.clientX - containerRect.left;

                        // Asegurar límites razonables (20% a 80%)
                        const limitedX = Math.min(
                            Math.max(mouseX, editorWidth * 0.2),
                            editorWidth * 0.8
                        );

                        // Calcular la proporción para grid-template-columns
                        // Usar proporciones relativas para que sea más preciso
                        const ratio = limitedX / editorWidth;
                        const leftFr = ratio;
                        const rightFr = 1 - ratio;
                        const newRatio = `${leftFr}fr 0fr ${rightFr}fr`;
                        setGridRatio(newRatio);

                        // Aplicar directamente para evitar retraso en la UI
                        if (editorContainer) {
                            editorContainer.style.gridTemplateColumns = newRatio;
                        }

                        // Optimizar re-rendering evitando actualizaciones de estado frecuentes
                        e.preventDefault();
                    };

                    const handleMouseUp = () => {
                        if (isResizing) {
                            setIsResizing(false);
                            // Guardar en localStorage
                            localStorage.setItem("editorGridRatio", gridRatio);
                            // Remover la clase de resizing del body
                            document.body.classList.remove("resizing");
                        }
                    };

                    if (isResizing) {
                        document.addEventListener("mousemove", handleMouseMove);
                        document.addEventListener("mouseup", handleMouseUp);
                        // Agregar clase al body para indicar que estamos redimensionando
                        document.body.classList.add("resizing");
                        // Cambiar el cursor en todo el documento durante el redimensionamiento
                        document.body.style.cursor = "col-resize";
                    } else {
                        // Restaurar el cursor cuando no estamos redimensionando
                        document.body.style.cursor = "";
                    }

                    return () => {
                        document.removeEventListener("mousemove", handleMouseMove);
                        document.removeEventListener("mouseup", handleMouseUp);
                        // Asegurarnos de limpiar las clases y estilos si el componente se desmonta
                        document.body.classList.remove("resizing");
                        document.body.style.cursor = "";
                    };
                }, [isResizing, previewPosition, gridRatio]);

                // Effect to add mouse events to the resizer
                useEffect(() => {
                    const initResizer = () => {
                        const resizeElement = document.querySelector(".editor-content #resize-handle");
                        if (!resizeElement) return;
                        const handleMouseDown = (e) => {
                            // Check if we are in the resizer area
                            const rect = resizeElement.getBoundingClientRect();
                            if (previewPosition === "right") {
                                setIsResizing(true);
                                e.preventDefault();
                            }
                        };

                        resizeElement.addEventListener("mousedown", handleMouseDown);

                        return () => {
                            resizeElement.removeEventListener("mousedown", handleMouseDown);
                        };
                    };

                    // Give time for the DOM to update
                    const timerId = setTimeout(initResizer, 100);

                    return () => {
                        clearTimeout(timerId);
                    };
                }, [previewPosition, showPreview]);

                useEffect(() => {
                    if (!editorRef.current) {
                        // The configuration is already done above

                        require(["vs/editor/editor.main"], () => {
                            // Ensure we load the correct content for the active tab

                            editorRef.current = monaco.editor.create(containerRef.current, {
                                value: markdown,
                                language: "markdown",
                                theme: document.documentElement.getAttribute("monaco-theme") || "vs-dark",
                                minimap: { enabled: true },
                                fontSize: 16,
                                lineNumbers: "on",
                                roundedSelection: false,
                                scrollBeyondLastLine: true,
                                wordWrap: wordWrap, // Using the wordWrap state
                                acceptSuggestionOnEnter: "off",
                                automaticLayout: true,
                                smoothScrolling: true,
                            });

                            // Restore the view state (scroll, cursor, etc.) if it exists
                            const activeTab = tabs.find(
                                (tab) => parseInt(tab.id) === parseInt(activeTabId)
                            );
                            if (activeTab && activeTab.viewState) {
                                editorRef.current.restoreViewState(activeTab.viewState);
                            }

                            // Make the editor available globally for the support system
                            window.currentEditor = editorRef.current;

                            // Add key handler
                            editorRef.current.addAction({
                                id: "extend-list",
                                label: "Extend List",
                                keybindings: [monaco.KeyCode.Enter],
                                precondition: null,
                                keybindingContext: null,
                                contextMenuGroupId: "navigation",
                                contextMenuOrder: 1.5,
                                // Method that will be executed
                                run: function (ed) {
                                    const editor = editorRef.current;
                                    const selection = editor.getSelection();
                                    const position = {
                                        lineNumber: selection.startLineNumber,
                                        column: selection.startColumn,
                                    };
                                    const model = editor.getModel();
                                    const lineContent = model.getLineContent(position.lineNumber);

                                    // Check if Shift+Enter was pressed
                                    const shiftKey =
                                        ed._standaloneKeybindingService._currentChord?.[0]?.shiftKey;

                                    // Regular expression to detect numbered lines (e.g., "1. ", "12. ") with optional leading spaces
                                    const numberedListRegex = /^(\s*)(\d+)\.(\s+)(.*)$/;
                                    // Regular expression to detect bullet lists (e.g., "- ") with optional leading spaces
                                    const bulletListRegex = /^(\s*)(-|\*)(\s+)(.*)$/;

                                    const lineStartSpaces = lineContent.match(/^\s*/)[0];

                                    const numberedMatch = lineContent.match(numberedListRegex);
                                    const bulletMatch = lineContent.match(bulletListRegex);

                                    // Check if cursor is at the end of the line
                                    const isAtEndOfLine = position.column === model.getLineMaxColumn(position.lineNumber);

                                    // Only execute list logic if cursor is at the end of the line
                                    if (isAtEndOfLine && numberedMatch) {
                                        // If the current line is empty after the number (e.g., "1. "), end the list
                                        if (numberedMatch[4].trim() === "") {
                                            // Remove the current line and add a blank line
                                            const range = {
                                                startLineNumber: position.lineNumber,
                                                startColumn: 1,
                                                endLineNumber: position.lineNumber,
                                                endColumn: lineContent.length + 1,
                                            };
                                            editor.executeEdits("", [
                                                {
                                                    range: range,
                                                    text: lineStartSpaces,
                                                },
                                            ]);
                                            return true; // Prevent default behavior
                                        }

                                        const currentNumber = parseInt(numberedMatch[2], 10);
                                        const nextNumber = currentNumber + 1;
                                        const spacing = numberedMatch[3]; // Keep the same spacing

                                        // Insert a new line with the next number
                                        const text = "\n" + lineStartSpaces + nextNumber + "." + spacing;
                                        editor.executeEdits("", [
                                            {
                                                range: {
                                                    startLineNumber: position.lineNumber,
                                                    startColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                    endLineNumber: position.lineNumber,
                                                    endColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                },
                                                text: text,
                                            },
                                        ]);

                                        // Move the cursor to the new line after the number
                                        editor.setPosition({
                                            lineNumber: position.lineNumber + 1,
                                            column: lineStartSpaces.length + (nextNumber + ".").length + spacing.length + 1,
                                        });

                                        return true; // Completed
                                    }

                                    if (isAtEndOfLine && bulletMatch) {
                                        // If the current line is empty after the bullet (e.g., "- "), end the list
                                        if (bulletMatch[4].trim() === "") {
                                            // Remove the current line and add a blank line
                                            const range = {
                                                startLineNumber: position.lineNumber,
                                                startColumn: 1,
                                                endLineNumber: position.lineNumber,
                                                endColumn: lineContent.length + 1,
                                            };
                                            editor.executeEdits("", [
                                                {
                                                    range: range,
                                                    text: lineStartSpaces,
                                                },
                                            ]);
                                            return true; // Prevent default behavior
                                        }

                                        const bulletChar = bulletMatch[2]; // "-" o "*"
                                        const spacing = bulletMatch[3]; // Keep the same spacing

                                        // Insert a new line with the same bullet
                                        const text = "\n" + lineStartSpaces + bulletChar + spacing;
                                        editor.executeEdits("", [
                                            {
                                                range: {
                                                    startLineNumber: position.lineNumber,
                                                    startColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                    endLineNumber: position.lineNumber,
                                                    endColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                },
                                                text: text,
                                            },
                                        ]);

                                        // Move the cursor to the new line after the bullet
                                        editor.setPosition({
                                            lineNumber: position.lineNumber + 1,
                                            column: lineStartSpaces.length + bulletChar.length + spacing.length + 1,
                                        });

                                        return true; // Completed
                                    }

                                    // If not any type of list, use the default Enter behavior
                                    editor.trigger("keyboard", "type", { text: "\n" });
                                    return true;
                                },
                            });

                            editorRef.current.onDidChangeModelContent(() => {
                                const content = editorRef.current.getValue();
                                setMarkdown(content);
                            });

                            // Configuration assistant system
                            editorRef.current.onDidChangeCursorPosition((e) => {
                                checkForConfigurableBlock(e.position);
                            });

                            // Initialize configuration assistant
                            initializeConfigAssistant();

                            // Handle beforeunload event to save tabs to localStorage
                            const handleBeforeUnload = (e) => {
                                // Try saving one last time to localStorage
                                try {
                                    if (editorRef.current && window.activeTabId) {
                                        const content = editorRef.current.getValue();

                                        // Get the current tabs from localStorage (most up-to-date version)
                                        const currentTabsJson = localStorage.getItem("editorTabs");
                                        const currentTabs = currentTabsJson
                                            ? JSON.parse(currentTabsJson)
                                            : [];

                                        // Update the active tab with the current content
                                        const tabsSave = currentTabs.map((tab) => {
                                            if (parseInt(tab.id) !== parseInt(window.activeTabId))
                                                return tab;

                                            tab.viewState = editorRef.current.saveViewState();
                                            tab.scrollDataRef = scrollDataRef.current.userPosition;

                                            const tabTitle = extractTitleFromMarkdown(content);

                                            return {
                                                ...tab,
                                                content: content,
                                                title: tabTitle,
                                                isModified: true,
                                            };
                                        });

                                        // Save all tabs to localStorage
                                        localStorage.setItem("editorTabs", JSON.stringify(tabsSave));

                                        return;
                                    }
                                } catch (error) {
                                    // If saving fails, show alert
                                    e.preventDefault();
                                    e.returnValue =
                                        "Changes could not be saved automatically. Are you sure you want to log out?";
                                    return e.returnValue;
                                }
                            };

                            window.addEventListener("beforeunload", handleBeforeUnload);
                        });
                    }

                    // Add keyboard shortcut Ctrl+S to open publish modal
                    const handleKeyDown = (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                            e.preventDefault(); // Prevent browser's default save behavior
                            showPublishModal();
                        }
                    };

                    document.addEventListener('keydown', handleKeyDown);

                    // Cleanup on component unmount
                    return () => {
                        document.removeEventListener('keydown', handleKeyDown);
                    };
                }, []);

                // Effect to save tabs to localStorage when they change
                useEffect(() => {
                    try {
                        localStorage.setItem("editorTabs", JSON.stringify(tabs));
                    } catch (e) {
                        console.warn("Error saving tabs to localStorage:", e);
                    }
                }, [tabs]);

                // Effect to update the editor when the active tab changes
                useEffect(() => {
                    if (!editorRef.current || activeTabId === null) return;

                    window.activeTabId = activeTabId;
                    // Avoid cascading updates

                    const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                    if (activeTab && editorRef.current.getModel()) {
                        const currentContent = editorRef.current.getValue();

                        const oldModel = editorRef.current.getModel();
                        if (oldModel) oldModel.dispose(); // clears history and internal status

                        const newModel = monaco.editor.createModel(activeTab.content, "markdown");
                        setMarkdown(activeTab.content || "");

                        editorRef.current.setModel(newModel);
                        if (activeTab.viewState) {
                            editorRef.current.restoreViewState(activeTab.viewState);
                        }
                        if (activeTab.scrollDataRef) {
                            saveScrollPosition(activeTab.scrollDataRef);
                            restoreScrollPosition();
                        } else {
                            // If there's no saved scroll position, reset to top
                            saveScrollPosition({ scrollTop: 0, scrollLeft: 0 });
                            restoreScrollPosition();
                        }
                    }

                    localStorage.setItem("editorActiveTabId", activeTabId?.toString());
                }, [activeTabId]);

                // Function to extract the title from markdown content
                const extractTitleFromMarkdown = (content) => {
                    const titleMatch = content.match(/^#\s+(.+)$/m);
                    return titleMatch ? titleMatch[1].trim() : "Sin título";
                };

                // Function to create a new tab
                const createNewTab = () => {
                    // Save current content before creating a new tab
                    if (editorRef.current && activeTabId) {
                        updateTabContent(activeTabId, editorRef.current.getValue());
                    }

                    const newTabNumber = tabs.length + 1;
                    const newTabId = getNextTabId(tabs);

                    // Create content with unique title
                    let newContent = DEFAULT_MARKDOWN_CONTENT;
                    if (newTabNumber > 1) {
                        newContent = newContent.replace("# New document", `# Document ${newTabNumber}`);
                    }

                    const newTab = {
                        id: newTabId,
                        title: newTabNumber === 1 ? "New document" : `Document ${newTabNumber}`,
                        content: newContent,
                        isModified: false,
                    };

                    // Update state
                    setTabs([...tabs, newTab]);
                    setActiveTabId(newTabId);
                };

                // Function to switch to a tab
                const switchToTab = (tabId) => {
                    const numericTabId = parseInt(tabId);
                    const numericActiveTabId = parseInt(activeTabId);

                    if (numericActiveTabId === numericTabId) return;

                    // Save current content before switching
                    if (editorRef.current && activeTabId !== null) {
                        const currentContent = editorRef.current.getValue();

                        updateTabContent(numericActiveTabId, currentContent, true);
                    }

                    // Switch to the new tab
                    const targetTab = tabs.find((tab) => parseInt(tab.id) === numericTabId);
                    if (!targetTab) return;

                    setActiveTabId(numericTabId);
                };

                // Function to update the content of a tab
                const updateTabContent = (tabId, newContent, viewState = false) => {
                    const numericTabId = parseInt(tabId);

                    setTabs((prevTabs) =>
                        prevTabs.map((tab) => {
                            if (parseInt(tab.id) !== numericTabId) return tab;

                            // Update the viewState if the parameter is sent
                            if (viewState) {
                                tab.viewState = editorRef.current.saveViewState();
                                tab.scrollDataRef = scrollDataRef.current.userPosition;
                            }

                            const tabTitle = extractTitleFromMarkdown(newContent);

                            return {
                                ...tab,
                                content: newContent,
                                title: tabTitle,
                                isModified: true,
                            };
                        })
                    );
                };

                // Function to close a tab
                const closeTab = (tabId, event) => {
                    if (event) event.stopPropagation();

                    const numericTabId = parseInt(tabId);
                    const numericActiveTabId = parseInt(activeTabId);
                    const tabToClose = tabs.find((tab) => parseInt(tab.id) === numericTabId);

                    // Confirm close if there are changes
                    if (tabToClose?.isModified) {
                        const confirmClose = window.confirm(
                            `Are you sure you want to close "${tabToClose.title}"? Unsaved changes will be lost.`
                        );
                        if (!confirmClose) return;
                    }

                    // Handle special case: last tab
                    if (tabs.length === 1) {
                        const newTabId = getNextTabId(tabs);
                        setTabs([
                            {
                                id: newTabId,
                                title: "New document",
                                content: DEFAULT_MARKDOWN_CONTENT,
                                isModified: false,
                            },
                        ]);
                        setActiveTabId(newTabId);
                        return;
                    }

                    // If closing the active tab, select another
                    if (numericActiveTabId === numericTabId) {
                        const tabIndex = tabs.findIndex((tab) => parseInt(tab.id) === numericTabId);
                        const newActiveTab = tabs[tabIndex === 0 ? 1 : tabIndex - 1];
                        setActiveTabId(parseInt(newActiveTab.id));
                    }

                    // Remove the tab
                    setTabs((prevTabs) => prevTabs.filter((tab) => parseInt(tab.id) !== numericTabId));
                };

                const insertText = (beforeText, afterText = "", insertAtStart = false) => {
                    if (!editorRef.current) return;

                    const editor = editorRef.current;
                    const selection = editor.getSelection();
                    const selectedText = editor.getModel().getValueInRange(selection);

                    // If no text is selected and insertAtStart is true
                    if (selection.isEmpty() && insertAtStart) {
                        const lineNumber = selection.startLineNumber;
                        const lineContent = editor.getModel().getLineContent(lineNumber);

                        // Detect if there's already a header at the beginning
                        const headerRegex = /^(\s*)(#{1,6}\s|#t\s)/;
                        const match = lineContent.match(headerRegex);

                        const lineStart = {
                            startLineNumber: lineNumber,
                            startColumn: 1,
                            endLineNumber: lineNumber,
                            endColumn: lineContent.length + 1,
                        };

                        let newText;
                        if (match) {
                            // If there's already a header, replace it
                            newText = match[1] + beforeText + lineContent.trim().substring(match[2].length) + afterText;
                        } else {
                            // If there's no header, add a new one
                            newText = lineContent.match(/^\s*/)[0] + beforeText + lineContent.trim() + afterText;
                        }

                        // Edit at the beginning of the line
                        editor.pushUndoStop();
                        editor.executeEdits("", [
                            {
                                range: lineStart,
                                text: newText,
                            },
                        ]);
                    } else {
                        // Normal behavior when text is selected
                        const newText = beforeText + selectedText + afterText;

                        editor.pushUndoStop();
                        editor.executeEdits("", [
                            {
                                range: selection,
                                text: newText,
                            },
                        ]);
                    }
                    // Calculate where the cursor will be: right after beforeText + selectedText
                    let lines = (beforeText + selectedText).split("\n");
                    let newLineNumber = selection.startLineNumber + (lines.length - 1);
                    let newColumn;

                    if (lines.length === 1) {
                        // Everything on the same line
                        newColumn = selection.startColumn + lines[0].length;
                    } else {
                        // Last line of the block
                        newColumn = lines[lines.length - 1].length + 1;
                    }

                    // Posiciona el cursor
                    editor.setSelection({
                        startLineNumber: newLineNumber,
                        startColumn: newColumn,
                        endLineNumber: newLineNumber,
                        endColumn: newColumn,
                    });

                    // Center the cursor line on the screen with smooth animation
                    // Center the cursor line on the screen
                    editor.revealLineInCenter(newLineNumber, monaco.editor.ScrollType.Smooth);

                    editor.focus();
                };

                        } else if (gridType === "simple" || gridType === "responsive") {

                    // Variables y event listeners para el grid visual
                    let isDrawing = false;
                    let currentArea = null;

                    let gridAreas = [];
                    let gridAreaCounter = 1;

                    // Añadir el event listener para mouseup a nivel del documento
                    document.addEventListener("mouseup", function (e) {
                        if (isDrawing) {
                            endDrawing(e);

                    });

                    // Funciones para el grid visual
                    window.regenerateVisualGrid = function () {
                        const columns =
                            parseInt(document.getElementById("visual-grid-columns").value) || 5;
                        const rows = parseInt(document.getElementById("visual-grid-rows").value) || 5;
                        const gap = parseInt(document.getElementById("visual-grid-gap").value) || 8;

                        const designerEl = document.getElementById("visual-grid-designer");
                        if (!designerEl) return;

                        // Limpia el diseñador
                        designerEl.innerHTML = "";

                        // Configura el grid
                        designerEl.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
                        designerEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
                        designerEl.style.gap = `${gap}px`;

                        // Create grid cells
                        for (let y = 0; y < rows; y++) {
                            for (let x = 0; x < columns; x++) {
                                const cell = document.createElement("div");
                                cell.className = "grid-cell";
                                cell.dataset.x = x;
                                cell.dataset.y = y;

                                // Events for drawing areas
                                cell.addEventListener("mousedown", startDrawing);
                                cell.addEventListener("mousemove", continueDrawing);

                                designerEl.appendChild(cell);
                            }
                        }

                        // Redraw existing areas
                        redrawGridAreas();
                        updateVisualGridPreview();
                    };

                    window.startDrawing = function (e) {
                        if (e.button !== 0) return; // Left button only

                        isDrawing = true;
                        const cell = e.target;
                        startCell = {
                            x: parseInt(cell.dataset.x),
                            y: parseInt(cell.dataset.y),
                        };

                        // Inicializar la última celda conocida
                        lastKnownCell = startCell;

                        // Create a temporary area to display while drawing
                        currentArea = document.createElement("div");
                        currentArea.className = "grid-area drawing";
                        currentArea.innerHTML = `Area ${gridAreaCounter}`;
                        document.getElementById("visual-grid-designer").appendChild(currentArea);

                        updateCurrentArea(startCell, startCell);
                    };

                    window.continueDrawing = function (e) {
                        if (!isDrawing || !currentArea) return;

                        const cell = e.target;
                        if (cell.className !== "grid-cell") return;

                        const currentCell = {
                            x: parseInt(cell.dataset.x),
                            y: parseInt(cell.dataset.y),
                        };

                        // Actualizar la última celda conocida
                        lastKnownCell = currentCell;

                        updateCurrentArea(startCell, currentCell);
                    };

                    let lastKnownCell = null;

                    window.endDrawing = function (e) {
                        if (!isDrawing || !currentArea) return;

                        // Si no tenemos una última celda conocida, cancelar
                        if (!lastKnownCell) {
                            if (currentArea) {
                                currentArea.remove();
                                currentArea = null;
                            }
                            isDrawing = false;
                            return;
                        }

                        const endCell = {
                            x: lastKnownCell.x,
                            y: lastKnownCell.y,
                        };

                        // Calculate the final area
                        const startX = Math.min(startCell.x, endCell.x);
                        const startY = Math.min(startCell.y, endCell.y);
                        const endX = Math.max(startCell.x, endCell.x);
                        const endY = Math.max(startCell.y, endCell.y);

                        // Add the area to the list
                        const newArea = {
                            id: `area-${gridAreaCounter}`,
                            name: `Area ${gridAreaCounter}`,
                            startX,
                            startY,
                            endX,
                            endY,
                            color: getRandomColor(),
                        };

                        gridAreas.push(newArea);
                        gridAreaCounter++;

                        // Remove the temporary area
                        if (currentArea) {
                            currentArea.remove();
                            currentArea = null;
                        }

                        // Redraw all areas
                        redrawGridAreas();
                        updateGridAreasList();
                        updateVisualGridPreview();

                        isDrawing = false;
                    };

                    window.updateCurrentArea = function (start, end) {
                        if (!currentArea) return;

                        const designerEl = document.getElementById("visual-grid-designer");
                        const cells = designerEl.querySelectorAll(".grid-cell");
                        const cellSize = cells[0].getBoundingClientRect();
                        const gap = parseInt(document.getElementById("visual-grid-gap").value) || 8;

                        const startX = Math.min(start.x, end.x);
                        const startY = Math.min(start.y, end.y);
                        const endX = Math.max(start.x, end.x);
                        const endY = Math.max(start.y, end.y);

                        // Calcular tamaño y posición
                        const width = (endX - startX + 1) * cellSize.width + (endX - startX) * gap;
                        const height = (endY - startY + 1) * cellSize.height + (endY - startY) * gap;

                        // Encontrar la primera celda para posicionar correctamente
                        const firstCell = designerEl.querySelector(
                            `.grid-cell[data-x="${startX}"][data-y="${startY}"]`
                        );
                        const firstCellRect = firstCell.getBoundingClientRect();
                        const designerRect = designerEl.getBoundingClientRect();

                        // Ajustar posición relativa al contenedor
                        const left = firstCellRect.left - designerRect.left;
                        const top = firstCellRect.top - designerRect.top;

                        // Aplicar estilo
                        currentArea.style.left = `${left}px`;
                        currentArea.style.top = `${top}px`;
                        currentArea.style.width = `${width}px`;
                        currentArea.style.height = `${height}px`;
                    };

                    window.redrawGridAreas = function () {
                        // Remove all existing areas
                        const designerEl = document.getElementById("visual-grid-designer");
                        if (!designerEl) return;

                        designerEl
                            .querySelectorAll(".grid-area:not(.drawing)")
                            .forEach((el) => el.remove());

                        // Draw each area
                        gridAreas.forEach((area) => {
                            const areaEl = document.createElement("div");
                            areaEl.className = "grid-area";
                            areaEl.id = area.id;
                            areaEl.innerHTML = area.name;
                            areaEl.style.backgroundColor = area.color || "rgba(0, 122, 204, 0.4)";

                            // Add button to remove
                            const removeBtn = document.createElement("div");
                            removeBtn.className = "remove-area";
                            removeBtn.innerHTML = "×";
                            removeBtn.onclick = (e) => {
                                e.stopPropagation();
                                removeGridArea(area.id);
                            };
                            areaEl.appendChild(removeBtn);

                            designerEl.appendChild(areaEl);

                            // Position the area correctly
                            positionGridArea(areaEl, area);
                        });
                    };

                    window.positionGridArea = function (areaEl, area) {
                        const designerEl = document.getElementById("visual-grid-designer");
                        const cells = designerEl.querySelectorAll(".grid-cell");
                        if (cells.length === 0) return;

                        const cellSize = cells[0].getBoundingClientRect();
                        const gap = parseInt(document.getElementById("visual-grid-gap").value) || 8;

                        // Encontrar la primera celda para posicionar correctamente
                        const firstCell = designerEl.querySelector(
                            `.grid-cell[data-x="${area.startX}"][data-y="${area.startY}"]`
                        );
                        if (!firstCell) return;

                        const firstCellRect = firstCell.getBoundingClientRect();
                        const designerRect = designerEl.getBoundingClientRect();

                        // Calcular tamaño
                        const width =
                            (area.endX - area.startX + 1) * cellSize.width +
                            (area.endX - area.startX) * gap;
                        const height =
                            (area.endY - area.startY + 1) * cellSize.height +
                            (area.endY - area.startY) * gap;

                        // Ajustar posición relativa al contenedor
                        const left = firstCellRect.left - designerRect.left;
                        const top = firstCellRect.top - designerRect.top;

                        // Aplicar estilo
                        areaEl.style.left = `${left}px`;
                        areaEl.style.top = `${top}px`;
                        areaEl.style.width = `${width}px`;
                        areaEl.style.height = `${height}px`;
                    };

                    window.updateGridAreasList = function () {
                        const listEl = document.getElementById("grid-areas-list");
                        if (!listEl) return;

                        // Clear the list
                        listEl.innerHTML = "";

                        // Add each area to the list
                        gridAreas.forEach((area) => {
                            const itemEl = document.createElement("div");
                            itemEl.className = "grid-area-item";

                            const info = document.createElement("span");
                            info.textContent = `${area.name}: (${area.startX + 1},${
                                area.startY + 1
                            }) a (${area.endX + 1},${area.endY + 1})`;

                            const removeBtn = document.createElement("button");
                            removeBtn.textContent = "Remove";
                            removeBtn.onclick = () => removeGridArea(area.id);

                            itemEl.appendChild(info);
                            itemEl.appendChild(removeBtn);
                            listEl.appendChild(itemEl);
                        });
                    };

                    window.removeGridArea = function (id) {
                        // Remove the area from the list
                        gridAreas = gridAreas.filter((area) => area.id !== id);

                        // Redraw and update the list
                        redrawGridAreas();
                        updateGridAreasList();
                        updateVisualGridPreview();
                    };

                    window.resetGridAreas = function () {
                        // Confirm before deleting all areas
                        if (
                            gridAreas.length > 0 &&
                            confirm("Are you sure you want to delete all areas?")
                        ) {
                            gridAreas = [];
                            gridAreaCounter = 1;
                            redrawGridAreas();
                            updateGridAreasList();
                            updateVisualGridPreview();
                        }
                    };

                    window.addGridArea = function () {
                        const columns =
                            parseInt(document.getElementById("visual-grid-columns").value) || 5;
                        const rows = parseInt(document.getElementById("visual-grid-rows").value) || 5;

                        // Create a default area in an available position
                        let startX = 0,
                            startY = 0;
                        let found = false;

                        // Find an available cell
                        outerLoop: for (let y = 0; y < rows; y++) {
                            for (let x = 0; x < columns; x++) {
                                // Comprobar si esta celda ya está ocupada
                                const isOccupied = gridAreas.some(
                                    (area) =>
                                        x >= area.startX &&
                                        x <= area.endX &&
                                        y >= area.startY &&
                                        y <= area.endY
                                );

                                if (!isOccupied) {
                                    startX = x;
                                    startY = y;
                                    found = true;
                                    break outerLoop;
                                }
                            }
                        }

                        if (!found) {
                            alert(
                                "There's no space available for a new area. Delete an existing area or resize the grid."
                            );
                            return;
                        }

                        // Crear el área con tamaño 1x1
                        const newArea = {
                            id: `area-${gridAreaCounter}`,
                            name: `Área ${gridAreaCounter}`,
                            startX,
                            startY,
                            endX: startX,
                            endY: startY,
                            color: getRandomColor(),
                        };

                        gridAreas.push(newArea);
                        gridAreaCounter++;

                        // Actualizar la interfaz
                        redrawGridAreas();
                        updateGridAreasList();
                        updateVisualGridPreview();
                    };

                    window.updateVisualGridGap = function () {
                        const designerEl = document.getElementById("visual-grid-designer");
                        if (!designerEl) return;

                        const gap = parseInt(document.getElementById("visual-grid-gap").value) || 8;
                        designerEl.style.gap = `${gap}px`;

                        // Actualizar posición de todas las áreas
                        redrawGridAreas();
                        updateVisualGridPreview();
                    };

                    window.updateVisualGridPreview = function () {
                        const previewEl = document.getElementById("grid-preview");
                        if (!previewEl) return;

                        const columns =
                            parseInt(document.getElementById("visual-grid-columns").value) || 5;
                        const rows = parseInt(document.getElementById("visual-grid-rows").value) || 5;
                        const gap = parseInt(document.getElementById("visual-grid-gap").value) || 8;

                        let previewHTML = `<div class="preview-grid" style="grid-template-columns: repeat(${columns}, 1fr); grid-template-rows: repeat(${rows}, 1fr); gap: ${gap}px;">`;

                        // Create a 2D array to represent the grid
                        const gridMap = Array(rows)
                            .fill()
                            .map(() => Array(columns).fill(null));

                        // Mark areas in the map
                        gridAreas.forEach((area, index) => {
                            for (let y = area.startY; y <= area.endY; y++) {
                                for (let x = area.startX; x <= area.endX; x++) {
                                    if (y >= 0 && y < rows && x >= 0 && x < columns) {
                                        gridMap[y][x] = index;
                                    }
                                }
                            }
                        });
