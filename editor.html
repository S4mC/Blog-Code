                        // El formato antiguo para compatibilidad
                        else {
                            html += `<div class="config-custom-input">`;
                            
                            // Get existing value for this specific pattern type
                            let existingValue = '';
                            let matchingOption = null;
                            
                            // Pattern matching that works with actual pattern values
                            if (section.pattern.includes('style=')) {
                                // Look for style= options
                                matchingOption = existingOptions.find(opt => opt.includes('style='));
                            } else if (section.pattern.includes('height=')) {
                                // Look for height= options
                                matchingOption = existingOptions.find(opt => opt.includes('height='));
                            } else if (section.pattern.includes('min-')) {
                                // Look for min- options
                                matchingOption = existingOptions.find(opt => opt.startsWith('min-'));
                            } else if (section.pattern === '{value}') {
                                // Look for generic attribute options (like iframe attributes)
                                matchingOption = existingOptions.find(opt => 
                                    /^width\s*=\s*".+"$/i.test(opt) &&
                                    !opt.includes('style=') &&
                                    !opt.includes('height=') &&
                                    !opt.startsWith('min-') &&
                                    !opt.startsWith('cols-') &&
                                    !opt.startsWith('gap-')
                                );
                                console.log('Matching option for {value}:', matchingOption);

                            }
                            
                            if (matchingOption) {
                                if (section.pattern.includes('style=') && matchingOption.includes('style="')) {
                                    const match = matchingOption.match(/style="([^"]*)"/);
                                    existingValue = match ? match[1] : '';
                                } else if (section.pattern.includes('height=') && matchingOption.includes('height=')) {
                                    // Extraer valor de height="valor" o height='valor'
                                    const match = matchingOption.match(/height=["']?([^"']*)["']?/);
                                    existingValue = match ? match[1] : '';
                                } else if (section.pattern.includes('min-') && matchingOption.startsWith('min-')) {
                                    existingValue = matchingOption.replace('min-', '');
                                } else if (section.pattern === '{value}') {
                                    existingValue = matchingOption.replace(/"/g, '&#34;').trim();
                                }
                            }
                            
                            html += `<input type="text" placeholder="${section.placeholder}" data-pattern="${section.pattern}" value="${existingValue}" oninput="window.handleCustomInput(this)">`;

                html += `<div class="config-preview" id="config-preview">${currentLine}</div>`;
                html += `<button class="config-apply" onclick="window.applyConfiguration()">Apply Changes</button>`;
                
                return html;

            function parseExistingOptions(currentLine) {
                // Extract options from a line like ":::grid cols-2 gap-4 responsive style="background: red" additional title"
                // or "```animation-loop-autoplay style="height:15em;" title"
                let match;
                let restOfLine = '';
                
                if (currentLine.startsWith(':::')) {
                    // Para bloques que empiezan con :::
                    const blockRegex = /^:::([a-z-]+)(.*)$/;
                    match = currentLine.match(blockRegex);
                    
                    if (!match) return { options: [], remainingText: '' };
                    restOfLine = match[2].trim();
                    
                } else if (currentLine.startsWith('```')) {
                    // Para bloques que empiezan con ``` (animation, svg, etc)
                    const blockRegex = /^```([a-z-]+)(.*)$/;
                    match = currentLine.match(blockRegex);
                    
                    if (!match) return { options: [], remainingText: '' };
                    restOfLine = match[2].trim();
                } else {
                    return { options: [], remainingText: '' };
                }
                
                if (!restOfLine) return { options: [], remainingText: '' };
                
                // Separate options from additional text
                // First, parse considering quotes for styles
                const options = [];
                let current = '';
                let inQuotes = false;
                let quoteChar = '';
                let remainingText = '';
                let foundEndOfOptions = false;
                
                for (let i = 0; i < restOfLine.length; i++) {
                    const char = restOfLine[i];
                    
                    if ((char === '"' || char === "'") && !inQuotes) {
                        inQuotes = true;
                        quoteChar = char;
                        current += char;
                    } else if (char === quoteChar && inQuotes) {
                        inQuotes = false;
                        current += char;
                        quoteChar = '';
                    } else if (char === ' ' && !inQuotes) {
                        if (current.trim()) {
                            // Check if this word is a valid option or additional text
                            const trimmedCurrent = current.trim();
                            if (isValidOption(trimmedCurrent)) {
                                options.push(trimmedCurrent);
                                current = '';
                            } else {
                                // It's additional text, capture the rest
                                foundEndOfOptions = true;
                                remainingText = restOfLine.substring(i - current.length).trim();
                                break;
                            }
                        }
                    } else {
                        current += char;
                    }
                }
                
                // Process the last token
                if (current.trim() && !foundEndOfOptions) {
                    const trimmedCurrent = current.trim();
                    if (isValidOption(trimmedCurrent)) {
                        options.push(trimmedCurrent);
                    } else {
                        remainingText = trimmedCurrent;
                    }
                }
                
                return { options, remainingText };
            }
            
            function isValidOption(text) {
                // List of known valid options
                const validPrefixes = ['cols-', 'gap-', 'min-', 'style='];
                const validStandalone = ['responsive', 'auto-fit', 'equal-height', '-open', 'loop', 'autoplay'];
                
                // Check if it's a valid standalone option
                if (validStandalone.includes(text)) {
                    return true;
                }
                
                // Check if it starts with a valid prefix
                if (validPrefixes.some(prefix => text.startsWith(prefix))) {
                    return true;
                }
                
                // For other special cases that could be options
                // Like HTML attributes for iframe, etc.
                if (text.includes('=') && !text.startsWith(':::') && !text.startsWith('```')) {
                    return true;
                }
                
                // Additional check for combined options (like animation-loop-autoplay)
                if (text.startsWith('animation-') || 
                    text.includes('-loop') || 
                    text.includes('-autoplay')) {
                    return true;
                }
                
                return false;
            }

            // Variable to control if the assistant has been initialized
            let configAssistantInitialized = false;

            function initializeConfigAssistant() {
                // Avoid multiple initialization
                if (configAssistantInitialized) return;
                configAssistantInitialized = true;
                
                // Click on configuration button
                document.getElementById('config-line-button').addEventListener('click', () => {
                    if (currentBlockType && currentLineNumber) {
                        const editor = window.currentEditor;
                        const model = editor.getModel();
                        const lineContent = model.getLineContent(currentLineNumber);
                        showConfigAssistant(currentBlockType, lineContent);
                    }
                });
                
                // Close assistant
                document.getElementById('config-close').addEventListener('click', hideConfigAssistant);
                
                // Event delegation for config options (visual toggles only)
                document.getElementById('config-assistant').addEventListener('click', (e) => {
                    if (e.target.classList.contains('config-option') && !e.target.classList.contains('remove-option')) {
                        e.preventDefault();
                        e.stopPropagation();
                        toggleConfigOption(e.target);
                    }
                });
                
                // Escape key to close
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        hideConfigAssistant();
                    }
                });
            }

            function toggleConfigOption(optionElement) {
                const option = optionElement.dataset.option;
                const isCurrentlyActive = optionElement.classList.contains('active');
                
                // For mutually exclusive options (same prefix)
                if (option.startsWith('cols-') || option.startsWith('gap-')) {
                    const prefix = option.split('-')[0] + '-';
                    
                    if (isCurrentlyActive) {
                        // If already active, just deactivate it (allow deselection)
                        optionElement.classList.remove('active');
                    } else {
                        // If not active, deactivate all from group and activate this one
                        document.querySelectorAll('.config-option').forEach(opt => {
                            if (opt.dataset.option && opt.dataset.option.startsWith(prefix)) {
                                opt.classList.remove('active');
                            }
                        });
                        
                        optionElement.classList.add('active');
                    }
                } else {
                    // For non-mutually exclusive options, simply toggle

                    if (isCurrentlyActive) {
                        optionElement.classList.remove('active');
                    } else {
                        optionElement.classList.add('active');
                    }
                }
                
                updatePreview();
            }

            function updatePreview() {
                if (!currentBlockType || !currentLineNumber) {
                    return;
                }
                
                const editor = window.currentEditor;
                if (!editor) {
                    return;
                }
                
                // Determinar el prefijo correcto basado en el tipo de bloque
                let blockStart;
                if (currentBlockType === 'animation' || currentBlockType === 'svg') {
                    blockStart = `\`\`\`${currentBlockType}`;
                } else {
                    blockStart = `:::${currentBlockType}`;
                }
                
                // Get active options from visual toggles
                const activeOptions = Array.from(document.querySelectorAll('.config-option.active'))
                    .map(el => el.dataset.option)
                    .filter(option => option && option.trim() !== '');
                
                // Add custom options that were added via input
                if (window.customConfigOptions && window.customConfigOptions.length > 0) {
                    activeOptions.push(...window.customConfigOptions);
                }
                
                // Remove duplicates and filter empty options
                const uniqueOptions = [...new Set(activeOptions)];
                
                // Build new line
                let newLine = blockStart;
                if (uniqueOptions.length > 0) {
                    newLine += ' ' + uniqueOptions.join(' ');
                }
                
                // Add additional text if it exists
                if (window.currentRemainingText && window.currentRemainingText.trim()) {
                    newLine += ' ' + window.currentRemainingText;
                }
                
                // Update preview
                const preview = document.getElementById('config-preview');
                if (preview) {
                    preview.textContent = newLine;
                }
            }

            function applyConfiguration() {
                if (!currentBlockType || !currentLineNumber) return;
                
                const editor = window.currentEditor;
                if (!editor) return;

                const preview = document.getElementById('config-preview');
                const newLine = preview.textContent;

                const model = editor.getModel();
                
                // Caso especial para cambios de ID en bloques float
                if (currentBlockType === 'float' && window.originalFloatId) {
                    // Extraer el nuevo ID del texto actualizado
                    const floatMatch = newLine.match(/^:::float-(\S+)/);
                    if (floatMatch && floatMatch[1]) {
                        const newFloatId = floatMatch[1];
                        
                        if (newFloatId !== window.originalFloatId) {
                            // Verificar si el nuevo ID ya existe en otro elemento
                            if (!isFloatIdUnique(newFloatId, window.originalFloatId, editor)) {
                                alert(`An element with the ID "${newFloatId}" already exists. The changes will not be applied. Please choose a unique ID.`);
                                return;
                            }
                            
                            // Buscar y reemplazar todos los puntos de activación (?=originalId)
                            const fullText = model.getValue();
                            const updatedText = fullText.replace(
                                new RegExp(`\\(\\?=${window.originalFloatId}\\)`, 'g'),
                                `(?=${newFloatId})`
                            ).replace(
                                new RegExp(`:::float-${window.originalFloatId}(?=[ \\n])`, 'g'),
                                `:::float-${newFloatId}`
                            );
                            
                            if (fullText !== updatedText) {
                                // Solo aplicar si hay cambios
                                const fullRange = {
                                    startLineNumber: 1,
                                    startColumn: 1,
                                    endLineNumber: model.getLineCount(),
                                    endColumn: model.getLineMaxColumn(model.getLineCount())
                                };
                                
                                editor.executeEdits('', [{
                                    range: fullRange,
                                    text: updatedText
                                }]);
                            }
                        }
                    }
                    hideConfigAssistant();
                    editor.focus();
                    return;
                }
                
                // Apply changes to editor
                const range = {
                    startLineNumber: currentLineNumber,
                    startColumn: 1,
                    endLineNumber: currentLineNumber,
                    endColumn: model.getLineMaxColumn(currentLineNumber)
                };
                
                editor.executeEdits('', [{
                    range: range,
                    text: newLine
                }]);
                
                
                // Close assistant only, but keep button visible
                hideConfigAssistant();
                
                // Keep configurable block state
                // Don't clear currentBlockType and currentLineNumber
                
                // Focus back to editor
                editor.focus();
            }

            // Hacer funciones globalmente accesibles
            window.applyConfiguration = applyConfiguration;

            // Debounce timer and processing flag for input handling
            let inputDebounceTimer = null;
            let isProcessingInput = false;

            function handleCustomInput(inputElement) {
                // Clear previous timer
                if (inputDebounceTimer) {
                    clearTimeout(inputDebounceTimer);
                }
                
                // Set new timer with longer debounce to prevent multiple executions
                inputDebounceTimer = setTimeout(() => {
                    if (!isProcessingInput) {
                        handleCustomInputImmediate(inputElement);
                    }
                }, 500); // 500ms delay to ensure user has stopped typing
            }

            function handleCustomInputImmediate(inputElement) {
                // Prevent concurrent executions
                if (isProcessingInput) {
                    return;
                }
                
                isProcessingInput = true;
                
                const pattern = inputElement.dataset.pattern;
                const value = inputElement.value.trim();
                
                try {
                    if (!pattern) {
                        console.error('No pattern found for input');
                        return;
                    }
                    
                    // Initialize custom options array if not exists
                    window.customConfigOptions = window.customConfigOptions || [];
                    
                    // Remove ALL existing options with the same pattern type (aggressive filtering)
                    const originalLength = window.customConfigOptions.length;
                    window.customConfigOptions = window.customConfigOptions.filter(opt => {
                        let shouldRemove = false;
                        
                        // Check if this is a style pattern (any pattern containing "style")
                        if (pattern.includes('style=')) {
                            // Remove ANY option that contains 'style=' 
                            if (opt.includes('style=')) {
                                shouldRemove = true;
                            }
                        } else if (pattern.includes('height=')) {
                            // Remove ANY option that contains 'height='
                            if (opt.includes('height=')) {
                                shouldRemove = true;
                            }
                        } else if (pattern.includes('min-')) {
                            // Remove ANY option that starts with 'min-'
                            if (opt.startsWith('min-')) {
                                shouldRemove = true;
                            }
                        } else if (pattern === '{value}') {
                            // Remove generic attributes (but not style=, height= or min-)
                            if (opt.includes('=') && 
                                !opt.includes('style=') && 
                                !opt.includes('height=') && 
                                !opt.startsWith('min-') && 
                                !opt.startsWith('cols-') && 
                                !opt.startsWith('gap-')) {

                                shouldRemove = true;
                            }
                        }
                        
                        return !shouldRemove; // Keep options that should NOT be removed
                    });
                                        
                    // If value is not empty, add new option
                    if (value) {
                        let optionText;
                        
                        // Handle different pattern types with pattern detection
                        if (pattern.includes('style=')) {
                            // For styles, construct with quotes
                            optionText = `style="${value}"`;
                        } else if (pattern.includes('height=')) {
                            // Para altura, sin comillas para facilitar el uso
                            optionText = `height="${value}"`;
                        } else if (pattern.includes('min-')) {
                            // For min values
                            optionText = `min-${value}`;
                        } else if (pattern === '{value}') {
                            // For generic attributes
                            optionText = value;
                        } else {
                            // Fallback for other patterns
                            optionText = pattern.replace('{value}', value);
                        }
                        
                        // Double-check for duplicates before adding
                        if (!window.customConfigOptions.includes(optionText)) {
                            window.customConfigOptions.push(optionText);
                        }
                    }
                    
                    updatePreview();
                } finally {
                    // Always release the processing flag
                    isProcessingInput = false;
                }
            }

            function addCustomOption(button) {
                // Legacy function - now handled by handleCustomInput
                const input = button ? button.previousElementSibling : null;
                if (input) {
                    handleCustomInput(input);
                }
            }

            // Función para verificar si un ID de elemento flotante ya existe
            function isFloatIdUnique(newId, currentId = null, editor = window.currentEditor) {
                if (!editor || !newId) return false;
                
                const currentContent = editor.getValue();
                
                // Patrones para buscar elementos con el ID especificado
                const triggerPattern = new RegExp(`\\(?=\\s*${newId}\\s*\\)`, "i");
                const floatPattern = new RegExp(`:::float-\\s*${newId}\\s*$`, "mi");
                
                return !(triggerPattern.test(currentContent) || floatPattern.test(currentContent));
            }
            
            // Función para cambiar el ID de elementos flotantes
            function handleFloatIdChange(inputElement) {
                // Clear previous timer
                if (inputDebounceTimer) {
                    clearTimeout(inputDebounceTimer);
                }
                
                // Set new timer with longer debounce to prevent multiple executions
                inputDebounceTimer = setTimeout(() => {
                    if (!isProcessingInput) {
                        isProcessingInput = true;
                        try {
                            const newId = inputElement.value.trim();
                            
                            if (newId && window.originalFloatId && newId !== window.originalFloatId) {
                                // Actualizar solo en la vista previa
                                const preview = document.getElementById('config-preview');
                                if (preview) {
                                    preview.textContent = ":::float-" + newId;
                                }
                            }
                        } finally {
                            isProcessingInput = false;
                        }
                    }
                }, 100);
            }

            // Make functions globally accessible
            window.applyConfiguration = applyConfiguration;
            window.addCustomOption = addCustomOption;
            window.handleCustomInput = handleCustomInput;
            window.handleCustomInputImmediate = handleCustomInputImmediate;
            window.handleFloatIdChange = handleFloatIdChange;

            // Initialize sidebar after rendering
            // With a small timeout to ensure DOM is ready
            setTimeout(() => {
                initSidebar([]);
                initializeConfigAssistant();
            }, 0);
        </script>
    </body>
</html>
