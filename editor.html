                    window.getRandomColor = function () {
                        // Lista de colores semitransparentes predefinidos
                        const colors = [
                            "rgba(25, 118, 210, 0.6)", // Azul
                            "rgba(56, 142, 60, 0.6)", // Verde
                            "rgba(211, 47, 47, 0.6)", // Rojo
                            "rgba(245, 124, 0, 0.6)", // Naranja
                            "rgba(123, 31, 162, 0.6)", // Púrpura
                            "rgba(0, 151, 167, 0.6)", // Cian
                            "rgba(81, 45, 168, 0.6)", // Índigo
                            "rgba(230, 74, 25, 0.6)", // Naranja oscuro
                        ];

                        return colors[Math.floor(Math.random() * colors.length)];
                    };

                    // Inicializar la vista previa después de definir las funciones
                    setTimeout(() => {
                        if (document.getElementById("grid-type")) {
                            updateGridPreview();
                        }
                    }, 100);
                }

                const handleSave = () => {
                    const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                    const fileName = activeTab
                        ? `${activeTab.title.replace(/[\\/:*?"<>|]/g, "_")}.md`
                        : "post.md";

                    const blob = new Blob([markdown], {
                        type: "text/markdown",
                    });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    // Actualizar pestaña y marcar como guardado
                    try {
                        // Marcar la pestaña como no modificada
                        if (activeTabId) {
                            setTabs((prevTabs) =>
                                prevTabs.map((tab) =>
                                    parseInt(tab.id) === parseInt(activeTabId)
                                        ? { ...tab, isModified: false, content: markdown }
                                        : tab
                                )
                            );
                        }
                    } catch (e) {
                        console.warn("No se pudo guardar en localStorage:", e);
                    }
                };

                const handleCopy = async () => {
                    try {
                        await navigator.clipboard.writeText(markdown);
                        return Promise.resolve();
                    } catch (err) {
                        console.error("Error copying to clipboard:", err);
                        return Promise.reject(err);
                    }
                };

                // Make the handleCopy function globally accessible
                window.handleCopy = handleCopy;

                const copyElementSelector = async () => {
                    try {
                        // Check if already in selection mode
                        if (globalElementSelectionState.isSelecting) {
                            // Exit selection mode
                            if (globalElementSelectionState.cleanup) {
                                globalElementSelectionState.cleanup();
                            }
                            setIsElementSelectionActive(false);
                            return Promise.reject("Element selection cancelled");
                        }

                        // Check if entry-content area exists
                        const entryContent = document.querySelector(".entry-content");
                        if (!entryContent) {
                            throw new Error("Preview area (.entry-content) not found");
                        }

                        // Function to generate a unique selector for an element within entry-content
                        const generateSelector = (element) => {
                            // Validaciones iniciales más robustas
                            if (
                                !element ||
                                !element.nodeType ||
                                element.nodeType !== Node.ELEMENT_NODE ||
                                element === document ||
                                element === document.body ||
                                element === document.documentElement
                            ) {
                                return null;
                            }

                            // verify that the element is inside entry-content
                            if (!entryContent || !entryContent.contains(element)) {
                                return null;
                            }

                            let path = [];
                            let current = element;

                            while (
                                current &&
                                current !== entryContent &&
                                current !== document &&
                                current !== document.body
                            ) {
                                let selector = current.tagName.toLowerCase();

                                // Priorizar ID únicos
                                if (current.id && current.id.trim()) {
                                    const id = current.id.trim();
                                    // Verificar que el ID sea único en el documento
                                    if (document.querySelectorAll(`#${CSS.escape(id)}`).length === 1) {
                                        selector = `#${CSS.escape(id)}`;

                                        // Validar que el selector con ID funciona directamente
                                        try {
                                            const testElement = document.querySelector(selector);
                                            if (testElement === current) {
                                                return selector; // Retornar directamente el ID único
                                            }
                                        } catch (error) {
                                            console.warn("ID selector is invalid:", selector, error);
                                        }
                                    }
                                }

                                // Agregar clases válidas
                                if (current.className && typeof current.className === "string") {
                                    const classes = current.className
                                        .trim()
                                        .split(/\s+/)
                                        .filter((cls) => cls && /^[a-zA-Z_-][a-zA-Z0-9_-]*$/.test(cls)) // Solo clases válidas
                                        .map((cls) => CSS.escape(cls));

                                    if (classes.length > 0) {
                                        selector += "." + classes.join(".");
                                    }
                                }

                                // Agregar atributos únicos si están disponibles
                                const uniqueAttributes = ["data-id", "data-key", "name"];
                                for (const attr of uniqueAttributes) {
                                    if (current.hasAttribute(attr)) {
                                        const attrValue = current.getAttribute(attr);
                                        if (attrValue && attrValue.trim()) {
                                            const attrSelector = `${selector}[${attr}="${CSS.escape(
                                                attrValue.trim()
                                            )}"]`;

                                            // Verificar si este atributo hace el selector único
                                            try {
                                                const testElements =
                                                    document.querySelectorAll(attrSelector);
                                                if (
                                                    testElements.length === 1 &&
                                                    testElements[0] === current
                                                ) {
                                                    return attrSelector; // Retornar directamente si es único
                                                }
                                            } catch (error) {
                                                // Continuar si hay error
                                            }

                                            selector += `[${attr}="${CSS.escape(attrValue.trim())}"]`;
                                            break;
                                        }
                                    }
                                }

                                // Usar nth-child solo cuando sea necesario
                                const parent = current.parentElement;
                                if (parent && parent !== entryContent) {
                                    const siblings = Array.from(parent.children).filter(
                                        (child) =>
                                            child.tagName === current.tagName &&
                                            child.nodeType === Node.ELEMENT_NODE
                                    );

                                    if (siblings.length > 1) {
                                        const index = siblings.indexOf(current) + 1;
                                        if (index > 0) {
                                            // Verify that we found the element
                                            selector += `:nth-child(${index})`;
                                        }
                                    }
                                }

                                path.unshift(selector);
                                current = current.parentElement;

                                // Prevenir bucles infinitos
                                if (path.length > 50) {
                                    console.warn(
                                        "Selector path too long, breaking to prevent infinite loop"
                                    );
                                    break;
                                }
                            }

                            // Si llegamos aquí, construir el selector final con el container
                            const finalSelector = ".entry-content > " + path.join(" > ");

                            // Validar que el selector funciona antes de devolverlo
                            try {
                                const testElement = document.querySelector(finalSelector);
                                if (testElement === element) {
                                    return finalSelector;
                                } else {
                                    // Si el selector no funciona, intentar con un enfoque más específico
                                    return null;
                                }
                            } catch (error) {
                                console.warn("Generated selector is invalid:", finalSelector, error);
                                return null;
                            }
                        };

                        // Enable element selection mode restricted to entry-content
                        const selectElement = () => {
                            return new Promise((resolve) => {
                                globalElementSelectionState.isSelecting = true;
                                setIsElementSelectionActive(true);
                                const originalCursor = entryContent.style.cursor;
                                entryContent.style.cursor = "crosshair";

                                // Disable pointer events on all iframes to prevent them from blocking clicks
                                const iframes = entryContent.querySelectorAll("iframe");
                                const originalIframeStyles = [];
                                iframes.forEach((iframe, index) => {
                                    originalIframeStyles[index] = iframe.style.pointerEvents || "";
                                    iframe.style.pointerEvents = "none";
                                });

                                // Create overlay to show selection feedback
                                const overlay = document.createElement("div");
                                overlay.style.cssText = `
                                    position: fixed;
                                    pointer-events: none;
                                    border: 2px solid #007ACC;
                                    background: rgba(0, 122, 204, 0.1);
                                    z-index: 10000;
                                    transition: all 0.1s ease;
                                    display: none;
                                `;
                                document.body.appendChild(overlay);

                                const updateOverlay = (element) => {
                                    // Only highlight elements within entry-content
                                    if (
                                        element &&
                                        entryContent.contains(element) &&
                                        element !== entryContent
                                    ) {
                                        const rect = element.getBoundingClientRect();
                                        overlay.style.left = rect.left + "px";
                                        overlay.style.top = rect.top + "px";
                                        overlay.style.width = rect.width + "px";
                                        overlay.style.height = rect.height + "px";
                                        overlay.style.display = "block";
                                    } else {
                                        overlay.style.display = "none";
                                    }
                                };

                                const handleMouseMove = (e) => {
                                    if (!globalElementSelectionState.isSelecting) return;
                                    const element = document.elementFromPoint(e.clientX, e.clientY);
                                    updateOverlay(element);
                                };

                                const handleClick = (e) => {
                                    if (!globalElementSelectionState.isSelecting) return;

                                    // Only allow selection within entry-content
                                    if (!entryContent.contains(e.target) || e.target === entryContent) {
                                        return;
                                    }

                                    e.preventDefault();
                                    e.stopPropagation();

                                    cleanup();
                                    resolve(e.target);
                                };

                                const handleEscape = (e) => {
                                    if (e.key === "Escape" && globalElementSelectionState.isSelecting) {
                                        cleanup();
                                        resolve(null);
                                    }
                                };

                                const cleanup = () => {
                                    if (!globalElementSelectionState.isSelecting) return;

                                    globalElementSelectionState.isSelecting = false;
                                    setIsElementSelectionActive(false);
                                    globalElementSelectionState.cleanup = null;

                                    entryContent.style.cursor = originalCursor;

                                    // Restore iframe pointer events
                                    iframes.forEach((iframe, index) => {
                                        iframe.style.pointerEvents = originalIframeStyles[index];
                                    });

                                    document.removeEventListener("mousemove", handleMouseMove, true);
                                    document.removeEventListener("click", handleClick, true);
                                    document.removeEventListener("keydown", handleEscape);

                                    if (overlay.parentNode) {
                                        document.body.removeChild(overlay);
                                    }

                                    // Restore border
                                    entryContent.style.border = originalBorder;
                                };

                                // Add visual indicator to entry-content
                                const originalBorder = entryContent.style.border;
                                entryContent.style.border = "2px dashed #007ACC";

                                // Store cleanup function globally
                                globalElementSelectionState.cleanup = cleanup;

                                // Use capture phase to ensure we get events before iframes
                                document.addEventListener("mousemove", handleMouseMove, true);
                                document.addEventListener("click", handleClick, true);
                                document.addEventListener("keydown", handleEscape);
                            });
                        };

                        const selectedElement = await selectElement();
                        if (selectedElement) {
                            const selector = generateSelector(selectedElement);
                            if (selector) {
                                const fullSelector = `document.querySelector("${selector}")`;
                                await navigator.clipboard.writeText(fullSelector);
                                return Promise.resolve();
                            }
                        }
                        return Promise.reject("No element selected");
                    } catch (err) {
                        console.error("Error copying element selector:", err);
                        return Promise.reject(err);
                    }
                };

                const handleExport = () => {
                    let [finalHtml, sidebarContent, finalJS] = renderMarkdown(markdown);
                    // Add finalJs
                    finalHtml += '<script id="entry-script">\n';
                    finalHtml += finalJS;
                    finalHtml += "\n<"; // If we put directly, some editors (like VSCode) get confused
                    finalHtml += "/script>";
                    // Add sidebarContent
                    finalHtml += '<script id="sidebar-data" type="application/json">\n';
                    finalHtml += JSON.stringify(sidebarContent, null, 4);
                    finalHtml += "\n<"; // If we put directly, some editors (like VSCode) get confused
                    finalHtml += "/script>";

                    const blob = new Blob([finalHtml], { type: "text/html" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "post.html";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };

                const toggleWordWrap = () => {
                    const newWordWrap = wordWrap === "on" ? "off" : "on";
                    setWordWrap(newWordWrap);

                    // Guardar preferencia en localStorage
                    try {
                        localStorage.setItem("editorWordWrap", newWordWrap);
                    } catch (e) {
                        console.warn(
                            "No se pudo guardar la preferencia de wordWrap en localStorage:",
                            e
                        );
                    }

                    // Actualizar configuración del editor Monaco
                    if (editorRef.current) {
                        editorRef.current.updateOptions({ wordWrap: newWordWrap });
                    }
                };

                const insertIframe = () => {
                    const url = prompt("Enter the iframe URL:");
                    if (url) {
                        insertText(`\n:::iframe style="height:25em"\n\t${url}\n:::\n`);
                    }
                };

                const insertFloatingElement = () => {
                    let id = "";

                    function createFloatElementContainer(id) {
                        const createContent = confirm(
                            `¿You want to create the floating content for ${id} now?`
                        );
                        if (createContent) {
                            insertText(
                                `\n:::float-${id}\n\t### Floating content\n\tWrite here the content that will appear when clicking on the question mark symbol.\n:::\n`
                            );
                            window.isIdUnique = false;
                        }
                    }

                    if (window.isIdUnique) {
                        createFloatElementContainer(window.isIdUnique);
                        window.isIdUnique = false;
                        return;
                    }

                    while (!window.isIdUnique) {
                        id = prompt("Enter a unique ID for this floating element:");
                        if (!id) return; // User canceled

                        // Check if the ID is unique using our centralized function
                        if (isFloatIdUnique(id, null, editorRef.current)) {
                            window.isIdUnique = id;
                        } else {
                            alert(
                                `An element with ID "${id}" already exists. Please choose another ID.`
                            );
                        }
                    }

                    // Insert the question mark marker
                    insertText(`(?=${id})`);

                    // Ask if they want to create the floating content now
                    createFloatElementContainer(id);
                };

                // Function to generate markdown tables
                const generateTable = (rows, columns) => {
                    if (!isNaN(rows) && !isNaN(columns) && rows > 0 && columns > 0) {
                        // Build header
                        let table = "\n|";
                        for (let i = 1; i <= columns; i++) {
                            table += ` Column ${i} |`;
                        }

                        // Build separator
                        table += "\n|";
                        for (let i = 1; i <= columns; i++) {
                            table += "----------|";
                        }

                        // Build rows
                        for (let i = 1; i <= rows; i++) {
                            table += "\n|";
                            for (let j = 1; j <= columns; j++) {
                                table += ` Cell ${String.fromCharCode(64 + j)}${i} |`;
                            }
                        }

                        insertText(table + "\n", "\n");
                        return true;
                    }
                    return false;
                };

                // Function to get list of posts files
                const getPostsFiles = async () => {
                    try {
                        // Fetch the search.json file which contains all posts
                        const response = await fetch(`${CONFIG.contentUrl}/search.json`);
                        if (!response.ok) {
                            throw new Error("Failed to fetch posts list");
                        }
                        const data = await response.json();

                        // Return the entries with title and resolved path
                        const files = data.entries.map((entry) => ({
                            title: entry.title,
                            // Use resolveContentPath to normalize all paths
                            path: resolveContentPath(entry.path),
                            summary: entry.summary || "",
                            tags: entry.tags || []
                        }));

                        return files;
                    } catch (error) {
                        console.error("Error fetching posts files:", error);
                        return [];
                    }
                };

                // Function to load file content
                const loadFileContent = async (filePath) => {
                    try {
                        const response = await fetch(filePath);
                        if (!response.ok) {
                            throw new Error(`Failed to load file: ${filePath}`);
                        }
                        return await response.text();
                    } catch (error) {
                        console.error("Error loading file:", error);
                        return null;
                    }
                };

                // Function to open diff editor
                const openDiffEditor = async (originalContent, originalTitle = "Original") => {
                    if (!editorRef.current) return;

                    const currentContent = editorRef.current.getValue();

                    // Get saved view mode preference
                    const savedViewMode = localStorage.getItem("diffEditorViewMode") || "split";

                    // Create a modal container for the diff editor
                    let diffContainer = document.getElementById("diff-editor-modal");
                    
                    // Clean up previous editor instance if it exists
                    if (diffContainer && diffContainer._cleanup) {
                        diffContainer._cleanup();
                    }
                    
                    if (!diffContainer) {
                        diffContainer = document.createElement("div");
                        diffContainer.id = "diff-editor-modal";
                        diffContainer.className = "modal-container";
                        diffContainer.style.cssText =
                            "display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;";
                        document.body.appendChild(diffContainer);
                    }

                    diffContainer.innerHTML = `
                        <div style="width: 96%; height: 96%; background: var(--bg-primary); border-radius: var(--border-radius); display: flex; flex-direction: column; overflow: hidden;">
                            <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: var(--spacing-md); border-bottom: 1px solid var(--border);">
                                <h3 style="margin: 0; color: #fafafa; border-radius: 8px; margin-right: 20px; padding: 10px;">Compare Changes: "${originalTitle.split("/").pop()}" vs "Current"</h3>
                                <div style="display: flex; gap: 10px; align-items: center;">
                                    <button id="diff-view-split" class="diff-view-toggle ${
                                        savedViewMode === "split" ? "active" : ""
                                    }" style="padding: 6px 12px; background: ${
                        savedViewMode === "split" ? "var(--bg-hover)" : "var(--bg-light)"
                    }; border: 0px solid var(--border); border-radius: var(--border-radius); color: var(--text-color); cursor: pointer; font-size: 14px;">
                                        Split View
                                    </button>
                                    <button id="diff-view-inline" class="diff-view-toggle ${
                                        savedViewMode === "inline" ? "active" : ""
                                    }" style="padding: 6px 12px; background: ${
                        savedViewMode === "inline" ? "var(--bg-hover)" : "var(--bg-light)"
                    }; border: 0px solid var(--border); border-radius: var(--border-radius); color: var(--text-color); cursor: pointer; font-size: 14px;">
                                        Inline View
                                    </button>
                                    <div style="display: flex; gap: 5px; align-items: center; margin-left: 10px; padding: 4px 8px; background: var(--bg-light); border: 1px solid var(--border); border-radius: var(--border-radius);">
                                        <button id="diff-nav-prev" style="background: none; border: none; color: var(--text-color); cursor: pointer; padding: 4px 8px; font-size: 16px;" title="Previous change">↑</button>
                                        <span id="diff-changes-info" style="color: var(--text-color); font-size: 14px; min-width: 60px; text-align: center;">Loading...</span>
                                        <button id="diff-nav-next" style="background: none; border: none; color: var(--text-color); cursor: pointer; padding: 4px 8px; font-size: 16px;" title="Next change">↓</button>
                                    </div>
                                    <button onclick="(function() { const modal = document.getElementById('diff-editor-modal'); if (modal && modal._cleanup) modal._cleanup(); modal.style.display='none'; })()" style="background: none; border: none; color: #fafafa; font-size: 24px; cursor: pointer; padding: 0; width: 30px; height: 30px; margin-left: 10px;">&times;</button>
                                </div>
                            </div>
                            <div id="diff-editor-container" style="flex: 1; overflow: hidden; padding-bottom: var(--spacing-md);"></div>
                        </div>
                    `;

                    diffContainer.style.display = "flex";

                    // Wait for DOM to be ready
                    setTimeout(() => {
                        const container = document.getElementById("diff-editor-container");
                        if (!container) return;

                        // Create diff editor
                        const diffEditor = monaco.editor.createDiffEditor(container, {
                            enableSplitViewResizing: true,
                            language: "markdown",
                            minimap: { enabled: true },
                            renderSideBySide: savedViewMode === "split",
                            readOnly: false,
                            automaticLayout: true,
                            wordWrap: wordWrap, // Using the wordWrap state
                            theme: document.documentElement.getAttribute("monaco-theme") || "vs-dark",
                        });

                        // Use the main editor's model for the modified side instead of creating a new one
                        // This ensures the undo/redo history is shared
                        const mainEditorModel = editorRef.current.getModel();
                        const originalModel = monaco.editor.createModel(originalContent, "markdown");

                        diffEditor.setModel({
                            original: originalModel,
                            modified: mainEditorModel,
                        });

                        // Get the modified editor
                        const modifiedEditor = diffEditor.getModifiedEditor();
                        
                        // Sync cursor position and selection from main editor to diff editor
                        const mainPosition = editorRef.current.getPosition();
                        const mainSelection = editorRef.current.getSelection();
                        if (mainPosition) {
                            modifiedEditor.setPosition(mainPosition);
                        }
                        if (mainSelection) {
                            modifiedEditor.setSelection(mainSelection);
                        }
                        
                        // Focus the modified editor
                        modifiedEditor.focus();

                        // Handle view mode toggle buttons
                        const splitBtn = document.getElementById("diff-view-split");
                        const inlineBtn = document.getElementById("diff-view-inline");

                        const updateViewMode = (mode) => {
                            diffEditor.updateOptions({
                                renderSideBySide: mode === "split",
                            });

                            // Update button styles
                            if (mode === "split") {
                                splitBtn.style.background = "var(--bg-hover)";
                                inlineBtn.style.background = "var(--bg-light)";
                                splitBtn.classList.add("active");
                                inlineBtn.classList.remove("active");
                            } else {
                                splitBtn.style.background = "var(--bg-light)";
                                inlineBtn.style.background = "var(--bg-hover)";
                                splitBtn.classList.remove("active");
                                inlineBtn.classList.add("active");
                            }

                            // Save preference
                            localStorage.setItem("diffEditorViewMode", mode);
                        };

                        splitBtn.addEventListener("click", () => updateViewMode("split"));
                        inlineBtn.addEventListener("click", () => updateViewMode("inline"));

                        // Navigation between changes
                        let currentChangeIndex = 0;
                        let lineChanges = [];
                        let isInitialLoad = true;
                        let hasNavigatedToFirstChange = false;

                        const updateChangesInfo = () => {
                            const changes = diffEditor.getLineChanges() || [];
                            lineChanges = changes;
                            const changesInfo = document.getElementById("diff-changes-info");
                            const prevBtn = document.getElementById("diff-nav-prev");
                            const nextBtn = document.getElementById("diff-nav-next");

                            if (changesInfo) {
                                if (changes.length === 0) {
                                    // Only show "No changes" if not initial load
                                    if (!isInitialLoad) {
                                        changesInfo.textContent = "No changes";
                                    }
                                    prevBtn.disabled = true;
                                    nextBtn.disabled = true;
                                    prevBtn.style.opacity = "0.5";
                                    nextBtn.style.opacity = "0.5";
                                    prevBtn.style.cursor = "not-allowed";
                                    nextBtn.style.cursor = "not-allowed";
                                } else {
                                    isInitialLoad = false;
                                    changesInfo.textContent = `${currentChangeIndex + 1}/${
                                        changes.length
                                    }`;
                                    prevBtn.disabled = false;
                                    nextBtn.disabled = false;
                                    prevBtn.style.opacity = "1";
                                    nextBtn.style.opacity = "1";
                                    prevBtn.style.cursor = "pointer";
                                    nextBtn.style.cursor = "pointer";
                                }
                            }
                        };

                        const goToChange = (index) => {
                            if (lineChanges.length === 0) return;

                            // Ensure index is within bounds
                            currentChangeIndex =
                                ((index % lineChanges.length) + lineChanges.length) % lineChanges.length;

                            const change = lineChanges[currentChangeIndex];
                            const modifiedEditor = diffEditor.getModifiedEditor();

                            // Get the line number to navigate to
                            let lineNumber;
                            if (change.modifiedStartLineNumber) {
                                lineNumber = change.modifiedStartLineNumber;
                            } else if (change.originalStartLineNumber) {
                                lineNumber = change.originalStartLineNumber;
                            } else {
                                return;
                            }

                            // Scroll to the change and highlight it
                            modifiedEditor.revealLineInCenter(
                                lineNumber,
                                monaco.editor.ScrollType.Smooth
                            );
                            modifiedEditor.setPosition({ lineNumber, column: 1 });
                            modifiedEditor.focus();

                            updateChangesInfo();
                        };

                        const prevBtn = document.getElementById("diff-nav-prev");
                        const nextBtn = document.getElementById("diff-nav-next");

                        prevBtn.addEventListener("click", () => {
                            goToChange(currentChangeIndex - 1);
                        });

                        nextBtn.addEventListener("click", () => {
                            goToChange(currentChangeIndex + 1);
                        });

                        // Listen for when diff is ready - this is much more reliable
                        let diffUpdateTimeout = null;
                        diffEditor.onDidUpdateDiff(() => {
                            // Clear any pending timeout
                            if (diffUpdateTimeout) {
                                clearTimeout(diffUpdateTimeout);
                            }
                            
                            // Reset to first change only if user hasn't manually navigated
                            if (!hasNavigatedToFirstChange) {
                                currentChangeIndex = 0;
                            }
                            isInitialLoad = false;
                            
                            // Small delay to ensure DOM is updated
                            diffUpdateTimeout = setTimeout(() => {
                                updateChangesInfo();
                                // Only auto-navigate to first change on initial load
                                if (!hasNavigatedToFirstChange && lineChanges.length > 0) {
                                    goToChange(0);
                                    hasNavigatedToFirstChange = true;
                                }
                            }, 50);
                        });

                        // Store reference to cleanup on close
                        diffContainer._cleanup = () => {
                            if (diffUpdateTimeout) {
                                clearTimeout(diffUpdateTimeout);
                            }
                            
                            // Sync back cursor position to main editor before closing
                            const modifiedEditor = diffEditor.getModifiedEditor();
                            const position = modifiedEditor.getPosition();
                            const selection = modifiedEditor.getSelection();
                            
                            if (editorRef.current) {
                                if (position) {
                                    editorRef.current.setPosition(position);
                                }
                                if (selection) {
                                    editorRef.current.setSelection(selection);
                                }
                                editorRef.current.focus();
                            }
                            
                            diffEditor.dispose();
                            originalModel.dispose();
                            // Don't dispose mainEditorModel as it's still being used by the main editor
                        };
                        
                        // Add keyboard shortcut to close modal (Escape key)
                        const handleEscape = (e) => {
                            if (e.key === "Escape") {
                                if (diffContainer._cleanup) {
                                    diffContainer._cleanup();
                                }
                                diffContainer.style.display = "none";
                                document.removeEventListener("keydown", handleEscape);
                            }
                        };
                        document.addEventListener("keydown", handleEscape);
                    }, 100);
                };

                // Translation functions

                // Common languages
                const languages = {
                    'en': 'English',
                    'es': 'Spanish',
                    'fr': 'French',
                    'de': 'German',
                    'it': 'Italian',
                    'pt': 'Portuguese',
                    'ru': 'Russian',
                    'ja': 'Japanese',
                    'ko': 'Korean',
                    'zh-CN': 'Chinese (Simplified)',
                    'zh-TW': 'Chinese (Traditional)',
                    'ar': 'Arabic',

                    'nl': 'Dutch',
                    'pl': 'Polish',
                    'tr': 'Turkish',
                    'vi': 'Vietnamese',
                    'th': 'Thai',
                    'sv': 'Swedish',
                    'da': 'Danish',
                    'fi': 'Finnish',
                    'no': 'Norwegian',
                    'cs': 'Czech',
                    'el': 'Greek',
                    'he': 'Hebrew',
                    'id': 'Indonesian',
                    'ms': 'Malay',
                    'ro': 'Romanian',
                    'uk': 'Ukrainian'
                };

                // Function to detect language of text (Google API)
                const detectLanguageGoogle = async (text) => {
                    try {
                        const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`);
                        const data = await response.json();
                        // The detected language is in data[2]
                        return data[2] || 'en';
                    } catch (error) {
                        console.error('Error detecting language:', error);
                        return 'en'; // Default to English if detection fails
                    }
                };

                // Function to detect language using Browser API
                const detectLanguageBrowser = async (text) => {
                    try {
                        if (!('LanguageDetector' in self)) {
                            return 'en';
                        }
                        
                        const detector = await self.LanguageDetector.create();
                        const results = await detector.detect(text);
                        
                        if (results && results.length > 0) {
                            return results[0].detectedLanguage;
                        }
                        return 'en';
                    } catch (error) {
                        console.error('Error detecting language with Browser API:', error);
                        return 'en';
                    }
                };

                // Function to translate text using Google Translate API
                const translateTextGoogle = async (text, targetLang, sourceLang = 'auto') => {
                    try {
                        const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
                        const data = await response.json();
                        
                        // The translation is in data[0][0][0]
                        if (data && data[0] && data[0][0]) {
                            return data[0].map(item => item[0]).join('');
                        }
                        return text;
                    } catch (error) {
                        console.error('Error translating text with Google API:', error);
                        throw error;
                    }
                };

                // Function to translate text using Browser Translation API
                const translateTextBrowser = async (text, targetLang, sourceLang = 'auto') => {
                    try {
                        if (!('Translator' in self)) {
                            throw new Error('Browser Translation API not available');
                        }

                        // If sourceLang is auto, detect it first
                        if (sourceLang === 'auto') {
                            sourceLang = await detectLanguageBrowser(text);
                        }

                        // Normalize language codes for Browser API (remove regional variants)
                        const normalizeLangCode = (code) => {
                            if (code === 'zh-CN') return 'zh';
                            if (code === 'zh-TW') return 'zh-Hant';
                            return code.split('-')[0];
                        };

                        const normalizedSource = normalizeLangCode(sourceLang);
                        const normalizedTarget = normalizeLangCode(targetLang);

                        // Create translator with the new API
                        const translator = await self.Translator.create({
                            sourceLanguage: normalizedSource,
                            targetLanguage: normalizedTarget
                        });

                        console.log('Translator created, translating...');

                        // Translate
                        const translatedText = await translator.translate(text);
                        return translatedText;
                    } catch (error) {
                        console.error('Error translating text with Browser API:', error);
                        throw error;
                    }
                };

                // Unified function to detect language
                const detectLanguage = async (text) => {
                    const useOnlineAPI = localStorage.getItem('translateUseOnlineAPI') !== 'false';
                    
                    if (useOnlineAPI) {
                        return await detectLanguageGoogle(text);
                    } else {
                        return await detectLanguageBrowser(text);
                    }
                };

                // Unified function to translate text
                const translateText = async (text, targetLang, sourceLang = 'auto') => {
                    const useOnlineAPI = localStorage.getItem('translateUseOnlineAPI') !== 'false';
                    
                    if (useOnlineAPI) {
                        return await translateTextGoogle(text, targetLang, sourceLang);
                    } else {
                        return await translateTextBrowser(text, targetLang, sourceLang);
                    }
                };

                // Function to handle translation
                window.handleTranslate = async () => {
                    if (!editorRef.current) return;

                    const editor = editorRef.current;
                    const selection = editor.getSelection();
                    const selectedText = editor.getModel().getValueInRange(selection);

                    if (!selectedText || selectedText.trim() === '') {
                        alert('Please select text to translate');
                        return;
                    }

                    // Get target language from localStorage (default to English)
                    const targetLang = localStorage.getItem('translateTargetLang') || 'en';
                    const useOnlineAPI = localStorage.getItem('translateUseOnlineAPI') !== 'false';

                    // Show loading indicator in button
                    const translateButton = document.querySelector('[title*="Translate Selection"]');

                        const originalHTML = translateButton.innerHTML;
                        translateButton.innerHTML = '<span style="pointer-events: none;">⏳</span>';
                        translateButton.disabled = true;

                        try {
                            // Detect source language
                            const sourceLang = await detectLanguage(selectedText);
                            
                            // Don't translate if already in target language
                            if (sourceLang === targetLang) {
                                alert(`Text is already in ${languages[targetLang] || targetLang}`);
                                return;
                            }

                            // Translate the text
                            const translatedText = await translateText(selectedText, targetLang, sourceLang);

                            editor.executeEdits(`translate`, [{

                                text: translatedText

                            const lastLineLength = translatedLines[translatedLines.length - 1].length;
                            
                            const newSelection = {

                                startColumn: selection.startColumn,
                                endLineNumber: selection.startLineNumber + translatedLines.length - 1,

                                    ? selection.startColumn + lastLineLength 
                                    : lastLineLength + 1
                            };
                            editor.setSelection(newSelection);
                            editor.focus();

                                    >
                                        <div>Online API</div>

                                    </button>

                                        onclick="window.toggleTranslationAPI(false)"
                                        style="
                                            flex: 1;

                    `;

                    document.body.appendChild(modal);

                    // Close on background click
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal) {
                            modal.remove();
                        }
                    });

                // Function to toggle between translation APIs
                window.toggleTranslationAPI = async (useOnline) => {
                    const previousValue = localStorage.getItem('translateUseOnlineAPI') !== 'false';
                    
                    // If already using the selected API, do nothing
                    if (previousValue === useOnline) {
                        return;

                    // If switching to browser API, check availability first
                    if (!useOnline) {
                        const isAvailable = ('Translator' in self);
                        if (!isAvailable) {

                    localStorage.setItem('translateUseOnlineAPI', useOnline.toString());
                    
                    // Reload the modal to reflect changes

                // Function to compare with default file
                const compareWithDefault = async () => {
                    const title = extractTitleFromMarkdown(markdown).replace(/\s+/g, "-");
                    if (!title) {

                    const search_json = await fetch(`${CONFIG.contentUrl}/search.json`);
                    if (!search_json.ok) {
                        throw new Error("Failed to fetch posts list");
                    }
                    const data_search = await search_json.json();
                    // Find the entry whose title matches the extracted title
                    const matchingEntry = data_search.entries.find(entry => 
                        entry.path.endsWith(".md") && (entry.title === title || 
                        entry.title.toLowerCase() === title.toLowerCase() ||
                        entry.title.replace(/\s+/g, "-") === title)
                    );
                    
                    // Get the path if a matching entry is found
                    const entryPath = matchingEntry ? matchingEntry.path : null;
                    let content = entryPath ? await loadFileContent(resolveContentPath(entryPath)) : null;

                    window.menuKeyboardState.lastKey = null;

                    // Function to render file list
                    renderFileList = (files, searchTerm = "", isFirst = false) => {
                        const fileList = document.getElementById("publish-file-list");
                        
                        // Check if search term contains folder filter (folder=something)
                        let folderFilter = null;
                        let actualSearchTerm = searchTerm;
                        
                        const folderMatch = searchTerm.match(/folder=([^\s;]+)/i);
                        if (folderMatch) {
                            folderFilter = folderMatch[1].toLowerCase();
                            // Remove folder= part from search term to allow combined search
                            actualSearchTerm = searchTerm.replace(/folder=[^\s;]+;?\s*/gi, '').trim();
                        }
                        
                        // Filter files based on search term and folder filter
                        let filteredFiles = files;
                        
                        if (folderFilter || actualSearchTerm) {
                            filteredFiles = files.filter(file => {
                                // Extract folder from file path
                                // Path can be like: "https://domain/posts/folder/file.md" or "posts/folder/file.md"
                                const pathParts = file.path.split('/');
                                const postsIndex = pathParts.findIndex(part => part === 'posts');
                                let fileFolder = null;
                                
                                if (postsIndex !== -1 && pathParts.length > postsIndex + 2) {
                                    // There's a folder between 'posts' and the filename
                                    fileFolder = pathParts.slice(postsIndex + 1, -1).join('/').toLowerCase();
                                }
                                
                                // Apply folder filter
                                if (folderFilter) {
                                    if (!fileFolder || !fileFolder.includes(folderFilter)) {
                                        return false;
                                    }
                                }
                                
                                // Apply text search
                                if (actualSearchTerm) {
                                    const titleMatch = file.title.toLowerCase().includes(actualSearchTerm.toLowerCase());
                                    const folderMatch = fileFolder && fileFolder.includes(actualSearchTerm.toLowerCase());
                                    return titleMatch || folderMatch;
                                }
                                
                                return true;
                            });
                        }
                        
                        if (filteredFiles.length === 0) {
                            fileList.innerHTML = `<p style="padding: 20px; text-align: center; color: var(--text-secondary);">No files found</p>`;

                        fileList.innerHTML = filteredFiles.map((file) => {
                            const fileNameWithoutExt = file.title;

                                window.selectedFiles.add(file.path);
                            }

                            const isSelected = window.selectedFiles.has(file.path);
                            
                            // Extract folder from path
                            const pathParts = file.path.split('/');
                            const postsIndex = pathParts.findIndex(part => part === 'posts');
                            let folderBadge = '';
                            
                            if (postsIndex !== -1 && pathParts.length > postsIndex + 2) {

                                        style="width: 18px; height: 18px; margin-right: 12px; cursor: pointer;"

                                    <small style="color: var(--text-secondary); font-size: 12px;">
                                        Must end with .md or .html<br>

                                <div style="border-top: 1px solid var(--border); padding-top: 15px; margin-bottom: 15px;">

                                    <div style="margin-bottom: 12px;">

                                    <div style="margin-bottom: 12px;">
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                                            <label style="color: var(--text-color); font-size: 14px;">Date:</label>
                                            <label style="display: flex; align-items: center; gap: 5px; color: var(--text-color); font-size: 13px; cursor: pointer;">
                                                <input type="checkbox" id="exclude-date-checkbox" style="cursor: pointer;" />
                                                <span>Exclude date from search.json</span>
                                            </label>
                                        </div>
                                        <input type="date" id="new-post-date" value="${today}" style="width: 100%; padding: 8px; background: var(--bg-light); border: 1px solid var(--border); border-radius: var(--border-radius); color: var(--text-color); font-size: 14px;" />
                                    </div>
                                    
                                    <div style="margin-bottom: 12px;">
                                        <label style="display: block; margin-bottom: 5px; color: var(--text-color); font-size: 14px;">Tags:</label>
                                        <input type="text" id="new-post-tags" placeholder="tag1, tag2, tag3" style="width: 100%; padding: 8px; background: var(--bg-light); border: 1px solid var(--border); border-radius: var(--border-radius); color: var(--text-color); font-size: 14px;" />
                                        <small style="color: var(--text-secondary); font-size: 12px;">Separate tags with commas</small>

                                <div style="display: flex; gap: 10px; justify-content: flex-end;">

                                    <button id="create-file-confirm-btn" style="padding: 8px 16px; background: var(--accent-color); border: none; border-radius: var(--border-radius); var(--text-color); cursor: pointer; font-size: 14px; font-weight: bold;">Create Post</button>

                        document.body.appendChild(newFileModal);
                        
                        // Focus on file name input
                        document.getElementById("new-file-name").focus();
                        
                        // Handle create button
                        document.getElementById("create-file-confirm-btn").addEventListener("click", () => {
                            const fileName = document.getElementById("new-file-name").value.trim();
                            const title = document.getElementById("new-post-title").value.trim();
                            const summary = document.getElementById("new-post-summary").value.trim();
                            const date = document.getElementById("new-post-date").value;
                            const excludeDate = document.getElementById("exclude-date-checkbox").checked;
                            const tagsInput = document.getElementById("new-post-tags").value.trim();
                            
                            // Validate required fields
                            if (!fileName) {
                                alert("File name is required");
                                return;
                            }
                            
                            if (!fileName.match(/\.(md|html)$/)) {
                                alert("File name must end with .md or .html");
                                return;
                            }
                            
                            if (!title) {
                                alert("Title is required");
                                return;
                            }
                            
                            if (!summary) {
                                alert("Summary is required");
                                return;
                            }
                            
                            // Parse tags
                            const tags = tagsInput 
                                ? tagsInput.split(',').map(tag => tag.trim()).filter(tag => tag)
                                : [];
                            
                            // Normalize the file path:
                            // - Remove leading ./ or /
                            // - If it starts with a folder path (e.g., "folder/file.md"), keep it
                            // - Use resolveContentPath with isFilenameOnly=true to prepend 'posts/' and build full URL
                            let normalizedFileName = fileName.replace(/^\.?\//, '');
                            const fullPath = resolveContentPath(normalizedFileName, true);
                            
                            // Check if file already exists
                            if (allFiles.some(file => file.path === fullPath)) {
                                alert("A file with this name already exists. Please choose a different name.");
                                return;
                            }
                            
                            document.getElementById("file-search-input").value = "";

                            // Store the search.json configuration
                            // For search.json, store the relative path (e.g., "posts/folder/file.md" or "./posts/file.md")
                            // We'll store it as a relative path starting with posts/
                            const relativePath = `./posts/${normalizedFileName}`;
                            
                            const searchConfig = {
                                title: title,
                                summary: summary,
                                path: relativePath, // Store relative path in search.json
                                tags: tags
                            };
                            
                            // Only include date if checkbox is not checked
                            if (!excludeDate && date) {
                                searchConfig.date = date;
                            }
                            
                            window.newFileSearchConfig = searchConfig;
                            
                            // Add to files list (with full URL for internal tracking)
                            allFiles.push({
                                title: title,
                                path: fullPath,
                                summary: summary || "",
                                tags: tags || []
                            });
                            
                            // Re-render list
                            renderFileList(allFiles, document.getElementById("file-search-input").value);
                            
                            // Mark the new file and check its checkbox
                            const newFileItem = document.querySelector(`.file-item[data-file="${fullPath}"]`);
                            if (newFileItem) {
                                newFileItem.dataset.isNew = "true";
                                const fileDiv = newFileItem.querySelector('div[style*="flex: 1"]');
                                if (fileDiv) {
                                    // Display the user-entered filename (which may include folders)
                                    fileDiv.innerHTML = `✨ ${normalizedFileName} <span style="color: var(--accent-color); margin-left: 10px;">NEW</span>`;
                                }
                                
                                // Auto-check the checkbox
                                const checkbox = newFileItem.querySelector('.file-checkbox');
                                if (checkbox) {
                                    window.selectedFiles.add(fullPath);
                                    checkbox.checked = true;
                                    window.updateSelectionUI(false); // false = don't sync from DOM
                                }
                            }
                            
                            // Close the modal
                            newFileModal.remove();

                            document.getElementById("file-search-input").style.display = "none";
                            document.getElementById("create-new-file-btn").style.display = "none";
                        });
                    });
                    
                    // Load files
                    try {
                        const files = await getPostsFiles();
                        allFiles = files;
                        const fileList = document.getElementById("publish-file-list");
                        
                        if (files.length === 0) {
                            fileList.innerHTML = `<p style="padding: 20px; text-align: center; color: var(--text-secondary);">No posts found</p>`;

                        renderFileList(allFiles, "", true); // true = isFirst
                        
                    } catch (error) {
                        const fileList = document.getElementById("publish-file-list");
                        fileList.innerHTML = `<p style="padding: 20px; text-align: center; color: #f44336;">Error loading files: ${error.message}</p>`;
                    }
                };

                window.toggleFileSelection = (item) => {

                    const filePath = checkbox.dataset.file;
                    if (checkbox.checked) {
                        window.selectedFiles.add(filePath);
                    } else {
                        window.selectedFiles.delete(filePath);
                    }
                    
                    // Update UI without syncing from DOM
                    window.updateSelectionUI(false);
                };

                // Function to update selection UI (button text and states)
                window.updateSelectionUI = (syncFromDOM = true) => {
                    const checkboxes = document.querySelectorAll(".file-checkbox:checked");
                    const deleteBtn = document.getElementById("delete-selected-btn");
                    const publishBtn = document.querySelector("button[onclick*='publishToGitHub']");

                    if (syncFromDOM) {

                        checkboxes.forEach(cb => {
                            window.selectedFiles.add(cb.dataset.file);
                        });
                    }
                    
                    // Update delete button - use selectedFiles.size for accurate count
                    const selectedCount = window.selectedFiles.size;
                    if (selectedCount > 0) {
                        deleteBtn.style.display = "block";
                        deleteBtn.textContent = `🗑️ Delete Selected (${selectedCount})`;
                    } else {
                        deleteBtn.style.display = "none";
                    }
                    
                    // Update publish button text and state
                    if (publishBtn) {
                        const icon_publish = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" style="margin: -4px; margin-right: 2px;"><path fill="currentColor" d="M11 20v-8.15l-2.6 2.6L7 13l5-5l5 5l-1.4 1.45l-2.6-2.6V20zM4 9V6q0-.825.588-1.412T6 4h12q.825 0 1.413.588T20 6v3h-2V6H6v3z"/></svg>'

                        if (selectedCount === 0) {

                            publishBtn.style.opacity = "1";
                            publishBtn.style.cursor = "pointer";

                        } else {
                            item.style.background = 'transparent';
                        }

                // Function to edit file metadata in search.json
                window.editFileMetadata = async (button, event) => {
                    event.stopPropagation();
                    
                    const filePath = button.dataset.file;
                    const fileName = filePath.split("/").pop();
                    const apiKey = document.getElementById("github-api-key")?.value.trim();
                    
                    if (!apiKey) {
                        alert("❌ Please enter your GitHub API key first");
                        return;
                    }
                    
                    // Show loading on button
                    const originalHTML = button.innerHTML;
                    button.disabled = true;
                    button.innerHTML = "⏳";
                    
                    try {
                        // Extract repository info
                        const contentUrl = CONFIG.contentUrl;
                        const githubMatch = contentUrl.match(/https?:\/\/([^.]+)\.github\.io\/([^\/]+)(?:\/(.*))?/);
                        
                        if (!githubMatch) {
                            throw new Error("Could not extract repository info");
                        }
                        
                        const repoOwner = githubMatch[1];
                        const repoName = githubMatch[2];
                        const basePath = githubMatch[3] || "";
                        
                        // Get search.json
                        const searchJsonPath = basePath ? `${basePath}/search.json` : "search.json";
                        const searchJsonUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${searchJsonPath}`;
                        
                        const searchResponse = await fetch(searchJsonUrl, {
                            headers: {
                                "Authorization": `token ${apiKey}`,
                                "Accept": "application/vnd.github.v3+json",
                            },
                        });
                        
                        if (!searchResponse.ok) {
                            throw new Error("Failed to load search.json");
                        }
                        
                        const searchData = await searchResponse.json();
                        const searchContent = JSON.parse(atob(searchData.content));
                        
                        // Find the entry for this file
                        const entry = searchContent.entries.find(e => {
                            return resolveContentPath(e.path) === filePath;
                        });
                        
                        if (!entry) {
                            throw new Error("File not found in search.json");

                        document.body.appendChild(editModal);
                        
                        // Handle save button

                                // Save to GitHub

                                    body: JSON.stringify({

                                        content: btoa(unescape(encodeURIComponent(JSON.stringify(searchContent, null, 2)))),
