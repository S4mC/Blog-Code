<!DOCTYPE html>

        <meta charset="UTF-8" />

        <script type="importmap">
            {
                "imports": {
                    "preact": "./cdn/preact/preact.mjs",
                    "preact/hooks": "./cdn/preact/hooks.mjs",
                    "htm/preact": "./cdn/preact/htm-preact.mjs"

    <body data-open-sidebar-resize="false">
        <div id="app"></div>

        <script type="module">
            import { render } from "preact";
            import { useState, useEffect, useRef } from "preact/hooks";
            import { html } from "htm/preact";
            import { Header } from "./components/Header.js";
            import { Sidebar, initSidebar } from "./components/Sidebar.js";
            import {
                renderMarkdown,
                showCopySuccess,
                manageEscapeIframe,
                manageClickFloatButton,
            } from "./components/markdownProcessor.js";

            // Configure Monaco Editor
            require.config({
                paths: {
                    vs: "./cdn/monaco/vs",
                },
            });

            // Configure the languages we want to load
            window.MonacoEnvironment = {
                getWorkerUrl: function (moduleId, label) {
                    return "./cdn/monaco/vs/base/worker/workerMain.js";
                },
                getLanguages: function () {
                    return ["markdown"];
                },
            };

            // Global variable to track element selection state
            let globalElementSelectionState = {
                isSelecting: false,
                cleanup: null,
            };

            // Handler for Escape key
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") {
                    manageEscapeIframe();
                }
            });

            document.addEventListener("click", function (e) {
                manageClickFloatButton(e);

                // For the main copy button
                if (e.target.closest(".copy-button")) {
                    const button = e.target.closest(".copy-button");
                    const originalHTML = button.innerHTML;

                    if (window.handleCopy) {
                        window
                            .handleCopy()
                            .then(() => {
                                showCopySuccess(button, originalHTML);
                            })
                            .catch((err) => {
                                console.error("Error copying:", err);
                            });
                    }
                }
            });

            // Contenido por defecto para un Nuevo documento
            const DEFAULT_MARKDOWN_CONTENT = `# New document

This is an example of a **blog entry** with *italic text*.

## Feature List

- Support for **bold** and *italic*
- Numbered and bullet lists
- \`inline code\`
- Links: [Example](https://example.com)

:::

### SVG Container

\`\`\`svg style="height:15em;"
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M3 21q-.825 0-1.412-.587T1 19V5q0-.825.588-1.412T3 3h18q.825 0 1.413.588T23 5v14q0 .825-.587 1.413T21 21zm4-4h2V7H5v2h2zm4.5 0h2l1.75-3.175L17 17h2l-2.75-5L19 7h-2l-1.75 3.175L13.5 7h-2l2.75 5z"/></svg>

### Note Callout

### Warning Callout

Be careful with this action!

            function MarkdownEditor() {
                const handleNavigateToEntry = (entry) => {
                    window.location.href = `./post.html?path=${encodeURIComponent(entry.path)}`;
                };

                // Estado para manejar las pestañas
                // Función auxiliar para generar IDs numéricos secuenciales
                const getNextTabId = (existingTabs) => {
                    if (!existingTabs || existingTabs.length === 0) return 1;
                    // Buscamos el ID numérico más alto y le sumamos 1
                    const maxId = Math.max(...existingTabs.map((tab) => parseInt(tab.id)));
                    return isNaN(maxId) ? 1 : maxId + 1;
                };

                const [tabs, setTabs] = useState(() => {
                    const savedTabs = localStorage.getItem("editorTabs");
                    return savedTabs
                        ? JSON.parse(savedTabs)
                        : [
                              {
                                  id: 1, // ID inicial fijo
                                  title: "New document",
                                  content: DEFAULT_MARKDOWN_CONTENT,
                                  isModified: false,
                              },
                          ];
                });

                // ID de la pestaña activa
                const [activeTabId, setActiveTabId] = useState(() => {
                    const savedActiveTabId = localStorage.getItem("editorActiveTabId");
                    return parseInt(savedActiveTabId) || (tabs.length > 0 ? parseInt(tabs[0].id) : null);
                });

                window.activeTabId = activeTabId;

                // Intentar recuperar configuración guardada de localStorage
                const savedShowPreview = localStorage.getItem("editorShowPreview");
                const savedPreviewPosition = localStorage.getItem("editorPreviewPosition");

                // Estado para el contenido y la vista previa
                const [markdown, setMarkdown] = useState(() => {
                    const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                    return activeTab?.content || DEFAULT_MARKDOWN_CONTENT;
                });

                const [preview, setPreview] = useState("");
                const [showPreview, setShowPreview] = useState(
                    savedShowPreview === "true" ? true : false
                );
                const [previewPosition, setPreviewPosition] = useState(
                    savedPreviewPosition === "bottom" ? "bottom" : "right"
                );
                
                // Estado para las proporciones del grid
                const [gridRatio, setGridRatio] = useState(
                    localStorage.getItem("editorGridRatio") || "1fr 0fr 1fr"
                );
                const [isResizing, setIsResizing] = useState(false);

                // State to track element selection mode
                const [isElementSelectionActive, setIsElementSelectionActive] = useState(false);

                const [wordWrap, setWordWrap] = useState(
                    localStorage.getItem("editorWordWrap") === "off" ? "off" : "on"
                ); // 'on' por defecto
                const editorRef = useRef(null);
                const containerRef = useRef(null);

                useEffect(() => {
                    updateTabContent(window.activeTabId, markdown);
                    if (showPreview) {
                        let [finalHtml, sidebarContent, finalJS] = renderMarkdown(markdown);
                        setPreview(finalHtml);
                        setTimeout(() => {
                            // Usar la función initSidebar que maneja de forma segura la inicialización/actualización
                            initSidebar(sidebarContent);
                            eval(finalJS);
                        }, 100);
                    }
                }, [showPreview, markdown]);

                useEffect(() => {
                    if (showPreview) {
                        setTimeout(() => {
                            if (window.Prism) {
                                window.Prism.highlightAll();
                            }
                        }, 100);
                    }
                }, [showPreview, preview]);
                
                // Efecto para manejar el redimensionamiento de la vista previa
                useEffect(() => {
                    const handleMouseMove = (e) => {
                        if (!isResizing || previewPosition !== "right") return;
                        
                        // Contenedor principal
                        const editorContainer = document.querySelector('.editor-content');
                        if (!editorContainer) return;
                        
                        // Calcular el ancho como fracción del contenedor padre
                        const containerRect = editorContainer.getBoundingClientRect();
                        const editorWidth = containerRect.width;
                        
                        // Calcular la posición relativa del mouse dentro del contenedor
                        const mouseX = e.clientX - containerRect.left;
                        
                        // Asegurar límites razonables (20% a 80%)
                        const limitedX = Math.min(Math.max(mouseX, editorWidth * 0.2), editorWidth * 0.8);
                        
                        // Calcular la proporción para grid-template-columns
                        // Usar proporciones relativas para que sea más preciso
                        const ratio = limitedX / editorWidth;
                        const leftFr = ratio;
                        const rightFr = 1 - ratio;
                        const newRatio = `${leftFr}fr 0fr ${rightFr}fr`;
                        setGridRatio(newRatio);
                        
                        // Aplicar directamente para evitar retraso en la UI
                        if (editorContainer) {
                            editorContainer.style.gridTemplateColumns = newRatio;
                        }
                        
                        // Optimizar re-rendering evitando actualizaciones de estado frecuentes
                        e.preventDefault();
                    };
                    
                    const handleMouseUp = () => {
                        if (isResizing) {
                            setIsResizing(false);
                            // Guardar en localStorage
                            localStorage.setItem("editorGridRatio", gridRatio);
                            // Remover la clase de resizing del body
                            document.body.classList.remove('resizing');
                        }
                    };
                    
                    if (isResizing) {
                        document.addEventListener('mousemove', handleMouseMove);
                        document.addEventListener('mouseup', handleMouseUp);
                        // Agregar clase al body para indicar que estamos redimensionando
                        document.body.classList.add('resizing');
                        // Cambiar el cursor en todo el documento durante el redimensionamiento
                        document.body.style.cursor = 'col-resize';
                    } else {
                        // Restaurar el cursor cuando no estamos redimensionando
                        document.body.style.cursor = '';
                    }
                    
                    return () => {
                        document.removeEventListener('mousemove', handleMouseMove);
                        document.removeEventListener('mouseup', handleMouseUp);
                        // Asegurarnos de limpiar las clases y estilos si el componente se desmonta
                        document.body.classList.remove('resizing');
                        document.body.style.cursor = '';
                    };
                }, [isResizing, previewPosition, gridRatio]);
                
                // Efecto para agregar eventos de mouse al redimensionador
                useEffect(() => {
                    const initResizer = () => {
                        const resizeElement = document.querySelector('.editor-content #resize-handle');
                        if (!resizeElement) return;
                        const handleMouseDown = (e) => {
                            // Check if we are in the resizer area
                            const rect = resizeElement.getBoundingClientRect();
                            if (previewPosition === "right") {
                                setIsResizing(true);
                                e.preventDefault();
                            }
                        };
                        
                        resizeElement.addEventListener('mousedown', handleMouseDown);
                        
                        return () => {
                            resizeElement.removeEventListener('mousedown', handleMouseDown);
                        };
                    };
                    
                    // Dar tiempo para que el DOM se actualice
                    const timerId = setTimeout(initResizer, 100);
                    
                    return () => {
                        clearTimeout(timerId);
                    };
                }, [previewPosition, showPreview]);

                useEffect(() => {
                    if (!editorRef.current) {
                        // La configuración ya está hecha arriba

                        require(["vs/editor/editor.main"], () => {
                            // Asegurar que cargamos el contenido correcto para la pestaña activa

                            editorRef.current = monaco.editor.create(containerRef.current, {
                                value: markdown,
                                language: "markdown",
                                theme: "vs-dark",
                                minimap: { enabled: true },
                                fontSize: 16,
                                lineNumbers: "on",
                                roundedSelection: false,
                                scrollBeyondLastLine: false,
                                wordWrap: wordWrap, // Usar el estado wordWrap
                                acceptSuggestionOnEnter: "off",
                                automaticLayout: true,
                                smoothScrolling: true,
                            });
                            
                            // Restaurar el estado de la vista (scroll, cursor, etc) si existe
                            const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                            if (activeTab && activeTab.viewState) {
                                editorRef.current.restoreViewState(activeTab.viewState);
                            }

                            // Hacer el editor disponible globalmente para el sistema de asistencia
                            window.currentEditor = editorRef.current;

                            // Add key handler
                            editorRef.current.addAction({
                                id: "extend-list",
                                label: "Extend List",
                                keybindings: [monaco.KeyCode.Enter],
                                precondition: null,
                                keybindingContext: null,
                                contextMenuGroupId: "navigation",
                                contextMenuOrder: 1.5,
                                // Method that will be executed
                                run: function (ed) {
                                    const editor = editorRef.current;
                                    const selection = editor.getSelection();
                                    const position = {
                                        lineNumber: selection.startLineNumber,
                                        column: selection.startColumn,
                                    };
                                    const model = editor.getModel();
                                    const lineContent = model.getLineContent(position.lineNumber);

                                    // Verificar si se presionó Shift+Enter
                                    const shiftKey =
                                        ed._standaloneKeybindingService._currentChord?.[0]?.shiftKey;

                                    // Expresión regular para detectar líneas numeradas (ej: "1. ", "12. ")
                                    const numberedListRegex = /^(\d+)\.(\s+)(.*)$/;
                                    // Expresión regular para detectar listas con viñetas (ej: "- ")
                                    const bulletListRegex = /^(-|\*)(\s+)(.*)$/;

                                    const numberedMatch = lineContent.match(numberedListRegex);
                                    const bulletMatch = lineContent.match(bulletListRegex);

                                    // Si se está presionando Shift, simplemente insertar un salto de línea sin continuar la lista
                                    if (shiftKey) {
                                        editor.trigger("keyboard", "type", { text: "\n" });
                                        return true;
                                    }

                                    if (numberedMatch) {
                                        // Si la línea actual está vacía después del número (ej: "1. "), terminar la lista
                                        if (numberedMatch[3].trim() === "") {
                                            // Eliminar la línea actual y añadir una línea en blanco
                                            const range = {
                                                startLineNumber: position.lineNumber,
                                                startColumn: 1,
                                                endLineNumber: position.lineNumber,
                                                endColumn: lineContent.length + 1,
                                            };
                                            editor.executeEdits("", [
                                                {
                                                    range: range,
                                                    text: "",
                                                },
                                            ]);
                                            return true; // Prevenir el comportamiento por defecto
                                        }

                                        const currentNumber = parseInt(numberedMatch[1], 10);
                                        const nextNumber = currentNumber + 1;
                                        const spacing = numberedMatch[2]; // Conservar el mismo espaciado

                                        // Insertar una nueva línea con el siguiente número
                                        const text = "\n" + nextNumber + "." + spacing;
                                        editor.executeEdits("", [
                                            {
                                                range: {
                                                    startLineNumber: position.lineNumber,
                                                    startColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                    endLineNumber: position.lineNumber,
                                                    endColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                },
                                                text: text,
                                            },
                                        ]);

                                        // Mover el cursor a la nueva línea después del número
                                        editor.setPosition({
                                            lineNumber: position.lineNumber + 1,
                                            column: (nextNumber + ".").length + spacing.length + 1,
                                        });

                                        return true; // Completado
                                    }

                                    if (bulletMatch) {
                                        // Si la línea actual está vacía después de la viñeta (ej: "- "), terminar la lista
                                        if (bulletMatch[3].trim() === "") {
                                            // Eliminar la línea actual y añadir una línea en blanco
                                            const range = {
                                                startLineNumber: position.lineNumber,
                                                startColumn: 1,
                                                endLineNumber: position.lineNumber,
                                                endColumn: lineContent.length + 1,
                                            };
                                            editor.executeEdits("", [
                                                {
                                                    range: range,
                                                    text: "",
                                                },
                                            ]);
                                            return true; // Prevenir el comportamiento por defecto
                                        }

                                        const bulletChar = bulletMatch[1]; // "-" o "*"
                                        const spacing = bulletMatch[2]; // Conservar el mismo espaciado

                                        // Insertar una nueva línea con la misma viñeta
                                        const text = "\n" + bulletChar + spacing;
                                        editor.executeEdits("", [
                                            {
                                                range: {
                                                    startLineNumber: position.lineNumber,
                                                    startColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                    endLineNumber: position.lineNumber,
                                                    endColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                },
                                                text: text,
                                            },
                                        ]);

                                        // Mover el cursor a la nueva línea después de la viñeta
                                        editor.setPosition({
                                            lineNumber: position.lineNumber + 1,
                                            column: bulletChar.length + spacing.length + 1,
                                        });

                                        return true; // Completado
                                    }

                                    // Si no es ningún tipo de lista, usar el comportamiento predeterminado de Enter
                                    editor.trigger("keyboard", "type", { text: "\n" });
                                    return true;
                                },
                            });

                            editorRef.current.onDidChangeModelContent(() => {
                                const content = editorRef.current.getValue();
                                setMarkdown(content);
                            });

                            // Sistema de asistencia de configuración
                            editorRef.current.onDidChangeCursorPosition((e) => {
                                checkForConfigurableBlock(e.position);
                            });

                            // Inicializar sistema de asistencia
                            initializeConfigAssistant();

                            // Manejar el evento beforeunload para guardar tabs en localStorage
                            const handleBeforeUnload = (e) => {
                                // Intentar guardar una última vez en localStorage
                                try {
                                    if (editorRef.current && window.activeTabId) {
                                        const content = editorRef.current.getValue();

                                        // Actualizar la pestaña activa con el contenido actual
                                        const tabsSave = tabs.map((tab) => {
                                            if (parseInt(tab.id) !== parseInt(window.activeTabId)) return tab;

                                            tab.viewState = editorRef.current.saveViewState();

                                            const tabTitle = extractTitleFromMarkdown(content);

                                            return {
                                                ...tab,
                                                content: content,
                                                title: tabTitle,
                                                isModified: true,
                                            };
                                        });

                                        // Guardar todas las pestañas en localStorage
                                        localStorage.setItem("editorTabs", JSON.stringify(tabsSave));
                                        // Si se guarda correctamente, no mostramos alerta
                                        return;
                                    }
                                } catch (error) {
                                    // Si falla el guardado, mostramos la alerta
                                    e.preventDefault();
                                    e.returnValue =
                                        "No se pudieron guardar los cambios automáticamente. ¿Seguro que quieres salir?";
                                    return e.returnValue;
                                }
                            };

                            window.addEventListener("beforeunload", handleBeforeUnload);
                        });
                    }
                }, []);

                // Efecto para guardar las pestañas en localStorage cuando cambian
                useEffect(() => {
                    try {
                        localStorage.setItem("editorTabs", JSON.stringify(tabs));
                    } catch (e) {
                        console.warn("Error al guardar las pestañas en localStorage:", e);
                    }
                }, [tabs]);

                // Efecto para actualizar el editor cuando cambia la pestaña activa
                useEffect(() => {
                    if (!editorRef.current || activeTabId === null) return;

                    window.activeTabId = activeTabId;
                    // Evitar actualizaciones en cascada

                    const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                    if (activeTab && editorRef.current.getModel()) {
                        const currentContent = editorRef.current.getValue();

                        const oldModel = editorRef.current.getModel();
                        if (oldModel) oldModel.dispose(); // limpia historial y estado interno

                        const newModel = monaco.editor.createModel(activeTab.content, "markdown");
                        setMarkdown(activeTab.content || "");

                        editorRef.current.setModel(newModel);
                        if (activeTab.viewState) {
                            editorRef.current.restoreViewState(activeTab.viewState);
                        }
                    }

                    localStorage.setItem("editorActiveTabId", activeTabId?.toString());
                }, [activeTabId]);

                // Función para extraer el título del contenido markdown
                const extractTitleFromMarkdown = (content) => {
                    const titleMatch = content.match(/^#\s+(.+)$/m);
                    return titleMatch ? titleMatch[1].trim() : "Sin título";
                };

                // Función para crear una nueva pestaña
                const createNewTab = () => {
                    // Guardar contenido actual antes de crear una nueva pestaña
                    if (editorRef.current && activeTabId) {
                        updateTabContent(activeTabId, editorRef.current.getValue());
                    }

                    const newTabNumber = tabs.length + 1;
                    const newTabId = getNextTabId(tabs);

                    // Crear contenido con título único
                    let newContent = DEFAULT_MARKDOWN_CONTENT;
                    if (newTabNumber > 1) {
                        newContent = newContent.replace("# New document", `# Document ${newTabNumber}`);
                    }

                    const newTab = {
                        id: newTabId,
                        title: newTabNumber === 1 ? "New document" : `Document ${newTabNumber}`,
                        content: newContent,
                        isModified: false,
                    };

                    // Actualizar estado
                    setTabs([...tabs, newTab]);
                    setActiveTabId(newTabId);
                };

                // Función para cambiar a una pestaña
                const switchToTab = (tabId) => {
                    const numericTabId = parseInt(tabId);
                    const numericActiveTabId = parseInt(activeTabId);

                    if (numericActiveTabId === numericTabId) return;

                    // Guardar contenido actual antes de cambiar
                    if (editorRef.current && activeTabId !== null) {
                        const currentContent = editorRef.current.getValue();

                        updateTabContent(numericActiveTabId, currentContent, true);
                    }

                    // Cambiar a la nueva pestaña
                    const targetTab = tabs.find((tab) => parseInt(tab.id) === numericTabId);
                    if (!targetTab) return;

                    setActiveTabId(numericTabId);
                };

                // Función para actualizar el contenido de una pestaña
                const updateTabContent = (tabId, newContent, viewState = false) => {
                    const numericTabId = parseInt(tabId);

                    setTabs((prevTabs) =>
                        prevTabs.map((tab) => {
                            if (parseInt(tab.id) !== numericTabId) return tab;

                            // Se actualiza el viewState, si se envia el parámetro
                            if (viewState) {
                                tab.viewState = editorRef.current.saveViewState();
                            }

                            const tabTitle = extractTitleFromMarkdown(newContent);

                            return {
                                ...tab,
                                content: newContent,
                                title: tabTitle,
                                isModified: true,
                            };
                        })
                    );
                };

                // Función para cerrar una pestaña
                const closeTab = (tabId, event) => {
                    if (event) event.stopPropagation();

                    const numericTabId = parseInt(tabId);
                    const numericActiveTabId = parseInt(activeTabId);
                    const tabToClose = tabs.find((tab) => parseInt(tab.id) === numericTabId);

                    // Confirmar cierre si hay cambios
                    if (tabToClose?.isModified) {
                        const confirmClose = window.confirm(
                            `¿Estás seguro que deseas cerrar "${tabToClose.title}"? Los cambios no guardados se perderán.`
                        );
                        if (!confirmClose) return;
                    }

                    // Manejar caso especial: última pestaña
                    if (tabs.length === 1) {
                        const newTabId = getNextTabId(tabs);
                        setTabs([
                            {
                                id: newTabId,
                                title: "New document",
                                content: DEFAULT_MARKDOWN_CONTENT,
                                isModified: false,
                            },
                        ]);
                        setActiveTabId(newTabId);
                        return;
                    }

                    // Si cerramos la pestaña activa, seleccionar otra
                    if (numericActiveTabId === numericTabId) {
                        const tabIndex = tabs.findIndex((tab) => parseInt(tab.id) === numericTabId);
                        const newActiveTab = tabs[tabIndex === 0 ? 1 : tabIndex - 1];
                        setActiveTabId(parseInt(newActiveTab.id));
                    }

                    // Eliminar la pestaña
                    setTabs((prevTabs) => prevTabs.filter((tab) => parseInt(tab.id) !== numericTabId));
                };

                const insertText = (beforeText, afterText = "", insertAtStart = false) => {
                    if (!editorRef.current) return;

                    const editor = editorRef.current;
                    const selection = editor.getSelection();
                    const selectedText = editor.getModel().getValueInRange(selection);

                    // If no text is selected and insertAtStart is true
                    if (selection.isEmpty() && insertAtStart) {
                        const lineNumber = selection.startLineNumber;
                        const lineContent = editor.getModel().getLineContent(lineNumber);

                        // Detect if there's already a header at the beginning
                        const headerRegex = /^(#{1,6}\s|#t\s)/;
                        const match = lineContent.match(headerRegex);

                        const lineStart = {
                            startLineNumber: lineNumber,
                            startColumn: 1,
                            endLineNumber: lineNumber,
                            endColumn: lineContent.length + 1,
                        };

                        let newText;
                        if (match) {
                            // If there's already a header, replace it
                            newText = beforeText + lineContent.substring(match[0].length) + afterText;
                        } else {
                            // If there's no header, add a new one
                            newText = beforeText + lineContent + afterText;
                        }

                        // Edit at the beginning of the line
                        editor.executeEdits("", [
                            {
                                range: lineStart,
                                text: newText,
                            },
                        ]);
                    } else {
                        // Normal behavior when text is selected
                        const newText = beforeText + selectedText + afterText;

                        // Realiza la edición
                        editor.executeEdits("", [
                            {
                                range: selection,
                                text: newText,
                            },
                        ]);
                    }
                    // Calculate where the cursor will be: right after beforeText + selectedText
                    let lines = (beforeText + selectedText).split("\n");
                    let newLineNumber = selection.startLineNumber + (lines.length - 1);
                    let newColumn;

                    if (lines.length === 1) {
                        // Everything on the same line
                        newColumn = selection.startColumn + lines[0].length;
                    } else {
                        // Last line of the block
                        newColumn = lines[lines.length - 1].length + 1;
                    }

                    // Posiciona el cursor
                    editor.setSelection({
                        startLineNumber: newLineNumber,
                        startColumn: newColumn,
                        endLineNumber: newLineNumber,
                        endColumn: newColumn,
                    });

                    // Center the cursor line on the screen with smooth animation
                    // Center the cursor line on the screen

                    // Variables y event listeners para el grid visual

                    // Funciones para el grid visual
                    window.regenerateVisualGrid = function() {
                        const columns = parseInt(document.getElementById('visual-grid-columns').value) || 5;
                        const rows = parseInt(document.getElementById('visual-grid-rows').value) || 5;
                        const gap = parseInt(document.getElementById('visual-grid-gap').value) || 8;
                        
                        const designerEl = document.getElementById('visual-grid-designer');
                        if (!designerEl) return;
                        
                        // Limpia el diseñador
                        designerEl.innerHTML = '';
                        
                        // Configura el grid
                        designerEl.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
                        designerEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
                        designerEl.style.gap = `${gap}px`;
                        
                        // Create grid cells
                        for (let y = 0; y < rows; y++) {
                            for (let x = 0; x < columns; x++) {
                                const cell = document.createElement('div');
                                cell.className = 'grid-cell';
                                cell.dataset.x = x;
                                cell.dataset.y = y;
                                
                                // Events for drawing areas
                                cell.addEventListener('mousedown', startDrawing);
                                cell.addEventListener('mousemove', continueDrawing);
                                
                                designerEl.appendChild(cell);
                            }
                        }
                        
                        // Redraw existing areas
                        redrawGridAreas();
                        updateVisualGridPreview();
                    };
                    
                    window.startDrawing = function(e) {
                        if (e.button !== 0) return; // Left button only
                        
                        isDrawing = true;
                        const cell = e.target;
                        startCell = {
                            x: parseInt(cell.dataset.x),
                            y: parseInt(cell.dataset.y)
                        };
                        
                        // Inicializar la última celda conocida
                        lastKnownCell = startCell;
                        
                        // Create a temporary area to display while drawing
                        currentArea = document.createElement('div');
                        currentArea.className = 'grid-area drawing';
                        currentArea.innerHTML = `Area ${gridAreaCounter}`;
                        document.getElementById('visual-grid-designer').appendChild(currentArea);
                        
                        updateCurrentArea(startCell, startCell);
                    };
                    
                    window.continueDrawing = function(e) {
                        if (!isDrawing || !currentArea) return;
                        
                        const cell = e.target;
                        if (cell.className !== 'grid-cell') return;
                        
                        const currentCell = {
                            x: parseInt(cell.dataset.x),
                            y: parseInt(cell.dataset.y)
                        };
                        
                        // Actualizar la última celda conocida
                        lastKnownCell = currentCell;
                        
                        updateCurrentArea(startCell, currentCell);
                    };
                    
                    let lastKnownCell = null;

                    window.endDrawing = function(e) {
                        if (!isDrawing || !currentArea) return;
                        
                        // Si no tenemos una última celda conocida, cancelar
                        if (!lastKnownCell) {
                            if (currentArea) {
                                currentArea.remove();
                                currentArea = null;
                            }
                            isDrawing = false;
                            return;
                        }
                        
                        const endCell = {
                            x: lastKnownCell.x,
                            y: lastKnownCell.y
                        };
                        
                        // Calculate the final area
                        const startX = Math.min(startCell.x, endCell.x);
                        const startY = Math.min(startCell.y, endCell.y);
                        const endX = Math.max(startCell.x, endCell.x);
                        const endY = Math.max(startCell.y, endCell.y);
                        
                        // Add the area to the list
                        const newArea = {
                            id: `area-${gridAreaCounter}`,
                            name: `Area ${gridAreaCounter}`,
                            startX,
                            startY,
                            endX,
                            endY,
                            color: getRandomColor()
                        };
                        
                        gridAreas.push(newArea);
                        gridAreaCounter++;
                        
                        // Remove the temporary area
                        if (currentArea) {
                            currentArea.remove();
                            currentArea = null;
                        }
                        
                        // Redraw all areas
                        redrawGridAreas();
                        updateGridAreasList();
                        updateVisualGridPreview();
                        
                        isDrawing = false;
                    };
                    
                    window.updateCurrentArea = function(start, end) {
                        if (!currentArea) return;
                        
                        const designerEl = document.getElementById('visual-grid-designer');
                        const cells = designerEl.querySelectorAll('.grid-cell');
                        const cellSize = cells[0].getBoundingClientRect();
                        const gap = parseInt(document.getElementById('visual-grid-gap').value) || 8;
                        
                        const startX = Math.min(start.x, end.x);
                        const startY = Math.min(start.y, end.y);
                        const endX = Math.max(start.x, end.x);
                        const endY = Math.max(start.y, end.y);
                        
                        // Calcular tamaño y posición
                        const width = (endX - startX + 1) * cellSize.width + (endX - startX) * gap;
                        const height = (endY - startY + 1) * cellSize.height + (endY - startY) * gap;
                        
                        // Encontrar la primera celda para posicionar correctamente
                        const firstCell = designerEl.querySelector(`.grid-cell[data-x="${startX}"][data-y="${startY}"]`);
                        const firstCellRect = firstCell.getBoundingClientRect();
                        const designerRect = designerEl.getBoundingClientRect();
                        
                        // Ajustar posición relativa al contenedor
                        const left = firstCellRect.left - designerRect.left;
                        const top = firstCellRect.top - designerRect.top;
                        
                        // Aplicar estilo
                        currentArea.style.left = `${left}px`;
                        currentArea.style.top = `${top}px`;
                        currentArea.style.width = `${width}px`;
                        currentArea.style.height = `${height}px`;
                    };
                    
                    window.redrawGridAreas = function() {
                        // Remove all existing areas
                        const designerEl = document.getElementById('visual-grid-designer');
                        if (!designerEl) return;
                        
                        designerEl.querySelectorAll('.grid-area:not(.drawing)').forEach(el => el.remove());
                        
                        // Draw each area
                        gridAreas.forEach(area => {
                            const areaEl = document.createElement('div');
                            areaEl.className = 'grid-area';
                            areaEl.id = area.id;
                            areaEl.innerHTML = area.name;
                            areaEl.style.backgroundColor = area.color || 'rgba(0, 122, 204, 0.4)';
                            
                            // Add button to remove
                            const removeBtn = document.createElement('div');
                            removeBtn.className = 'remove-area';
                            removeBtn.innerHTML = '×';
                            removeBtn.onclick = (e) => {
                                e.stopPropagation();
                                removeGridArea(area.id);
                            };
                            areaEl.appendChild(removeBtn);
                            
                            designerEl.appendChild(areaEl);
                            
                            // Position the area correctly
                            positionGridArea(areaEl, area);
                        });
                    };
                    
                    window.positionGridArea = function(areaEl, area) {
                        const designerEl = document.getElementById('visual-grid-designer');
                        const cells = designerEl.querySelectorAll('.grid-cell');
                        if (cells.length === 0) return;
                        
                        const cellSize = cells[0].getBoundingClientRect();
                        const gap = parseInt(document.getElementById('visual-grid-gap').value) || 8;
                        
                        // Encontrar la primera celda para posicionar correctamente
                        const firstCell = designerEl.querySelector(`.grid-cell[data-x="${area.startX}"][data-y="${area.startY}"]`);
                        if (!firstCell) return;
                        
                        const firstCellRect = firstCell.getBoundingClientRect();
                        const designerRect = designerEl.getBoundingClientRect();
                        
                        // Calcular tamaño
                        const width = (area.endX - area.startX + 1) * cellSize.width + (area.endX - area.startX) * gap;
                        const height = (area.endY - area.startY + 1) * cellSize.height + (area.endY - area.startY) * gap;
                        
                        // Ajustar posición relativa al contenedor
                        const left = firstCellRect.left - designerRect.left;
                        const top = firstCellRect.top - designerRect.top;
                        
                        // Aplicar estilo
                        areaEl.style.left = `${left}px`;
                        areaEl.style.top = `${top}px`;
                        areaEl.style.width = `${width}px`;
                        areaEl.style.height = `${height}px`;
                    };
                    
                    window.updateGridAreasList = function() {
                        const listEl = document.getElementById('grid-areas-list');
                        if (!listEl) return;
                        
                        // Clear the list
                        listEl.innerHTML = '';
                        
                        // Add each area to the list
                        gridAreas.forEach(area => {
                            const itemEl = document.createElement('div');
                            itemEl.className = 'grid-area-item';
                            
                            const info = document.createElement('span');
                            info.textContent = `${area.name}: (${area.startX+1},${area.startY+1}) a (${area.endX+1},${area.endY+1})`;
                            
                            const removeBtn = document.createElement('button');
                            removeBtn.textContent = 'Remove';
                            removeBtn.onclick = () => removeGridArea(area.id);
                            
                            itemEl.appendChild(info);
                            itemEl.appendChild(removeBtn);
                            listEl.appendChild(itemEl);
                        });
                    };
                    
                    window.removeGridArea = function(id) {
                        // Remove the area from the list
                        gridAreas = gridAreas.filter(area => area.id !== id);
                        
                        // Redraw and update the list
                        redrawGridAreas();
                        updateGridAreasList();
                        updateVisualGridPreview();
                    };
                    
                    window.resetGridAreas = function() {
                        // Confirm before deleting all areas
                        if (gridAreas.length > 0 && confirm('Are you sure you want to delete all areas?')) {
                            gridAreas = [];
                            gridAreaCounter = 1;
                            redrawGridAreas();
                            updateGridAreasList();
                            updateVisualGridPreview();
                        }
                    };
                    
                    window.addGridArea = function() {
                        const columns = parseInt(document.getElementById('visual-grid-columns').value) || 5;
                        const rows = parseInt(document.getElementById('visual-grid-rows').value) || 5;
                        
                        // Create a default area in an available position
                        let startX = 0, startY = 0;
                        let found = false;
                        
                        // Find an available cell
                        outerLoop:
                        for (let y = 0; y < rows; y++) {
                            for (let x = 0; x < columns; x++) {
                                // Comprobar si esta celda ya está ocupada
                                const isOccupied = gridAreas.some(area => 
                                    x >= area.startX && x <= area.endX && 
                                    y >= area.startY && y <= area.endY
                                );
                                
                                if (!isOccupied) {
                                    startX = x;
                                    startY = y;
                                    found = true;
                                    break outerLoop;
                                }
                            }
                        }
                        
                        if (!found) {
                            alert('There\'s no space available for a new area. Delete an existing area or resize the grid.');
                            return;
                        }
                        
                        // Crear el área con tamaño 1x1
                        const newArea = {
                            id: `area-${gridAreaCounter}`,
                            name: `Área ${gridAreaCounter}`,
                            startX,
                            startY,
                            endX: startX,
                            endY: startY,
                            color: getRandomColor()
                        };
                        
                        gridAreas.push(newArea);
                        gridAreaCounter++;
                        
                        // Actualizar la interfaz
                        redrawGridAreas();
                        updateGridAreasList();
                        updateVisualGridPreview();
                    };
                    
                    window.updateVisualGridGap = function() {
                        const designerEl = document.getElementById('visual-grid-designer');
                        if (!designerEl) return;
                        
                        const gap = parseInt(document.getElementById('visual-grid-gap').value) || 8;
                        designerEl.style.gap = `${gap}px`;
                        
                        // Actualizar posición de todas las áreas
                        redrawGridAreas();
                        updateVisualGridPreview();
                    };
                    
                    window.updateVisualGridPreview = function() {
                        const previewEl = document.getElementById('grid-preview');
                        if (!previewEl) return;
                        
                        const columns = parseInt(document.getElementById('visual-grid-columns').value) || 5;
                        const rows = parseInt(document.getElementById('visual-grid-rows').value) || 5;
                        const gap = parseInt(document.getElementById('visual-grid-gap').value) || 8;
                        
                        let previewHTML = `<div class="preview-grid" style="grid-template-columns: repeat(${columns}, 1fr); grid-template-rows: repeat(${rows}, 1fr); gap: ${gap}px;">`;
                        
                        // Create a 2D array to represent the grid
                        const gridMap = Array(rows).fill().map(() => Array(columns).fill(null));
                        
                        // Mark areas in the map
                        gridAreas.forEach((area, index) => {
                            for (let y = area.startY; y <= area.endY; y++) {
                                for (let x = area.startX; x <= area.endX; x++) {
                                    if (y >= 0 && y < rows && x >= 0 && x < columns) {
                                        gridMap[y][x] = index;
                                    }
                                }
                            }
                        });
                        
                        // Create elements for each grid area
                        gridAreas.forEach((area, index) => {
                            const style = `
                                grid-column: ${area.startX + 1} / ${area.endX + 2};
                                grid-row: ${area.startY + 1} / ${area.endY + 2};
                                background-color: var(--card-background);
                                border: 1px solid var(--border-color);
                            `;
                            
                            previewHTML += `<div class="preview-grid-item" style="${style}">${area.name}</div>`;
                        });
                        
                        // Add empty cells where no areas are defined
                        for (let y = 0; y < rows; y++) {
                            for (let x = 0; x < columns; x++) {
                                if (gridMap[y][x] === null) {
                                    const style = `
                                        grid-column: ${x + 1} / ${x + 2};
                                        grid-row: ${y + 1} / ${y + 2};
                                        opacity: 0.3;
                                    `;
                                    
                                    previewHTML += `<div class="preview-grid-item" style="${style}"></div>`;
                                }
                            }
                        }
                        
                        previewHTML += '</div>';
                        previewEl.innerHTML = previewHTML;
                    };
                    
                    window.getRandomColor = function() {
                        // Lista de colores semitransparentes predefinidos
                        const colors = [
                            'rgba(25, 118, 210, 0.6)',   // Azul
                            'rgba(56, 142, 60, 0.6)',    // Verde
                            'rgba(211, 47, 47, 0.6)',    // Rojo
                            'rgba(245, 124, 0, 0.6)',    // Naranja
                            'rgba(123, 31, 162, 0.6)',   // Púrpura
                            'rgba(0, 151, 167, 0.6)',    // Cian
                            'rgba(81, 45, 168, 0.6)',    // Índigo
                            'rgba(230, 74, 25, 0.6)',    // Naranja oscuro
                        ];
                        
                        return colors[Math.floor(Math.random() * colors.length)];
                    };
                    
                    // Inicializar la vista previa después de definir las funciones
                    setTimeout(() => {
                        if (document.getElementById('grid-type')) {
                            updateGridPreview();
                        }
                    }, 100);
                }

                const handleSave = () => {
                    const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                    const fileName = activeTab
                        ? `${activeTab.title.replace(/[\\/:*?"<>|]/g, "_")}.md`
                        : "post.md";

                    const blob = new Blob([markdown], {
                        type: "text/markdown",
                    });

                    const a = document.createElement("a");

                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    // Actualizar pestaña y marcar como guardado
                    try {
                        // Marcar la pestaña como no modificada
                        if (activeTabId) {
                            setTabs((prevTabs) =>
                                prevTabs.map((tab) =>
                                    parseInt(tab.id) === parseInt(activeTabId)
                                        ? { ...tab, isModified: false, content: markdown }
                                        : tab

                            );

                        console.warn("No se pudo guardar en localStorage:", e);
                    }
                };

                const handleCopy = async () => {
                    try {
                        await navigator.clipboard.writeText(markdown);
                        return Promise.resolve();
                    } catch (err) {
                        console.error("Error copying to clipboard:", err);
                        return Promise.reject(err);
                    }
                };

                // Make the handleCopy function globally accessible
                window.handleCopy = handleCopy;

                const copyElementSelector = async () => {
                    try {
                        // Check if already in selection mode
                        if (globalElementSelectionState.isSelecting) {
                            // Exit selection mode
                            if (globalElementSelectionState.cleanup) {
                                globalElementSelectionState.cleanup();
                            }
                            setIsElementSelectionActive(false);
                            return Promise.reject("Element selection cancelled");
                        }

                        // Check if entry-content area exists
                        const entryContent = document.querySelector(".entry-content");
                        if (!entryContent) {
                            throw new Error("Preview area (.entry-content) not found");
                        }

                        // Function to generate a unique selector for an element within entry-content
                        const generateSelector = (element) => {
                            // Validaciones iniciales más robustas
                            if (
                                !element ||
                                !element.nodeType ||
                                element.nodeType !== Node.ELEMENT_NODE ||
                                element === document ||
                                element === document.body ||
                                element === document.documentElement
                            ) {
                                return null;
                            }

                            // Verificar que entryContent existe y contiene el elemento
                            if (!entryContent || !entryContent.contains(element)) {
                                return null;
                            }

                            let path = [];
                            let current = element;

                            while (
                                current &&
                                current !== entryContent &&
                                current !== document &&
                                current !== document.body
                            ) {
                                let selector = current.tagName.toLowerCase();

                                // Priorizar ID únicos
                                if (current.id && current.id.trim()) {
                                    const id = current.id.trim();
                                    // Verificar que el ID sea único en el documento
                                    if (document.querySelectorAll(`#${CSS.escape(id)}`).length === 1) {
                                        selector = `#${CSS.escape(id)}`;

                                        // Validar que el selector con ID funciona directamente
                                        try {
                                            const testElement = document.querySelector(selector);
                                            if (testElement === current) {
                                                return selector; // Retornar directamente el ID único
                                            }
                                        } catch (error) {
                                            console.warn("ID selector is invalid:", selector, error);
                                        }
                                    }
                                }

                                // Agregar clases válidas
                                if (current.className && typeof current.className === "string") {
                                    const classes = current.className
                                        .trim()
                                        .split(/\s+/)
                                        .filter((cls) => cls && /^[a-zA-Z_-][a-zA-Z0-9_-]*$/.test(cls)) // Solo clases válidas
                                        .map((cls) => CSS.escape(cls));

                                    if (classes.length > 0) {
                                        selector += "." + classes.join(".");
                                    }
                                }

                                // Agregar atributos únicos si están disponibles
                                const uniqueAttributes = ["data-id", "data-key", "name"];
                                for (const attr of uniqueAttributes) {
                                    if (current.hasAttribute(attr)) {
                                        const attrValue = current.getAttribute(attr);
                                        if (attrValue && attrValue.trim()) {
                                            const attrSelector = `${selector}[${attr}="${CSS.escape(
                                                attrValue.trim()
                                            )}"]`;

                                            // Verificar si este atributo hace el selector único
                                            try {
                                                const testElements =
                                                    document.querySelectorAll(attrSelector);
                                                if (
                                                    testElements.length === 1 &&
                                                    testElements[0] === current
                                                ) {
                                                    return attrSelector; // Retornar directamente si es único
                                                }
                                            } catch (error) {
                                                // Continuar si hay error
                                            }

                                            selector += `[${attr}="${CSS.escape(attrValue.trim())}"]`;
                                            break;
                                        }
                                    }
                                }

                                // Usar nth-child solo cuando sea necesario
                                const parent = current.parentElement;
                                if (parent && parent !== entryContent) {
                                    const siblings = Array.from(parent.children).filter(
                                        (child) =>
                                            child.tagName === current.tagName &&
                                            child.nodeType === Node.ELEMENT_NODE
                                    );

                                    if (siblings.length > 1) {
                                        const index = siblings.indexOf(current) + 1;
                                        if (index > 0) {
                                            // Verificar que encontramos el elemento
                                            selector += `:nth-child(${index})`;
                                        }
                                    }
                                }

                                path.unshift(selector);
                                current = current.parentElement;

                                // Prevenir bucles infinitos
                                if (path.length > 50) {
                                    console.warn(
                                        "Selector path too long, breaking to prevent infinite loop"
                                    );
                                    break;
                                }
                            }

                            // Si llegamos aquí, construir el selector final con el container
                            const finalSelector = ".entry-content > " + path.join(" > ");

                            // Validar que el selector funciona antes de devolverlo
                            try {
                                const testElement = document.querySelector(finalSelector);
                                if (testElement === element) {
                                    return finalSelector;
                                } else {
                                    // Si el selector no funciona, intentar con un enfoque más específico
                                    return null;
                                }
                            } catch (error) {
                                console.warn("Generated selector is invalid:", finalSelector, error);
                                return null;
                            }

                        // Enable element selection mode restricted to entry-content
                        const selectElement = () => {
                            return new Promise((resolve) => {
                                globalElementSelectionState.isSelecting = true;
                                setIsElementSelectionActive(true);
                                const originalCursor = entryContent.style.cursor;
                                entryContent.style.cursor = "crosshair";

                                // Disable pointer events on all iframes to prevent them from blocking clicks
                                const iframes = entryContent.querySelectorAll("iframe");
                                const originalIframeStyles = [];
                                iframes.forEach((iframe, index) => {
                                    originalIframeStyles[index] = iframe.style.pointerEvents || "";
                                    iframe.style.pointerEvents = "none";
                                });

                                // Create overlay to show selection feedback
                                const overlay = document.createElement("div");
                                overlay.style.cssText = `

                                    pointer-events: none;
                                    border: 2px solid #007ACC;
                                    background: rgba(0, 122, 204, 0.1);

                                    transition: all 0.1s ease;
                                    display: none;

                                        entryContent.contains(element) &&
                                        element !== entryContent

                                        overlay.style.height = rect.height + "px";
                                        overlay.style.display = "block";

                                    }
                                };

                                    if (!globalElementSelectionState.isSelecting) return;
                                    const element = document.elementFromPoint(e.clientX, e.clientY);
                                    updateOverlay(element);

                                    // Only allow selection within entry-content
                                    if (!entryContent.contains(e.target) || e.target === entryContent) {

                                    resolve(e.target);

                                        resolve(null);
                                    }

                                    }

                                };

                                // Add visual indicator to entry-content
                                const originalBorder = entryContent.style.border;
                                entryContent.style.border = "2px dashed #007ACC";

                                // Store cleanup function globally
                                globalElementSelectionState.cleanup = cleanup;

                                document.addEventListener("mousemove", handleMouseMove, true);
                                document.addEventListener("click", handleClick, true);
                                document.addEventListener("keydown", handleEscape);

                                await navigator.clipboard.writeText(fullSelector);
                                return Promise.resolve();
                            }

                        return Promise.reject("No element selected");

                                                    onClick=${(e) => {

                                                                    const cells =

                                                                        if (

                                                                            cellCol <= cols

                                                                            cell.classList.add("active");
                                                                        } else {
                                                                            cell.classList.remove(

            function checkForConfigurableBlock(position) {
                const editor = window.currentEditor;
                if (!editor) return;
                
                const model = editor.getModel();
                const lineContent = model.getLineContent(position.lineNumber).trim();
                
                // Detectar tipo de bloque
                let blockType = null;
                
                // Usar expresiones regulares para mejor detección
                const gridMatch = lineContent.match(/^:::grid/);
                const noteMatch = lineContent.match(/^:::note/);
                const warningMatch = lineContent.match(/^:::warning/);
                const detailsMatch = lineContent.match(/^:::details/);
                const iframeMatch = lineContent.match(/^:::iframe/);
                const floatMatch = lineContent.match(/^:::float-/);
                const animationMatch = lineContent.match(/^```animation/);
                const svgMatch = lineContent.match(/^```svg/);
                
                if (gridMatch) {
                    blockType = 'grid';
                } else if (noteMatch) {
                    blockType = 'note';
                } else if (warningMatch) {
                    blockType = 'warning';
                } else if (detailsMatch) {
                    blockType = 'details';
                } else if (iframeMatch) {
                    blockType = 'iframe';
                } else if (floatMatch) {
                    blockType = 'float';
                } else if (animationMatch) {
                    blockType = 'animation';
                } else if (svgMatch) {
                    blockType = 'svg';
                }
                
                if (blockType) {
                    currentBlockType = blockType;
                    currentLineNumber = position.lineNumber;
                    showConfigButton(blockType);
                } else {
                    // Limpiar estado completamente cuando no hay bloque configurable
                    currentBlockType = null;
                    currentLineNumber = null;
                    hideConfigButton();

                    if (assistant && !assistant.classList.contains('hidden')) {

            function generateConfigContent(config, currentLine) {

                // Store additional text to preserve it
                window.currentRemainingText = remainingText;
                
                // Initialize custom options from existing line

                    opt.includes('style=') || opt.includes('min-') || opt.includes('=')

                config.sections.forEach(section => {

                    html += `<div class="config-section-title">${section.title}</div>`;
                    
                    if (section.type === 'options') {
                        html += `<div class="config-options">`;
                        section.options.forEach(option => {

                            html += `<div class="config-option ${isActive ? 'active' : ''}" data-option="${option}">${option}</div>`;
                        });
                        html += `</div>`;
                    } else if (section.type === 'custom') {
                        // Check if we have inputs array (new format)
                        if (section.inputs && Array.isArray(section.inputs)) {

                            section.inputs.forEach(input => {

                                    html += `<input autocomplete="off" type="text" id="${input.id}" placeholder="${input.placeholder}"

                            html += `</div>`;
