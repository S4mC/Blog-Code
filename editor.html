<!DOCTYPE html>

        <script type="importmap">
            {
                "imports": {
                    "preact": "./cdn/preact/preact.mjs",
                    "preact/hooks": "./cdn/preact/hooks.mjs",
                    "htm/preact": "./cdn/preact/htm-preact.mjs"

    <body data-open-sidebar-resize="false">
        <div id="app"></div>

        <script type="module">
            import { render } from "preact";
            import { useState, useEffect, useRef } from "preact/hooks";
            import { html } from "htm/preact";
            import { Header } from "./components/Header.js";
            import { Sidebar, initSidebar } from "./components/Sidebar.js";
            import {
                renderMarkdown,
                showCopySuccess,
                manageEscapeIframe,
                manageClickFloatButton,
            } from "./components/markdownProcessor.js";

            // Configure Monaco Editor
            require.config({
                paths: {
                    vs: "./cdn/monaco/vs",
                },
            });

            // Configure the languages we want to load
            window.MonacoEnvironment = {
                getWorkerUrl: function (moduleId, label) {
                    return "./cdn/monaco/vs/base/worker/workerMain.js";
                },
                getLanguages: function () {
                    return ["markdown"];
                },
            };

            // Global variable to track element selection state
            let globalElementSelectionState = {
                isSelecting: false,
                cleanup: null,
            };

            // Handler for Escape key
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") {
                    manageEscapeIframe();
                }
            });

            document.addEventListener("click", function (e) {
                manageClickFloatButton(e);

                // For the main copy button
                if (e.target.closest(".copy-button")) {
                    const button = e.target.closest(".copy-button");
                    const originalHTML = button.innerHTML;

                    if (window.handleCopy) {
                        window
                            .handleCopy()
                            .then(() => {
                                showCopySuccess(button, originalHTML);
                            })
                            .catch((err) => {
                                console.error("Error copying:", err);
                            });
                    }
                }
            });

            // Contenido por defecto para un Nuevo documento
            const DEFAULT_MARKDOWN_CONTENT = `# New document

This is an example of a **blog entry** with *italic text*.

## Feature List

- Support for **bold** and *italic*
- Numbered and bullet lists
- \`inline code\`
- Links: [Example](https://example.com)

:::details-open Collapsible Element

content
:::

### SVG Container

\`\`\`svg style="height:15em;"
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M3 21q-.825 0-1.412-.587T1 19V5q0-.825.588-1.412T3 3h18q.825 0 1.413.588T23 5v14q0 .825-.587 1.413T21 21zm4-4h2V7H5v2h2zm4.5 0h2l1.75-3.175L17 17h2l-2.75-5L19 7h-2l-1.75 3.175L13.5 7h-2l2.75 5z"/></svg>

    console.log("Hello world!");

### Note Callout

Be careful with this action!

            function MarkdownEditor() {
                const handleNavigateToEntry = (entry) => {
                    window.location.href = `./post.html?path=${encodeURIComponent(entry.path)}`;
                };

                const [isContentModified, setIsContentModified] = useState(false);

                // Estado para manejar las pestañas
                // Función auxiliar para generar IDs numéricos secuenciales
                const getNextTabId = (existingTabs) => {
                    if (!existingTabs || existingTabs.length === 0) return 1;
                    // Buscamos el ID numérico más alto y le sumamos 1
                    const maxId = Math.max(...existingTabs.map((tab) => parseInt(tab.id)));
                    return isNaN(maxId) ? 1 : maxId + 1;
                };

                const [tabs, setTabs] = useState(() => {
                    const savedTabs = localStorage.getItem("editorTabs");
                    return savedTabs
                        ? JSON.parse(savedTabs)
                        : [
                              {
                                  id: 1, // ID inicial fijo
                                  title: "New document",
                                  content: DEFAULT_MARKDOWN_CONTENT,
                                  isModified: false,
                              },
                          ];
                });

                // ID de la pestaña activa
                const [activeTabId, setActiveTabId] = useState(() => {
                    const savedActiveTabId = localStorage.getItem("editorActiveTabId");
                    return parseInt(savedActiveTabId) || (tabs.length > 0 ? parseInt(tabs[0].id) : null);
                });

                window.activeTabId = activeTabId;

                // Intentar recuperar configuración guardada de localStorage
                const savedShowPreview = localStorage.getItem("editorShowPreview");
                const savedPreviewPosition = localStorage.getItem("editorPreviewPosition");

                // Estado para el contenido y la vista previa
                const [markdown, setMarkdown] = useState(() => {
                    const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                    return activeTab?.content || DEFAULT_MARKDOWN_CONTENT;
                });

                const [preview, setPreview] = useState("");
                const [showPreview, setShowPreview] = useState(
                    savedShowPreview === "true" ? true : false
                );
                const [previewPosition, setPreviewPosition] = useState(
                    savedPreviewPosition === "bottom" ? "bottom" : "right"
                );

                // State to track element selection mode
                const [isElementSelectionActive, setIsElementSelectionActive] = useState(false);

                const [wordWrap, setWordWrap] = useState(
                    localStorage.getItem("editorWordWrap") === "off" ? "off" : "on"
                ); // 'on' por defecto
                const editorRef = useRef(null);
                const containerRef = useRef(null);

                useEffect(() => {
                    updateTabContent(window.activeTabId, markdown);
                    if (showPreview) {
                        let [finalHtml, sidebarContent, finalJS] = renderMarkdown(markdown);
                        setPreview(finalHtml);
                        setTimeout(() => {
                            // Usar la función initSidebar que maneja de forma segura la inicialización/actualización
                            initSidebar(sidebarContent);
                            eval(finalJS);
                        }, 100);
                    }
                }, [showPreview, markdown]);

                useEffect(() => {
                    if (showPreview) {
                        setTimeout(() => {
                            if (window.Prism) {
                                window.Prism.highlightAll();
                            }
                        }, 100);
                    }
                }, [showPreview, preview]);

                // Efecto para controlar la alerta al cerrar o navegar fuera de la página
                useEffect(() => {
                    const handleBeforeUnload = (e) => {
                        if (isContentModified) {
                            // Intentar guardar una última vez en localStorage
                            try {
                                if (editorRef.current && window.activeTabId) {
                                    const content = editorRef.current.getValue();

                                    // Actualizar la pestaña activa con el contenido actual
                                    updateTabContent(window.activeTabId, content);

                                    // Guardar todas las pestañas en localStorage
                                    localStorage.setItem("editorTabs", JSON.stringify(tabs));
                                    // Si se guarda correctamente, no mostramos alerta
                                    return;
                                }
                            } catch (error) {
                                // Si falla el guardado, mostramos la alerta
                                e.preventDefault();
                                e.returnValue =
                                    "No se pudieron guardar los cambios automáticamente. ¿Seguro que quieres salir?";
                                return e.returnValue;
                            }
                        }
                    };

                    window.addEventListener("beforeunload", handleBeforeUnload);

                    return () => {
                        window.removeEventListener("beforeunload", handleBeforeUnload);
                    };
                }, [isContentModified]);

                useEffect(() => {
                    if (!editorRef.current) {
                        // La configuración ya está hecha arriba

                        require(["vs/editor/editor.main"], () => {
                            // Asegurar que cargamos el contenido correcto para la pestaña activa

                            editorRef.current = monaco.editor.create(containerRef.current, {
                                value: markdown,
                                language: "markdown",
                                theme: "vs-dark",
                                minimap: { enabled: true },
                                fontSize: 16,
                                lineNumbers: "on",
                                roundedSelection: false,
                                scrollBeyondLastLine: false,
                                wordWrap: wordWrap, // Usar el estado wordWrap
                                acceptSuggestionOnEnter: "off",
                                automaticLayout: true,
                                smoothScrolling: true,
                            });

                            // Añadir el manejador para teclas
                            editorRef.current.addAction({
                                id: "extend-list",
                                label: "Extend List",
                                keybindings: [monaco.KeyCode.Enter],
                                precondition: null,
                                keybindingContext: null,
                                contextMenuGroupId: "navigation",
                                contextMenuOrder: 1.5,
                                // Método que se ejecutará
                                run: function (ed) {
                                    const editor = editorRef.current;
                                    const selection = editor.getSelection();
                                    const position = {
                                        lineNumber: selection.startLineNumber,
                                        column: selection.startColumn,
                                    };
                                    const model = editor.getModel();
                                    const lineContent = model.getLineContent(position.lineNumber);

                                    // Verificar si se presionó Shift+Enter
                                    const shiftKey =
                                        ed._standaloneKeybindingService._currentChord?.[0]?.shiftKey;

                                    // Expresión regular para detectar líneas numeradas (ej: "1. ", "12. ")
                                    const numberedListRegex = /^(\d+)\.(\s+)(.*)$/;
                                    // Expresión regular para detectar listas con viñetas (ej: "- ")
                                    const bulletListRegex = /^(-|\*)(\s+)(.*)$/;

                                    const numberedMatch = lineContent.match(numberedListRegex);
                                    const bulletMatch = lineContent.match(bulletListRegex);

                                    // Si se está presionando Shift, simplemente insertar un salto de línea sin continuar la lista
                                    if (shiftKey) {
                                        editor.trigger("keyboard", "type", { text: "\n" });
                                        return true;
                                    }

                                    if (numberedMatch) {
                                        // Si la línea actual está vacía después del número (ej: "1. "), terminar la lista
                                        if (numberedMatch[3].trim() === "") {
                                            // Eliminar la línea actual y añadir una línea en blanco
                                            const range = {
                                                startLineNumber: position.lineNumber,
                                                startColumn: 1,
                                                endLineNumber: position.lineNumber,
                                                endColumn: lineContent.length + 1,
                                            };
                                            editor.executeEdits("", [
                                                {
                                                    range: range,
                                                    text: "",
                                                },
                                            ]);
                                            return true; // Prevenir el comportamiento por defecto
                                        }

                                        const currentNumber = parseInt(numberedMatch[1], 10);
                                        const nextNumber = currentNumber + 1;
                                        const spacing = numberedMatch[2]; // Conservar el mismo espaciado

                                        // Insertar una nueva línea con el siguiente número
                                        const text = "\n" + nextNumber + "." + spacing;
                                        editor.executeEdits("", [
                                            {
                                                range: {
                                                    startLineNumber: position.lineNumber,
                                                    startColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                    endLineNumber: position.lineNumber,
                                                    endColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                },
                                                text: text,
                                            },
                                        ]);

                                        // Mover el cursor a la nueva línea después del número
                                        editor.setPosition({
                                            lineNumber: position.lineNumber + 1,
                                            column: (nextNumber + ".").length + spacing.length + 1,
                                        });

                                        return true; // Completado
                                    }

                                    if (bulletMatch) {
                                        // Si la línea actual está vacía después de la viñeta (ej: "- "), terminar la lista
                                        if (bulletMatch[3].trim() === "") {
                                            // Eliminar la línea actual y añadir una línea en blanco
                                            const range = {
                                                startLineNumber: position.lineNumber,
                                                startColumn: 1,
                                                endLineNumber: position.lineNumber,
                                                endColumn: lineContent.length + 1,
                                            };
                                            editor.executeEdits("", [
                                                {
                                                    range: range,
                                                    text: "",
                                                },
                                            ]);
                                            return true; // Prevenir el comportamiento por defecto
                                        }

                                        const bulletChar = bulletMatch[1]; // "-" o "*"
                                        const spacing = bulletMatch[2]; // Conservar el mismo espaciado

                                        // Insertar una nueva línea con la misma viñeta
                                        const text = "\n" + bulletChar + spacing;
                                        editor.executeEdits("", [
                                            {
                                                range: {
                                                    startLineNumber: position.lineNumber,
                                                    startColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                    endLineNumber: position.lineNumber,
                                                    endColumn: model.getLineMaxColumn(
                                                        position.lineNumber
                                                    ),
                                                },
                                                text: text,
                                            },
                                        ]);

                                        // Mover el cursor a la nueva línea después de la viñeta
                                        editor.setPosition({
                                            lineNumber: position.lineNumber + 1,
                                            column: bulletChar.length + spacing.length + 1,
                                        });

                                        return true; // Completado
                                    }

                                    // Si no es ningún tipo de lista, usar el comportamiento predeterminado de Enter
                                    editor.trigger("keyboard", "type", { text: "\n" });
                                    return true;
                                },
                            });

                            editorRef.current.onDidChangeModelContent(() => {
                                const content = editorRef.current.getValue();
                                setMarkdown(content);
                                setIsContentModified(true);
                            });
                        });
                    }
                }, []);

                // Efecto para guardar las pestañas en localStorage cuando cambian
                useEffect(() => {
                    try {
                        localStorage.setItem("editorTabs", JSON.stringify(tabs));
                    } catch (e) {
                        console.warn("Error al guardar las pestañas en localStorage:", e);
                    }
                }, [tabs]);

                // Efecto para actualizar el editor cuando cambia la pestaña activa
                useEffect(() => {
                    if (!editorRef.current || activeTabId === null) return;

                    window.activeTabId = activeTabId;
                    // Evitar actualizaciones en cascada

                    const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                    if (activeTab && editorRef.current.getModel()) {
                        const currentContent = editorRef.current.getValue();

                        if (currentContent !== activeTab.content) {
                            editorRef.current.setValue(activeTab.content || "");
                            setMarkdown(activeTab.content || "");
                            setIsContentModified(!!activeTab.isModified);
                        }
                    }

                    localStorage.setItem("editorActiveTabId", activeTabId?.toString());
                }, [activeTabId]);

                // Función para extraer el título del contenido markdown
                const extractTitleFromMarkdown = (content) => {
                    const titleMatch = content.match(/^#\s+(.+)$/m);
                    return titleMatch ? titleMatch[1].trim() : "Sin título";
                };

                // Función para crear una nueva pestaña
                const createNewTab = () => {
                    // Guardar contenido actual antes de crear una nueva pestaña
                    if (editorRef.current && activeTabId) {
                        updateTabContent(activeTabId, editorRef.current.getValue());
                    }

                    const newTabNumber = tabs.length + 1;
                    const newTabId = getNextTabId(tabs);

                    // Crear contenido con título único
                    let newContent = DEFAULT_MARKDOWN_CONTENT;
                    if (newTabNumber > 1) {
                        newContent = newContent.replace("# New document", `# Document ${newTabNumber}`);
                    }

                    const newTab = {
                        id: newTabId,
                        title: newTabNumber === 1 ? "New document" : `Document ${newTabNumber}`,
                        content: newContent,
                        isModified: false,
                    };

                    // Actualizar estado
                    setTabs([...tabs, newTab]);
                    setActiveTabId(newTabId);
                };

                // Función para cambiar a una pestaña
                const switchToTab = (tabId) => {
                    const numericTabId = parseInt(tabId);
                    const numericActiveTabId = parseInt(activeTabId);

                    if (numericActiveTabId === numericTabId) return;

                    // Guardar contenido actual antes de cambiar
                    if (editorRef.current && activeTabId !== null) {
                        const currentContent = editorRef.current.getValue();
                        updateTabContent(numericActiveTabId, currentContent);
                    }

                    // Cambiar a la nueva pestaña
                    const targetTab = tabs.find((tab) => parseInt(tab.id) === numericTabId);
                    if (!targetTab) return;

                    setActiveTabId(numericTabId);
                };

                // Función para actualizar el contenido de una pestaña
                const updateTabContent = (tabId, newContent) => {
                    const numericTabId = parseInt(tabId);

                    setTabs((prevTabs) =>
                        prevTabs.map((tab) => {
                            if (parseInt(tab.id) !== numericTabId) return tab;

                            // Solo actualiza si realmente cambió el contenido
                            if (tab.content === newContent) {
                                return tab; // sin cambios
                            }

                            const tabTitle = extractTitleFromMarkdown(newContent);

                            return {
                                ...tab,
                                content: newContent,
                                title: tabTitle,
                                isModified: true,
                            };
                        })
                    );
                };

                // Función para cerrar una pestaña
                const closeTab = (tabId, event) => {
                    if (event) event.stopPropagation();

                    const numericTabId = parseInt(tabId);
                    const numericActiveTabId = parseInt(activeTabId);
                    const tabToClose = tabs.find((tab) => parseInt(tab.id) === numericTabId);

                    // Confirmar cierre si hay cambios
                    if (tabToClose?.isModified) {
                        const confirmClose = window.confirm(
                            `¿Estás seguro que deseas cerrar "${tabToClose.title}"? Los cambios no guardados se perderán.`
                        );
                        if (!confirmClose) return;
                    }

                    // Manejar caso especial: última pestaña
                    if (tabs.length === 1) {
                        const newTabId = getNextTabId(tabs);
                        setTabs([
                            {
                                id: newTabId,
                                title: "New document",
                                content: DEFAULT_MARKDOWN_CONTENT,
                                isModified: false,
                            },
                        ]);
                        setActiveTabId(newTabId);
                        return;
                    }

                    // Si cerramos la pestaña activa, seleccionar otra
                    if (numericActiveTabId === numericTabId) {
                        const tabIndex = tabs.findIndex((tab) => parseInt(tab.id) === numericTabId);
                        const newActiveTab = tabs[tabIndex === 0 ? 1 : tabIndex - 1];
                        setActiveTabId(parseInt(newActiveTab.id));
                    }

                    // Eliminar la pestaña
                    setTabs((prevTabs) => prevTabs.filter((tab) => parseInt(tab.id) !== numericTabId));
                };

                const insertText = (beforeText, afterText = "", insertAtStart = false) => {
                    if (!editorRef.current) return;

                    const editor = editorRef.current;
                    const selection = editor.getSelection();
                    const selectedText = editor.getModel().getValueInRange(selection);

                    // If no text is selected and insertAtStart is true
                    if (selection.isEmpty() && insertAtStart) {
                        const lineNumber = selection.startLineNumber;
                        const lineContent = editor.getModel().getLineContent(lineNumber);

                        // Detect if there's already a header at the beginning
                        const headerRegex = /^(#{1,6}\s|#t\s)/;
                        const match = lineContent.match(headerRegex);

                        const lineStart = {
                            startLineNumber: lineNumber,
                            startColumn: 1,
                            endLineNumber: lineNumber,
                            endColumn: lineContent.length + 1,
                        };

                        let newText;
                        if (match) {
                            // If there's already a header, replace it
                            newText = beforeText + lineContent.substring(match[0].length) + afterText;
                        } else {
                            // If there's no header, add a new one
                            newText = beforeText + lineContent + afterText;
                        }

                        // Edit at the beginning of the line
                        editor.executeEdits("", [
                            {
                                range: lineStart,
                                text: newText,
                            },
                        ]);
                    } else {
                        // Normal behavior when text is selected
                        const newText = beforeText + selectedText + afterText;

                        // Realiza la edición
                        editor.executeEdits("", [
                            {
                                range: selection,
                                text: newText,
                            },
                        ]);
                    }
                    // Calculate where the cursor will be: right after beforeText + selectedText
                    let lines = (beforeText + selectedText).split("\n");
                    let newLineNumber = selection.startLineNumber + (lines.length - 1);
                    let newColumn;

                    if (lines.length === 1) {
                        // Everything on the same line
                        newColumn = selection.startColumn + lines[0].length;
                    } else {
                        // Last line of the block
                        newColumn = lines[lines.length - 1].length + 1;
                    }

                    // Posiciona el cursor
                    editor.setSelection({
                        startLineNumber: newLineNumber,
                        startColumn: newColumn,
                        endLineNumber: newLineNumber,
                        endColumn: newColumn,
                    });

                    // Center the cursor line on the screen with smooth animation
                    // Center the cursor line on the screen
                    editor.revealLineInCenter(newLineNumber, monaco.editor.ScrollType.Smooth);

                    editor.focus();
                };

                const handleSave = () => {
                    const activeTab = tabs.find((tab) => parseInt(tab.id) === parseInt(activeTabId));
                    const fileName = activeTab
                        ? `${activeTab.title.replace(/[\\/:*?"<>|]/g, "_")}.md`
                        : "post.md";

                    const blob = new Blob([markdown], {
                        type: "text/markdown",
                    });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    // Actualizar pestaña y marcar como guardado
                    try {
                        // Marcar la pestaña como no modificada
                        if (activeTabId) {
                            setTabs((prevTabs) =>
                                prevTabs.map((tab) =>
                                    parseInt(tab.id) === parseInt(activeTabId)
                                        ? { ...tab, isModified: false, content: markdown }
                                        : tab
                                )
                            );
                        }

                        setIsContentModified(false); // Marcamos el contenido como guardado
                    } catch (e) {
                        console.warn("No se pudo guardar en localStorage:", e);
                        // Aún así marcamos como guardado porque se guardó como archivo
                        setIsContentModified(false);
                    }
                };

                const handleCopy = async () => {
                    try {
                        await navigator.clipboard.writeText(markdown);
                        return Promise.resolve();
                    } catch (err) {
                        console.error("Error copying to clipboard:", err);
                        return Promise.reject(err);
                    }
                };

                // Make the handleCopy function globally accessible
                window.handleCopy = handleCopy;

                const copyElementSelector = async () => {
                    try {
                        // Check if already in selection mode
                        if (globalElementSelectionState.isSelecting) {
                            // Exit selection mode
                            if (globalElementSelectionState.cleanup) {
                                globalElementSelectionState.cleanup();
                            }
                            setIsElementSelectionActive(false);
                            return Promise.reject("Element selection cancelled");
                        }

                        // Check if entry-content area exists
                        const entryContent = document.querySelector(".entry-content");
                        if (!entryContent) {
                            throw new Error("Preview area (.entry-content) not found");
                        }

                        // Function to generate a unique selector for an element within entry-content
                        const generateSelector = (element) => {
                            // Validaciones iniciales más robustas
                            if (
                                !element ||
                                !element.nodeType ||
                                element.nodeType !== Node.ELEMENT_NODE ||
                                element === document ||
                                element === document.body ||
                                element === document.documentElement
                            ) {
                                return null;
                            }

                            // Verificar que entryContent existe y contiene el elemento
                            if (!entryContent || !entryContent.contains(element)) {
                                return null;
                            }

                            let path = [];
                            let current = element;

                            while (
                                current &&
                                current !== entryContent &&
                                current !== document &&
                                current !== document.body
                            ) {
                                let selector = current.tagName.toLowerCase();

                                // Priorizar ID únicos
                                if (current.id && current.id.trim()) {
                                    const id = current.id.trim();
                                    // Verificar que el ID sea único en el documento
                                    if (document.querySelectorAll(`#${CSS.escape(id)}`).length === 1) {
                                        selector = `#${CSS.escape(id)}`;

                                        // Validar que el selector con ID funciona directamente
                                        try {
                                            const testElement = document.querySelector(selector);
                                            if (testElement === current) {
                                                return selector; // Retornar directamente el ID único
                                            }
                                        } catch (error) {
                                            console.warn("ID selector is invalid:", selector, error);
                                        }
                                    }
                                }

                                // Agregar clases válidas
                                if (current.className && typeof current.className === "string") {
                                    const classes = current.className
                                        .trim()
                                        .split(/\s+/)
                                        .filter((cls) => cls && /^[a-zA-Z_-][a-zA-Z0-9_-]*$/.test(cls)) // Solo clases válidas
                                        .map((cls) => CSS.escape(cls));

                                    if (classes.length > 0) {
                                        selector += "." + classes.join(".");
                                    }
                                }

                                // Agregar atributos únicos si están disponibles
                                const uniqueAttributes = ["data-id", "data-key", "name"];
                                for (const attr of uniqueAttributes) {
                                    if (current.hasAttribute(attr)) {
                                        const attrValue = current.getAttribute(attr);
                                        if (attrValue && attrValue.trim()) {
                                            const attrSelector = `${selector}[${attr}="${CSS.escape(
                                                attrValue.trim()
                                            )}"]`;

                                            // Verificar si este atributo hace el selector único
                                            try {
                                                const testElements =
                                                    document.querySelectorAll(attrSelector);
                                                if (
                                                    testElements.length === 1 &&
                                                    testElements[0] === current
                                                ) {
                                                    return attrSelector; // Retornar directamente si es único
                                                }
                                            } catch (error) {
                                                // Continuar si hay error
                                            }

                                            selector += `[${attr}="${CSS.escape(attrValue.trim())}"]`;
                                            break;
                                        }
                                    }
                                }

                                // Usar nth-child solo cuando sea necesario
                                const parent = current.parentElement;
                                if (parent && parent !== entryContent) {
                                    const siblings = Array.from(parent.children).filter(
                                        (child) =>
                                            child.tagName === current.tagName &&
                                            child.nodeType === Node.ELEMENT_NODE
                                    );

                                    if (siblings.length > 1) {
                                        const index = siblings.indexOf(current) + 1;
                                        if (index > 0) {
                                            // Verificar que encontramos el elemento
                                            selector += `:nth-child(${index})`;
                                        }
                                    }
                                }

                                path.unshift(selector);
                                current = current.parentElement;

                                // Prevenir bucles infinitos
                                if (path.length > 50) {
                                    console.warn(
                                        "Selector path too long, breaking to prevent infinite loop"
                                    );
                                    break;
                                }
                            }

                            // Si llegamos aquí, construir el selector final con el container
                            const finalSelector = ".entry-content > " + path.join(" > ");

                            // Validar que el selector funciona antes de devolverlo
                            try {
                                const testElement = document.querySelector(finalSelector);
                                if (testElement === element) {
                                    return finalSelector;
                                } else {
                                    // Si el selector no funciona, intentar con un enfoque más específico
                                    return null;
                                }
                            } catch (error) {
                                console.warn("Generated selector is invalid:", finalSelector, error);
                                return null;
                            }
                        };

                        // Enable element selection mode restricted to entry-content
                        const selectElement = () => {
                            return new Promise((resolve) => {
                                globalElementSelectionState.isSelecting = true;
                                setIsElementSelectionActive(true);
                                const originalCursor = entryContent.style.cursor;
                                entryContent.style.cursor = "crosshair";

                                // Disable pointer events on all iframes to prevent them from blocking clicks
                                const iframes = entryContent.querySelectorAll("iframe");
                                const originalIframeStyles = [];
                                iframes.forEach((iframe, index) => {
                                    originalIframeStyles[index] = iframe.style.pointerEvents || "";
                                    iframe.style.pointerEvents = "none";
                                });

                                // Create overlay to show selection feedback
                                const overlay = document.createElement("div");
                                overlay.style.cssText = `
                                    position: fixed;
                                    pointer-events: none;
                                    border: 2px solid #007ACC;
                                    background: rgba(0, 122, 204, 0.1);
                                    z-index: 10000;
                                    transition: all 0.1s ease;
                                    display: none;

                                document.body.appendChild(overlay);

                                const updateOverlay = (element) => {

                                        element &&
                                        entryContent.contains(element) &&

                                        overlay.style.height = rect.height + "px";
                                        overlay.style.display = "block";
                                    } else {
                                        overlay.style.display = "none";
                                    }
                                };

                                const handleMouseMove = (e) => {
                                    if (!globalElementSelectionState.isSelecting) return;
                                    const element = document.elementFromPoint(e.clientX, e.clientY);
                                    updateOverlay(element);
                                };

                                const handleClick = (e) => {
                                    if (!globalElementSelectionState.isSelecting) return;

                                    // Only allow selection within entry-content
                                    if (!entryContent.contains(e.target) || e.target === entryContent) {
                                        return;
                                    }

                                    e.preventDefault();
                                    e.stopPropagation();

                                    cleanup();
                                    resolve(e.target);
                                };

                                const handleEscape = (e) => {
                                    if (e.key === "Escape" && globalElementSelectionState.isSelecting) {
                                        cleanup();
                                        resolve(null);
                                    }
                                };

                                const cleanup = () => {
                                    if (!globalElementSelectionState.isSelecting) return;

                                    globalElementSelectionState.isSelecting = false;
                                    setIsElementSelectionActive(false);
                                    globalElementSelectionState.cleanup = null;

                                    entryContent.style.cursor = originalCursor;

                                    // Restore iframe pointer events

                                        iframe.style.pointerEvents = originalIframeStyles[index];
                                    });

                                    document.removeEventListener("mousemove", handleMouseMove, true);
                                    document.removeEventListener("click", handleClick, true);
                                    document.removeEventListener("keydown", handleEscape);

                                    if (overlay.parentNode) {

                                };

                                // Add visual indicator to entry-content

                                entryContent.style.border = "2px dashed #007ACC";

                                // Store cleanup function globally
                                globalElementSelectionState.cleanup = cleanup;

                                // Use capture phase to ensure we get events before iframes
                                document.addEventListener("mousemove", handleMouseMove, true);
                                document.addEventListener("click", handleClick, true);

                        const floatPattern = new RegExp(`:::float-\\s*${id}\\s*$`, "mi");

                // Function to generate markdown tables
                const generateTable = (rows, columns) => {

                                                    d="M7 9V7h14v2zm0 4v-2h14v2zm0 4v-2h14v2zM4 9q-.425 0-.712-.288T3 8t.288-.712T4 7t.713.288T5 8t-.288.713T4 9m0 4q-.425 0-.712-.288T3 12t.288-.712T4 11t.713.288T5 12t-.288.713T4 13m0 4q-.425 0-.712-.288T3 16t.288-.712T4 15t.713.288T5 16t-.288.713T4 17"
                                                ></path>
                                            </svg>
                                            <div class="menu-content" style="display: none;">
                                                <button
                                                    style="display: flex; align-items: center; width: 100%; text-align: left; padding: 8px 12px; border: none; background: none; cursor: pointer; color: var(--text-color); font-size: 14px;"
                                                    onClick=${(e) => {
                                                        // Primero verificar si estamos en una línea de lista
                                                        if (!editorRef.current) return;

                                                        const editor = editorRef.current;
                                                        const selection = editor.getSelection();
                                                        const model = editor.getModel();

                                                        // Verificar si hay selección de múltiples líneas
                                                        const isMultiLine =
                                                            selection.startLineNumber !==
                                                            selection.endLineNumber;

                                                        if (isMultiLine) {
                                                            // Aplicar a todas las líneas seleccionadas
                                                            const edits = [];

                                                            for (
                                                                let i = selection.startLineNumber;
                                                                i <= selection.endLineNumber;
                                                                i++
                                                            ) {
                                                                const lineContent =
                                                                    model.getLineContent(i);

                                                                // Detectar si ya es una lista numerada o con viñetas
                                                                const numberedListRegex =
                                                                    /^(\d+)\.(\s+)(.*)$/;
                                                                const bulletListRegex =
                                                                    /^(-|\*|\+)(\s+)(.*)$/;

                                                                const numberedMatch =
                                                                    lineContent.match(numberedListRegex);
                                                                const bulletMatch =
                                                                    lineContent.match(bulletListRegex);

                                                                if (numberedMatch) {
                                                                    // Convertir de lista numerada a lista con viñetas
                                                                    edits.push({
                                                                        range: {
                                                                            startLineNumber: i,
                                                                            startColumn: 1,
                                                                            endLineNumber: i,
                                                                            endColumn:
                                                                                numberedMatch[0].length +
                                                                                1,
                                                                        },

                                                                    });
                                                                } else if (bulletMatch) {
                                                                    // Ya es una lista con viñetas, asegurarse de que sea "-"
                                                                    if (bulletMatch[1] !== "-") {
                                                                        edits.push({
                                                                            range: {
                                                                                startLineNumber: i,
                                                                                startColumn: 1,
                                                                                endLineNumber: i,
                                                                                endColumn:
                                                                                    bulletMatch[0]
                                                                                        .length + 1,
                                                                            },
                                                                            text: "- " + bulletMatch[3],
                                                                        });
                                                                    }
                                                                } else if (lineContent.trim() !== "") {
                                                                    // No es ningún tipo de lista y la línea no está vacía
                                                                    edits.push({
                                                                        range: {
                                                                            startLineNumber: i,
                                                                            startColumn: 1,
                                                                            endLineNumber: i,
                                                                            endColumn: 1,
                                                                        },
                                                                        text: "- ",
                                                                    });
                                                                }
                                                            }

                                                            }
                                                        } else {
                                                            // Aplicar solo a la línea actual (comportamiento original)
                                                            const lineNumber = selection.startLineNumber;
                                                            const lineContent =
                                                                model.getLineContent(lineNumber);

                                                            // Detectar si ya es una lista numerada
                                                            const numberedListRegex =
                                                                /^(\d+)\.(\s+)(.*)$/;
                                                            const bulletListRegex =
                                                                /^(-|\*|\+)(\s+)(.*)$/;

                                                            const numberedMatch =

                                                    <path
                                                        stroke-linecap="round"
                                                        d="M12 15.52v-.01m-1.998-5.533C10.157 9.019 11 8.5 12 8.5s1.686.672 1.87 1.207c.183.535.144 1.344-.363 1.809s-.773.316-1.229.8a1.8 1.8 0 0 0-.278.432"
                                                    ></path>
