                // Function to delete selected files
                window.deleteSelectedFiles = async () => {
                    // Use window.selectedFiles instead of checking DOM
                    const filesToDelete = Array.from(window.selectedFiles);
                    
                    if (filesToDelete.length === 0) {
                        alert("Please select at least one file to delete");
                        return;
                    }
                    
                    // Confirm deletion
                    const titles = Array.from(filesToDelete).map((path) => {
                        const match = allFiles.find(file => file.path === path);
                        return match ? match.title : "(Sin título)";
                    }).join("\n- ");

                    if (!confirm(`Are you sure you want to delete ${filesToDelete.length} file(s) from GitHub?\n\n- ${titles}\n\nThis action cannot be undone!`)) {
                        return;
                    }
                    
                    const apiKey = document.getElementById("github-api-key")?.value.trim();
                    
                    if (!apiKey) {
                        alert("❌ Please enter your GitHub API key first");
                        return;
                    }
                    
                    // Show loading state
                    const deleteBtn = document.getElementById("delete-selected-btn");
                    deleteBtn.disabled = true;
                    deleteBtn.innerHTML = "⏳ Deleting...";
                    
                    const results = {
                        deleted: [],
                        failed: [],
                        notFound: []
                    };
                    
                    // Extract repository info
                    const contentUrl = CONFIG.contentUrl;
                    const githubMatch = contentUrl.match(/https?:\/\/([^.]+)\.github\.io\/([^\/]+)(?:\/(.*))?/);
                    
                    if (!githubMatch) {
                        alert("❌ Could not extract repository info from contentUrl");
                        deleteBtn.disabled = false;
                        deleteBtn.innerHTML = `🗑️ Delete Selected (<span id="delete-count">${filesToDelete.length}</span>)`;
                        return;
                    }
                    
                    const repoOwner = githubMatch[1];
                    const repoName = githubMatch[2];
                    const basePath = githubMatch[3] || "";
                    
                    // Delete each file
                    for (const filePath of filesToDelete) {
                        try {
                            // Convert full URL path to repository path
                            // Handle paths that may include folders
                            let pathInRepo = filePath.replace(contentUrl, "").replace(/^\/+/, "");
                            if (basePath) {
                                pathInRepo = basePath + "/" + pathInRepo;
                            }
                            
                            const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${pathInRepo}`;
                            
                            // Try to get file SHA
                            const getResponse = await fetch(apiUrl, {
                                headers: {
                                    "Authorization": `token ${apiKey}`,
                                    "Accept": "application/vnd.github.v3+json",
                                },
                            });
                            
                            if (getResponse.status === 404) {
                                // File doesn't exist, just mark for search.json removal
                                results.notFound.push(filePath);
                                continue;
                            }
                            
                            if (!getResponse.ok) {
                                throw new Error(`Failed to get file info: ${getResponse.statusText}`);
                            }
                            
                            const fileData = await getResponse.json();
                            
                            // Delete file
                            const deleteResponse = await fetch(apiUrl, {
                                method: "DELETE",
                                headers: {
                                    "Authorization": `token ${apiKey}`,
                                    "Accept": "application/vnd.github.v3+json",
                                    "Content-Type": "application/json",
                                },
                                body: JSON.stringify({
                                    message: `Delete ${filePath.split("/").pop()} from Blog Editor`,
                                    sha: fileData.sha,
                                }),
                            });
                            
                            if (!deleteResponse.ok) {
                                const errorData = await deleteResponse.json();
                                throw new Error(errorData.message || `Failed to delete file: ${deleteResponse.statusText}`);
                            }
                            
                            results.deleted.push(filePath);
                            
                        } catch (error) {
                            console.error(`Error deleting ${filePath}:`, error);
                            results.failed.push({ path: filePath, error: error.message });
                        }
                    }
                    
                    // Update search.json to remove deleted entries
                    try {
                        const searchJsonPath = basePath ? `${basePath}/search.json` : "search.json";
                        const searchJsonUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${searchJsonPath}`;
                        
                        const searchResponse = await fetch(searchJsonUrl, {
                            headers: {
                                "Authorization": `token ${apiKey}`,
                                "Accept": "application/vnd.github.v3+json",
                            },
                        });
                        
                        if (searchResponse.ok) {
                            const searchData = await searchResponse.json();
                            const searchContent = JSON.parse(atob(searchData.content));
                            
                            // Filter out deleted entries
                            // Compare by resolving paths from search.json entries
                            const allDeletedPaths = [...results.deleted, ...results.notFound];
                            searchContent.entries = searchContent.entries.filter(entry => {
                                const entryFullPath = entry.path.startsWith("http") 
                                    ? entry.path 
                                    : resolveContentPath(entry.path);
                                return !allDeletedPaths.includes(entryFullPath);
                            });
                            
                            // Update search.json
                            const updateResponse = await fetch(searchJsonUrl, {
                                method: "PUT",
                                headers: {
                                    "Authorization": `token ${apiKey}`,
                                    "Accept": "application/vnd.github.v3+json",
                                    "Content-Type": "application/json",
                                },
                                body: JSON.stringify({
                                    message: "Update search.json after deleting files",
                                    content: btoa(JSON.stringify(searchContent, null, 2)),
                                    sha: searchData.sha,
                                }),
                            });
                            
                            if (!updateResponse.ok) {
                                console.error("Failed to update search.json");
                            }
                        }
                    } catch (error) {
                        console.error("Error updating search.json:", error);
                    }
                    
                    // Remove from local list
                    const allDeletedPaths = [...results.deleted, ...results.notFound];
                    allDeletedPaths.forEach(path => {
                        const index = allFiles.findIndex(file => file.path === path);
                        if (index > -1) {
                            allFiles.splice(index, 1);
                        }
                    });

                    window.selectedFiles.clear();
                    
                    // Re-render
                    renderFileList(allFiles, document.getElementById("file-search-input").value);
                    
                    // Show results
                    let message = `✅ Deletion completed!\n\n`;
                    if (results.deleted.length > 0) {
                        message += `Deleted: ${results.deleted.length} file(s)\n`;
                    }
                    if (results.notFound.length > 0) {
                        message += `Not found (removed from search.json): ${results.notFound.length} file(s)\n`;
                    }
                    if (results.failed.length > 0) {
                        message += `\n❌ Failed: ${results.failed.length} file(s)\n`;
                        results.failed.forEach(f => {
                            message += `- ${f.path.split("/").pop()}: ${f.error}\n`;
                        });
                    }
                    
                    alert(message);
                    
                    // Reset button - will be hidden by updateSelectionUI if no files are selected
                    deleteBtn.disabled = false;
                    deleteBtn.textContent = "🗑️ Delete Selected (0)";
                    deleteBtn.style.display = "none";
                };

                // Function to publish to GitHub
                window.publishToGitHub = async () => {
                    const apiKey = document.getElementById("github-api-key").value.trim();
                    const statusDiv = document.getElementById("publish-status");
                    const publishButton = document.getElementById("publish-button");
                    
                    // Validate inputs
                    if (!apiKey) {
                        statusDiv.style.display = "block";
                        statusDiv.style.background = "#f443361a";
                        statusDiv.style.border = "1px solid #f44336";
                        statusDiv.style.color = "#f44336";
                        statusDiv.textContent = "❌ Please enter your GitHub API key";
                        return;
                    }
                    
                    // Use window.selectedFiles instead of checking DOM
                    if (window.selectedFiles.size === 0) {
                        statusDiv.style.display = "block";
                        statusDiv.style.background = "#f443361a";
                        statusDiv.style.border = "1px solid #f44336";
                        statusDiv.style.color = "#f44336";
                        statusDiv.textContent = "❌ Please select at least one file to update";
                        return;
                    }
                    
                    // Convert Set to array and get file metadata from DOM
                    const filesToUpdate = Array.from(window.selectedFiles).map(filePath => {
                        const fileItem = document.querySelector(`.file-item[data-file="${filePath}"]`);
                        return {
                            path: filePath,
                            isNew: fileItem?.dataset.isNew === "true"
                        };
                    });
                    
                    // Disable button and show loading
                    publishButton.disabled = true;
                    publishButton.style.opacity = "0.6";
                    publishButton.style.cursor = "not-allowed";
                    statusDiv.style.display = "block";
                    statusDiv.style.background = "#2196f31a";
                    statusDiv.style.border = "1px solid #2196f3";
                    statusDiv.style.color = "#2196f3";
                    
                    const results = {
                        updated: [],
                        created: [],
                        failed: []
                    };
                    
                    try {
                        // Extract repository info from contentUrl
                        const contentUrl = CONFIG.contentUrl;
                        const githubMatch = contentUrl.match(/https?:\/\/([^.]+)\.github\.io\/([^\/]+)(?:\/(.*))?/);
                        
                        if (!githubMatch) {
                            throw new Error("Could not extract repository info from contentUrl");
                        }
                        
                        const repoOwner = githubMatch[1];
                        const repoName = githubMatch[2];
                        const basePath = githubMatch[3] || "";
                        
                        // Process each file
                        for (let i = 0; i < filesToUpdate.length; i++) {
                            const fileInfo = filesToUpdate[i];
                            const filePath = fileInfo.path;
                            const fileName = filePath.split("/").pop();
                            const isNewFile = fileInfo.isNew;
                            
                            statusDiv.innerHTML = `
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <div class="loading-spinner" style="border: 2px solid transparent; border-top: 2px solid #2196f3; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite;"></div>
                                    <span>Processing ${i + 1}/${filesToUpdate.length}: ${fileName}...</span>
                                </div>
                            `;
                            
                            try {
                                // Get content based on file type
                                const isHtmlFile = fileName.endsWith(".html");
                                let content;
                                
                                if (isHtmlFile) {
                                    let [finalHtml, sidebarContent, finalJS] = renderMarkdown(markdown);
                                    finalHtml += '<script id="entry-script">\n';
                                    finalHtml += finalJS;
                                    finalHtml += "\n<";
                                    finalHtml += "/script>";
                                    finalHtml += '<script id="sidebar-data" type="application/json">\n';
                                    finalHtml += JSON.stringify(sidebarContent, null, 4);
                                    finalHtml += "\n<";
                                    finalHtml += "/script>";
                                    content = finalHtml;
                                } else {
                                    content = markdown;
                                }
                                
                                // Convert full URL path to repository path
                                // Handle paths that may include folders (e.g., posts/tutorials/file.md)
                                let pathInRepo = filePath.replace(contentUrl, "").replace(/^\/+/, "");
                                if (basePath) {
                                    pathInRepo = basePath + "/" + pathInRepo;
                                }
                                
                                // GitHub API automatically creates necessary directories when you PUT a file
                                // No need to manually create directories
                                const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${pathInRepo}`;
                                
                                let sha = null;
                                
                                // Get current file SHA for existing files
                                if (!isNewFile) {
                                    const getResponse = await fetch(apiUrl, {
                                        headers: {
                                            "Authorization": `token ${apiKey}`,
                                            "Accept": "application/vnd.github.v3+json",
                                        },
                                    });
                                    
                                    if (getResponse.ok) {
                                        const fileData = await getResponse.json();
                                        sha = fileData.sha;
                                    }
                                }
                                
                                // Update or create file
                                const requestBody = {
                                    message: isNewFile ? `Create ${fileName} from Blog Editor` : `Update ${fileName} from Blog Editor`,
                                    content: btoa(unescape(encodeURIComponent(content))),
                                };
                                
                                if (sha) {
                                    requestBody.sha = sha;
                                }
                                
                                const updateResponse = await fetch(apiUrl, {
                                    method: "PUT",
                                    headers: {
                                        "Authorization": `token ${apiKey}`,
                                        "Accept": "application/vnd.github.v3+json",
                                        "Content-Type": "application/json",
                                    },
                                    body: JSON.stringify(requestBody),
                                });
                                
                                if (!updateResponse.ok) {
                                    const errorData = await updateResponse.json();
                                    throw new Error(errorData.message || `Failed to ${isNewFile ? "create" : "update"} file`);
                                }
                                
                                if (isNewFile) {
                                    results.created.push(fileName);
                                } else {
                                    results.updated.push(fileName);
                                }
                                
                            } catch (error) {
                                console.error(`Error processing ${fileName}:`, error);
                                results.failed.push({ file: fileName, error: error.message });
                            }
                        }
                        
                        // If there are new files, update search.json
                        const newFiles = filesToUpdate.filter(f => f.isNew);
                        if (newFiles.length > 0 && window.newFileSearchConfig) {
                            statusDiv.innerHTML = `
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <div class="loading-spinner" style="border: 2px solid transparent; border-top: 2px solid #2196f3; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite;"></div>
                                    <span>Updating search.json...</span>
                                </div>
                            `;
                            
                            try {
                                const searchJsonPath = basePath ? `${basePath}/search.json` : "search.json";
                                const searchJsonUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${searchJsonPath}`;
                                
                                const searchJsonResponse = await fetch(searchJsonUrl, {
                                    headers: {
                                        "Authorization": `token ${apiKey}`,
                                        "Accept": "application/vnd.github.v3+json",
                                    },
                                });
                                
                                if (searchJsonResponse.ok) {
                                    const searchJsonData = await searchJsonResponse.json();
                                    const currentSearchJson = JSON.parse(atob(searchJsonData.content));
                                    
                                    // Add the new entry with relative path (already stored correctly in newFileSearchConfig)
                                    currentSearchJson.entries.unshift(window.newFileSearchConfig);
                                    
                                    const updateSearchJsonResponse = await fetch(searchJsonUrl, {
                                        method: "PUT",
                                        headers: {
                                            "Authorization": `token ${apiKey}`,
                                            "Accept": "application/vnd.github.v3+json",
                                            "Content-Type": "application/json",
                                        },
                                        body: JSON.stringify({
                                            message: `Add entry to search index`,
                                            content: btoa(unescape(encodeURIComponent(JSON.stringify(currentSearchJson, null, 2)))),
                                            sha: searchJsonData.sha,
                                        }),
                                    });
                                    
                                    if (!updateSearchJsonResponse.ok) {
                                        console.error("Failed to update search.json");
                                    }
                                }
                                
                                delete window.newFileSearchConfig;
                                
                            } catch (searchJsonError) {
                                console.error("Error updating search.json:", searchJsonError);
                            }
                        }
                        
                        // Show results
                        let resultMessage = "✅ Operation completed!\n\n";
                        if (results.created.length > 0) {
                            resultMessage += `Created: ${results.created.join(", ")}\n`;
                        }
                        if (results.updated.length > 0) {
                            resultMessage += `Updated: ${results.updated.join(", ")}\n`;
                        }
                        if (results.failed.length > 0) {
                            resultMessage += `\n❌ Failed:\n`;
                            results.failed.forEach(f => {
                                resultMessage += `- ${f.file}: ${f.error}\n`;
                            });
                        }
                        
                        // Hide file list to prevent overflow
                        const fileListContainer = document.getElementById("publish-file-list");
                        const actionsContainer = document.getElementById("publish-actions");
                        if (fileListContainer) fileListContainer.style.display = "none";
                        if (actionsContainer) actionsContainer.style.display = "none";

                        if (results.failed.length === 0) {
                            statusDiv.style.background = "#4caf501a";
                            statusDiv.style.border = "1px solid #4caf50";
                            statusDiv.style.color = "#4caf50";
                        } else if (results.created.length > 0 || results.updated.length > 0) {
                            statusDiv.style.background = "#ff98001a";
                            statusDiv.style.border = "1px solid #ff9800";
                            statusDiv.style.color = "#ff9800";
                        } else {
                            statusDiv.style.background = "#f443361a";
                            statusDiv.style.border = "1px solid #f44336";
                            statusDiv.style.color = "#f44336";
                        }
                        
                        statusDiv.innerHTML = resultMessage.replace(/\n/g, '<br>');
                        
                        // Mark tab as saved
                        updateTabContent(activeTabId, markdown, false);
                        
                        // Clear selected files and uncheck all checkboxes
                        window.selectedFiles.clear();
                        document.querySelectorAll(".file-checkbox:checked").forEach(cb => cb.checked = false);
                        window.updateSelectionUI(false);
                        
                        // Close modal after 3 seconds if all succeeded
                        if (results.failed.length === 0) {
                            setTimeout(() => {
                                document.getElementById("publish-modal")?.remove();
                            }, 3000);
                        } else {
                            // Show file list again if there were failures
                            setTimeout(() => {
                                    if (fileListContainer) fileListContainer.style.display = "block";
                                    if (actionsContainer) actionsContainer.style.display = "flex";
                            }, 5000);
                        }
                        
                    } catch (error) {
                        console.error("Publish error:", error);
                        statusDiv.style.background = "#f443361a";
                        statusDiv.style.border = "1px solid #f44336";
                        statusDiv.style.color = "#f44336";
                        statusDiv.textContent = `❌ Error: ${error.message}`;

                            fileListContainer.style.display = "block";

                        publishButton.disabled = false;
                        publishButton.style.opacity = "1";
                        publishButton.style.cursor = "pointer";
                    }

            function checkForConfigurableBlock(position) {
                const editor = window.currentEditor;
                if (!editor) return;

                const model = editor.getModel();
                const lineContent = model.getLineContent(position.lineNumber).trim();

                let blockType = null;

                // Use regular expressions for better detection
                const gridMatch = lineContent.match(/^(\s*):::grid/);
                const noteMatch = lineContent.match(/^(\s*):::note/);
                const warningMatch = lineContent.match(/^(\s*):::warning/);
                const detailsMatch = lineContent.match(/^(\s*):::details/);
                const iframeMatch = lineContent.match(/^(\s*):::iframe/);
                const connectorMatch = lineContent.match(/^(\s*):::connector/);
                const floatMatch = lineContent.match(/^(\s*):::float-/);
                const animationMatch = lineContent.match(/^(\s*)```animation/);
                const svgMatch = lineContent.match(/^(\s*)```svg/);

                if (gridMatch) {
                    blockType = "grid";
                } else if (noteMatch) {
                    blockType = "note";
                } else if (warningMatch) {
                    blockType = "warning";
                } else if (detailsMatch) {
                    blockType = "details";
                } else if (iframeMatch) {
                    blockType = "iframe";
                } else if (connectorMatch) {
                    blockType = "connector";
                } else if (floatMatch) {
                    blockType = "float";
                } else if (animationMatch) {
                    blockType = "animation";
                } else if (svgMatch) {
                    blockType = "svg";
                }

                if (blockType) {
                    currentBlockType = blockType;
                    currentLineNumber = position.lineNumber;
                    showConfigButton(blockType);
                } else {
                    // Clear state completely when there is no configurable block
                    currentBlockType = null;
                    currentLineNumber = null;
                    hideConfigButton();

                    // Also close the assistant if it's open
                    const assistant = document.getElementById("config-assistant");
                    if (assistant && !assistant.classList.contains("hidden")) {
                        hideConfigAssistant();
                    }
                }
            }

            function showConfigButton(blockType) {
                const button = document.getElementById("config-line-button");
                const text = document.getElementById("config-line-text");

                button.classList.remove("hidden");
                text.textContent = `Configure ${blockType}`;
            }

            function hideConfigButton() {
                const button = document.getElementById("config-line-button");
                button.classList.add("hidden");
            }

            function showConfigAssistant(blockType, currentLine) {
                const assistant = document.getElementById("config-assistant");
                const title = document.getElementById("config-title");
                const content = document.getElementById("config-content");

                const config = blockConfigurations[blockType];
                if (!config) return;

                title.textContent = config.title;
                content.innerHTML = generateConfigContent(config, currentLine);

                assistant.classList.remove("hidden");
                hideConfigButton(); // Ocultar el botón cuando se abre el panel
            }

            function hideConfigAssistant() {
                const assistant = document.getElementById("config-assistant");
                assistant.classList.add("hidden");

                // Si hay un bloque configurable en la línea actual, mostrar el botón de nuevo
                // Solo si currentBlockType existe
                if (currentBlockType && currentLineNumber) {
                    showConfigButton(currentBlockType);
                }
                // Si no hay bloque configurable, limpiar estado completamente
                else {
                    currentBlockType = null;
                    currentLineNumber = null;
                    hideConfigButton();
                }
            }

            function generateConfigContent(config, currentLine) {
                let html = "";

                // Parse current line to extract existing configurations
                const parsed = parseExistingOptions(currentLine);
                const existingOptions = parsed.options;
                const remainingText = parsed.remainingText;

                // Store additional text to preserve it
                window.currentRemainingText = remainingText;

                // Initialize custom options from existing line
                window.customConfigOptions = existingOptions.filter(
                    (opt) => opt.includes("style=") || opt.includes("min-") || opt.includes("=")
                );

                config.sections.forEach((section) => {
                    html += `<div class="config-section">`;
                    html += `<div class="config-section-title">${section.title}</div>`;

                    if (section.type === "options") {
                        html += `<div class="config-options">`;
                        section.options.forEach((option) => {
                            const isActive = existingOptions.includes(option);
                            html += `<div class="config-option ${
                                isActive ? "active" : ""
                            }" data-option="${option}">${option}</div>`;
                        });
                        html += `</div>`;
                    } else if (section.type === "custom") {
                        // Check if we have inputs array (new format)
                        if (section.inputs && Array.isArray(section.inputs)) {
                            html += `<div class="config-custom-input">`;

                            section.inputs.forEach((input) => {
                                if (input.type === "text") {
                                    let existingValue = "";

                                    // If we are in a float block, we try to extract the ID
                                    if (input.data === "float-id" && currentBlockType === "float") {
                                        // Extract the ID from the float name (:::float-ID)
                                        const floatMatch = currentLine.match(/^(\s*):::float-(\S+)/);
                                        if (floatMatch && floatMatch[2]) {
                                            existingValue = floatMatch[2];

                                            // Store the original ID for reference
                                            window.originalFloatId = existingValue;
                                        }
                                    }

                                    html += `<label for="${input.id}">${input.label}</label>`;
                                    html += `<input autocomplete="off" type="text" id="${input.id}" placeholder="${input.placeholder}" 
                                        data-input="${input.data}" value="${existingValue}" 
                                        oninput="window.${input.onChange}(this)">`;
                                }
                            });

                            html += `</div>`;
                        }
                        // The old format for compatibility
                        else {
                            html += `<div class="config-custom-input">`;

                            // Get existing value for this specific pattern type
                            let existingValue = "";
                            let matchingOption = null;

                            // Pattern matching that works with actual pattern values
                            if (section.pattern.includes("style=")) {
                                // Look for style= options
                                matchingOption = existingOptions.find((opt) => opt.includes("style="));
                            } else if (section.pattern.includes("height=")) {
                                // Look for height= options
                                matchingOption = existingOptions.find((opt) => opt.includes("height="));
                            } else if (section.pattern.includes("min-")) {
                                // Look for min- options
                                matchingOption = existingOptions.find((opt) => opt.startsWith("min-"));
                            } else if (section.pattern === "{value}") {
                                // Look for generic attribute options (like iframe attributes)
                                matchingOption = existingOptions.find(
                                    (opt) =>
                                        /^width\s*=\s*".+"$/i.test(opt) &&
                                        !opt.includes("style=") &&
                                        !opt.includes("height=") &&
                                        !opt.startsWith("min-") &&
                                        !opt.startsWith("cols-") &&
                                        !opt.startsWith("gap-")
                                );
                            }

                            if (matchingOption) {
                                if (
                                    section.pattern.includes("style=") &&
                                    matchingOption.includes('style="')
                                ) {
                                    const match = matchingOption.match(/style="([^"]*)"/);
                                    existingValue = match ? match[1] : "";
                                } else if (
                                    section.pattern.includes("height=") &&
                                    matchingOption.includes("height=")
                                ) {
                                    // Extract value from height="value" or height='value'
                                    const match = matchingOption.match(/height=["']?([^"']*)["']?/);
                                    existingValue = match ? match[1] : "";
                                } else if (
                                    section.pattern.includes("min-") &&
                                    matchingOption.startsWith("min-")
                                ) {
                                    existingValue = matchingOption.replace("min-", "");
                                } else if (section.pattern === "{value}") {
                                    existingValue = matchingOption.replace(/"/g, "&#34;").trim();
                                }
                            }

                            html += `<input type="text" placeholder="${section.placeholder}" data-pattern="${section.pattern}" value="${existingValue}" oninput="window.handleCustomInput(this)">`;
                            html += `</div>`;
                        }
                    } else if (section.type === "info") {
                        html += `<div class="config-info">${section.info}</div>`;
                    }

                    html += `</div>`;
                });

                // Current line preview
                html += `<div class="config-preview" id="config-preview">${currentLine}</div>`;
                html += `<button class="config-apply" onclick="window.applyConfiguration()">Apply Changes</button>`;

                return html;
            }

            function parseExistingOptions(currentLine) {
                // Extract options from a line like ":::grid cols-2 gap-4 responsive style="background: red" additional title"
                // or "```animation-loop-autoplay style="height:15em;" title"
                let match;
                let restOfLine = "";

                if (currentLine.trim().startsWith(":::")) {
                    // For blocks that start with :::
                    const blockRegex = /^(\s*):::([a-z-]+)(.*)$/;
                    match = currentLine.match(blockRegex);

                    if (!match) return { options: [], remainingText: "" };
                    restOfLine = match[3].trim();
                } else if (currentLine.trim().startsWith("```")) {
                    // For blocks that start with ``` (animation, svg, etc)
                    const blockRegex = /^(\s*)```([a-z-]+)(.*)$/;
                    match = currentLine.match(blockRegex);

                    if (!match) return { options: [], remainingText: "" };
                    restOfLine = match[3].trim();
                } else {
                    return { options: [], remainingText: "" };
                }

                if (!restOfLine) return { options: [], remainingText: "" };

                // Separate options from additional text
                // First, parse considering quotes for styles
                const options = [];
                let current = "";
                let inQuotes = false;
                let quoteChar = "";
                let remainingText = "";
                let foundEndOfOptions = false;

                for (let i = 0; i < restOfLine.length; i++) {
                    const char = restOfLine[i];

                    if ((char === '"' || char === "'") && !inQuotes) {
                        inQuotes = true;
                        quoteChar = char;
                        current += char;
                    } else if (char === quoteChar && inQuotes) {
                        inQuotes = false;
                        current += char;
                        quoteChar = "";
                    } else if (char === " " && !inQuotes) {
                        if (current.trim()) {
                            // Check if this word is a valid option or additional text
                            const trimmedCurrent = current.trim();
                            if (isValidOption(trimmedCurrent)) {
                                options.push(trimmedCurrent);
                                current = "";
                            } else {
                                // It's additional text, capture the rest
                                foundEndOfOptions = true;
                                remainingText = restOfLine.substring(i - current.length).trim();
                                break;
                            }
                        }
                    } else {
                        current += char;
                    }
                }

                // Process the last token
                if (current.trim() && !foundEndOfOptions) {
                    const trimmedCurrent = current.trim();
                    if (isValidOption(trimmedCurrent)) {
                        options.push(trimmedCurrent);
                    } else {
                        remainingText = trimmedCurrent;
                    }
                }

                return { options, remainingText };
            }

            function isValidOption(text) {
                // List of known valid options
                const validPrefixes = ["cols-", "gap-", "min-", "style="];
                const validStandalone = [
                    "responsive",
                    "auto-fit",
                    "equal-height",
                    "-open",
                    "loop",
                    "autoplay",
                ];

                // Check if it's a valid standalone option
                if (validStandalone.includes(text)) {
                    return true;
                }

                // Check if it starts with a valid prefix
                if (validPrefixes.some((prefix) => text.startsWith(prefix))) {
                    return true;
                }

                // For other special cases that could be options
                // Like HTML attributes for iframe, etc.
                if (text.includes("=") && !text.startsWith(":::") && !text.startsWith("```")) {
                    return true;
                }

                // Additional check for combined options (like animation-loop-autoplay)
                if (
                    text.startsWith("animation-") ||
                    text.includes("-loop") ||
                    text.includes("-autoplay")
                ) {
                    return true;
                }

                return false;
            }

            // Variable to control if the assistant has been initialized
            let configAssistantInitialized = false;

            function initializeConfigAssistant() {
                // Avoid multiple initialization
                if (configAssistantInitialized) return;
                configAssistantInitialized = true;

                // Click on configuration button
                document.getElementById("config-line-button").addEventListener("click", () => {
                    if (currentBlockType && currentLineNumber) {
                        const editor = window.currentEditor;
                        const model = editor.getModel();
                        const lineContent = model.getLineContent(currentLineNumber);
                        showConfigAssistant(currentBlockType, lineContent);
                    }
                });

                // Close assistant
                document.getElementById("config-close").addEventListener("click", hideConfigAssistant);

                // Event delegation for config options (visual toggles only)
                document.getElementById("config-assistant").addEventListener("click", (e) => {
                    if (
                        e.target.classList.contains("config-option") &&
                        !e.target.classList.contains("remove-option")
                    ) {
                        e.preventDefault();
                        e.stopPropagation();
                        toggleConfigOption(e.target);
                    }
                });

                // Escape key to close
                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") {
                        hideConfigAssistant();
                    }
                });
            }

            function toggleConfigOption(optionElement) {
                const option = optionElement.dataset.option;
                const isCurrentlyActive = optionElement.classList.contains("active");

                // For mutually exclusive options (same prefix)
                if (option.startsWith("cols-") || option.startsWith("gap-")) {
                    const prefix = option.split("-")[0] + "-";

                    if (isCurrentlyActive) {
                        // If already active, just deactivate it (allow deselection)
                        optionElement.classList.remove("active");
                    } else {
                        // If not active, deactivate all from group and activate this one
                        document.querySelectorAll(".config-option").forEach((opt) => {
                            if (opt.dataset.option && opt.dataset.option.startsWith(prefix)) {
                                opt.classList.remove("active");
                            }
                        });

                        optionElement.classList.add("active");
                    }
                } else {
                    // For non-mutually exclusive options, simply toggle

                    if (isCurrentlyActive) {
                        optionElement.classList.remove("active");
                    } else {
                        optionElement.classList.add("active");
                    }
                }

                updatePreview();
            }

            function updatePreview() {
                if (!currentBlockType || !currentLineNumber) {
                    return;
                }

                const editor = window.currentEditor;
                if (!editor) {
                    return;
                }

                const preview = document.getElementById("config-preview");

                let spacesStartPreview = preview.textContent.match(/^\s*/)[0] || "";

                // Determine the correct prefix based on the block type
                let blockStart;
                if (currentBlockType === "animation" || currentBlockType === "svg") {
                    blockStart = spacesStartPreview + `\`\`\`${currentBlockType}`;
                } else {
                    blockStart = spacesStartPreview + `:::${currentBlockType}`;
                }

                // Get active options from visual toggles
                const activeOptions = Array.from(document.querySelectorAll(".config-option.active"))
                    .map((el) => el.dataset.option)
                    .filter((option) => option && option.trim() !== "");

                // Add custom options that were added via input
                if (window.customConfigOptions && window.customConfigOptions.length > 0) {
                    activeOptions.push(...window.customConfigOptions);
                }

                // Remove duplicates and filter empty options
                const uniqueOptions = [...new Set(activeOptions)];

                // Build new line
                let newLine = blockStart;
                if (uniqueOptions.length > 0) {
                    newLine += " " + uniqueOptions.join(" ");
                }

                // Add additional text if it exists
                if (window.currentRemainingText && window.currentRemainingText.trim()) {
                    newLine += " " + window.currentRemainingText;
                }

                // Update preview
                
                if (preview) {
                    preview.textContent = newLine;
                }
            }

            function applyConfiguration() {
                if (!currentBlockType || !currentLineNumber) return;

                const editor = window.currentEditor;
                if (!editor) return;

                const preview = document.getElementById("config-preview");
                const newLine = preview.textContent;

                const model = editor.getModel();

                // Special case for ID changes in float blocks
                if (currentBlockType === "float" && window.originalFloatId) {
                    // Extract the new ID from the updated text
                    const floatMatch = newLine.match(/^(\s*):::float-(\S+)/);
                    if (floatMatch && floatMatch[2]) {
                        const newFloatId = floatMatch[2];

                        if (newFloatId !== window.originalFloatId) {
                            // Check if the new ID already exists in another element
                            if (!isFloatIdUnique(newFloatId, window.originalFloatId, editor)) {
                                alert(
                                    `An element with the ID "${newFloatId}" already exists. The changes will not be applied. Please choose a unique ID.`
                                );
                                return;
                            }

                            // Search and replace all activation points (?=originalId)
                            const fullText = model.getValue();
                            const updatedText = fullText
                                .replace(
                                    new RegExp(`\\(\\?=${window.originalFloatId}\\)`, "g"),
                                    `(?=${newFloatId})`
                                )
                                .replace(
                                    new RegExp(`:::float-${window.originalFloatId}(\\s*$)`, "gm"),
                                    `:::float-${newFloatId}`
                                );

                            if (fullText !== updatedText) {
                                // Only apply if there are changes
                                const fullRange = {
                                    startLineNumber: 1,
                                    startColumn: 1,
                                    endLineNumber: model.getLineCount(),
                                    endColumn: model.getLineMaxColumn(model.getLineCount()),
                                };

                                editor.executeEdits("", [
                                    {
                                        range: fullRange,
                                        text: updatedText,
                                    },
                                ]);
                            }
                        }
                    }
                    hideConfigAssistant();
                    editor.focus();
                    return;
                }

                // Apply changes to editor
                const range = {
                    startLineNumber: currentLineNumber,
                    startColumn: 1,
                    endLineNumber: currentLineNumber,
                    endColumn: model.getLineMaxColumn(currentLineNumber),
                };

                console.log("Applying new line:", newLine);

                editor.executeEdits("", [
                    {
                        range: range,
                        text: newLine,
                    },
                ]);

                // Close assistant only, but keep button visible
                hideConfigAssistant();

                // Keep configurable block state
                // Don't clear currentBlockType and currentLineNumber

                // Focus back to editor
                editor.focus();
            }

            // Debounce timer and processing flag for input handling
            let inputDebounceTimer = null;
            let isProcessingInput = false;

            function handleCustomInput(inputElement) {
                // Clear previous timer
                if (inputDebounceTimer) {
                    clearTimeout(inputDebounceTimer);
                }

                // Set new timer with longer debounce to prevent multiple executions
                inputDebounceTimer = setTimeout(() => {
                    if (!isProcessingInput) {
                        handleCustomInputImmediate(inputElement);
                    }
                }, 500); // 500ms delay to ensure user has stopped typing
            }

            function handleCustomInputImmediate(inputElement) {
                // Prevent concurrent executions
                if (isProcessingInput) {
                    return;
                }

                isProcessingInput = true;

                const pattern = inputElement.dataset.pattern;
                const value = inputElement.value.trim();

                try {
                    if (!pattern) {
                        console.error("No pattern found for input");
                        return;
                    }

                    // Initialize custom options array if not exists
                    window.customConfigOptions = window.customConfigOptions || [];

                    // Remove ALL existing options with the same pattern type (aggressive filtering)
                    const originalLength = window.customConfigOptions.length;
                    window.customConfigOptions = window.customConfigOptions.filter((opt) => {
                        let shouldRemove = false;

                        // Check if this is a style pattern (any pattern containing "style")
                        if (pattern.includes("style=")) {
                            // Remove ANY option that contains 'style='
                            if (opt.includes("style=")) {
                                shouldRemove = true;
                            }
                        } else if (pattern.includes("height=")) {
                            // Remove ANY option that contains 'height='
                            if (opt.includes("height=")) {
                                shouldRemove = true;
                            }
                        } else if (pattern.includes("min-")) {
                            // Remove ANY option that starts with 'min-'
                            if (opt.startsWith("min-")) {
                                shouldRemove = true;
                            }
                        } else if (pattern === "{value}") {
                            // Remove generic attributes (but not style=, height= or min-)
                            if (
                                opt.includes("=") &&
                                !opt.includes("style=") &&
                                !opt.includes("height=") &&
                                !opt.startsWith("min-") &&
                                !opt.startsWith("cols-") &&
                                !opt.startsWith("gap-")
                            ) {
                                shouldRemove = true;
                            }
                        }

                        return !shouldRemove; // Keep options that should NOT be removed
                    });

                    // If value is not empty, add new option
                    if (value) {
                        let optionText;

                        // Handle different pattern types with pattern detection
                        if (pattern.includes("style=")) {
                            // For styles, construct with quotes
                            optionText = `style="${value}"`;
                        } else if (pattern.includes("height=")) {
                            // Para altura, sin comillas para facilitar el uso
                            optionText = `height="${value}"`;
                        } else if (pattern.includes("min-")) {
                            // For min values
                            optionText = `min-${value}`;
                        } else if (pattern === "{value}") {
                            // For generic attributes
                            optionText = value;
                        } else {
                            // Fallback for other patterns
                            optionText = pattern.replace("{value}", value);
                        }

                        // Double-check for duplicates before adding
                        if (!window.customConfigOptions.includes(optionText)) {
                            window.customConfigOptions.push(optionText);
                        }
                    }

                    updatePreview();
                } finally {
                    // Always release the processing flag
                    isProcessingInput = false;
                }
            }

            function addCustomOption(button) {
                // Legacy function - now handled by handleCustomInput
                const input = button ? button.previousElementSibling : null;
                if (input) {
                    handleCustomInput(input);
                }
            }

            // Function to check if a floating element ID is unique
            function isFloatIdUnique(newId, currentId = null, editor = window.currentEditor) {
                if (!editor || !newId) return false;

                const currentContent = editor.getValue();

                // Patterns to search for elements with the specified ID
                const triggerPattern = new RegExp(`\\(?=\\s*${newId}\\s*\\)`, "i");
                const floatPattern = new RegExp(`:::float-\\s*${newId}\\s*$`, "mi");

                return !(triggerPattern.test(currentContent) || floatPattern.test(currentContent));
            }

            // Function to change the ID of floating elements
            function handleFloatIdChange(inputElement) {
                // Clear previous timer
                if (inputDebounceTimer) {
                    clearTimeout(inputDebounceTimer);
                }

                // Set new timer with longer debounce to prevent multiple executions
                inputDebounceTimer = setTimeout(() => {
                    if (!isProcessingInput) {
                        isProcessingInput = true;
                        try {
                            const newId = inputElement.value.trim();

                            if (newId && window.originalFloatId && newId !== window.originalFloatId) {
                                // Actualizar solo en la vista previa
                                const preview = document.getElementById("config-preview");
                                if (preview) {
                                    preview.textContent = ":::float-" + newId;
                                }
                            }
                        } finally {
                            isProcessingInput = false;
                        }
                    }
                }, 100);
            }

            // Make functions globally accessible
            window.applyConfiguration = applyConfiguration;
            window.addCustomOption = addCustomOption;
            window.handleCustomInput = handleCustomInput;
            window.handleCustomInputImmediate = handleCustomInputImmediate;
            window.handleFloatIdChange = handleFloatIdChange;

            // Initialize sidebar after rendering
            // With a small timeout to ensure DOM is ready
            setTimeout(() => {
                initSidebar([]);
                initializeConfigAssistant();
            }, 0);
        </script>
    </body>
</html>
